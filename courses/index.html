<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses | Nexus Prime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --math-primary: #ec4899; --math-dark: #09090b; }
        body { font-family: 'Outfit', sans-serif; background-color: var(--math-dark); color: #f4f4f5; overflow-x: hidden; opacity: 0; transition: opacity 0.5s ease; }
        body.auth-ready { opacity: 1; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        #math-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -10; }
        .glass-card { background: rgba(24, 24, 27, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .glass-card:hover { border-color: rgba(236, 72, 153, 0.5); transform: translateY(-10px); background: rgba(24, 24, 27, 0.6); }
        .gradient-text { background: linear-gradient(to bottom right, #fff 30%, #ec4899 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem; }
        .course-image-container { width: 100%; height: 180px; background: #18181b; position: relative; overflow: hidden; }
        .course-image { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .glass-card:hover .course-image { transform: scale(1.1); }
    </style>
</head>
<body class="bg-[#09090b]">
    <div id="math-canvas"></div>

    <main class="relative z-10 min-h-screen">
        <nav class="fixed top-0 w-full z-50 p-6 flex justify-between items-center backdrop-blur-md bg-black/20 border-b border-white/5">
            <a href="index.html" class="flex items-center space-x-3 group">
                <div class="w-10 h-10 bg-pink-600 rounded-lg flex items-center justify-center font-black text-xl transition-transform group-hover:rotate-12">Σ</div>
                <div class="font-black text-xl tracking-tighter">NEXUS<span class="text-pink-500">PRIME</span></div>
            </a>
            <div class="flex items-center space-x-6">
                <div id="user-display" class="hidden md:flex items-center space-x-3">
                    <span id="user-email" class="mono text-[10px] text-gray-400">...</span>
                    <button onclick="handleLogout()" class="text-[10px] font-bold uppercase tracking-[0.2em] text-pink-500 hover:text-white transition">Logout</button>
                </div>
                <div class="mono text-xs text-pink-500 font-bold uppercase tracking-widest px-4">Student Portal</div>
            </div>
        </nav>

        <section class="pt-40 pb-20 px-6">
            <div class="max-w-6xl mx-auto text-center">
                <div class="inline-flex items-center space-x-2 px-4 py-1.5 rounded-full bg-pink-500/10 border border-pink-500/30 text-pink-400 text-[10px] font-black uppercase tracking-[0.3em] mb-8">
                    <i data-lucide="shield-check" class="w-3 h-3"></i>
                    <span>Authenticated Access</span>
                </div>
                <h1 class="text-6xl md:text-7xl font-black mb-6 tracking-tighter">Available <span class="gradient-text">Modules</span></h1>
                <p class="text-gray-400 max-w-2xl mx-auto text-lg leading-relaxed">Enroll in your specialized Combined Mathematics curriculum. Access is granted upon approval.</p>
            </div>
        </section>

        <section class="pb-32 px-6">
            <div class="max-w-6xl mx-auto">
                <div id="course-loader" class="flex flex-col items-center py-20">
                    <div class="w-12 h-12 border-4 border-pink-500/20 border-t-pink-500 rounded-full animate-spin mb-4"></div>
                    <p class="mono text-xs text-gray-500 uppercase tracking-widest animate-pulse">Querying Nexus DB...</p>
                </div>
                <div id="courses-container" class="course-grid hidden"></div>
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Core Enrollment Function
        window.enrollInCourse = async function(btn, courseId) {
            try {
                // UI feedback
                const originalText = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = `<span class="flex items-center justify-center gap-2"><i data-lucide="loader" class="w-3 h-3 animate-spin"></i> Processing...</span>`;
                lucide.createIcons();

                const { data: { session } } = await sb.auth.getSession();
                if (!session) {
                    window.location.href = 'login.html';
                    return;
                }

                // Check for existing enrollment first to handle status redirecting more intelligently
                const { data: existing } = await sb
                    .from('course_status')
                    .select('status')
                    .eq('user_id', session.user.id)
                    .eq('course_id', courseId)
                    .maybeSingle();

                if (existing && existing.status === 'approved') {
                    // Cache the course ID even for already approved users before redirect
                    sessionStorage.setItem('active_course_id', courseId);
                    window.location.href = '/curriculum';
                    return;
                }

                // Insert/Update status to pending
                const { error } = await sb
                    .from('course_status')
                    .upsert({ 
                        user_id: session.user.id, 
                        course_id: courseId,
                        status: 'pending',
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'user_id,course_id' });

                if (error) throw error;

                // Save to session for the tracking page
                sessionStorage.setItem('pending_course_id', courseId);
                
                // Redirect to status page
                window.location.href = 'approvestatus.html';

            } catch (err) {
                console.error("Enrollment error details:", err);
                btn.disabled = false;
                btn.innerHTML = `<span class="text-red-400">Retry Enrollment</span>`;
                
                // If the error is likely a permission issue (RLS)
                if (err.code === '42501') {
                    console.error("Check your RLS policies for course_status table.");
                }

                setTimeout(() => { 
                    btn.innerHTML = "Enroll Now"; 
                }, 3000);
            }
        };

        async function checkAuth() {
            try {
                const { data: { session } } = await sb.auth.getSession();
                if (!session) return window.location.href = 'login.html';
                document.body.classList.add('auth-ready');
                document.getElementById('user-display').classList.remove('hidden');
                document.getElementById('user-email').textContent = session.user.email;
                fetchCourses();
            } catch (e) {
                window.location.href = 'login.html';
            }
        }

        async function fetchCourses() {
            const { data: courses, error } = await sb.from('courses').select('*');
            if (error) {
                console.error("Fetch courses error:", error);
                document.getElementById('course-loader').innerHTML = `<p class="text-red-500">Failed to load modules. Check connection.</p>`;
                return;
            }
            
            const container = document.getElementById('courses-container');
            container.innerHTML = courses.map(c => `
                <div class="glass-card rounded-[2rem] flex flex-col h-full group overflow-hidden">
                    <div class="course-image-container">
                        <img src="${c.image_url || 'https://images.unsplash.com/photo-1509228468518-180dd4864904?w=800'}" class="course-image" onerror="this.src='https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=800'">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                    </div>
                    <div class="p-8 flex flex-col flex-grow">
                        <h3 class="text-2xl font-black mb-1 leading-tight group-hover:text-pink-500 transition-colors">${c.name}</h3>
                        <p class="mono text-[11px] text-gray-500 uppercase tracking-widest mb-4">By ${c.instructor || 'Nexus Faculty'}</p>
                        <p class="text-gray-400 text-sm leading-relaxed mb-8 flex-grow">${c.description || 'Advanced combined mathematics module.'}</p>
                        <div class="pt-6 border-t border-white/5">
                            <button onclick="enrollInCourse(this, '${c.id}')" class="block w-full py-4 bg-white/5 border border-white/10 group-hover:bg-pink-600 group-hover:border-pink-600 text-center font-bold text-xs uppercase tracking-[0.2em] rounded-xl transition-all">
                                Enroll Now
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
            document.getElementById('course-loader').classList.add('hidden');
            container.classList.remove('hidden');
            lucide.createIcons();
        }

        window.handleLogout = async () => { 
            await sb.auth.signOut(); 
            window.location.href = 'login.html'; 
        };

        const initScene = () => {
            const container = document.getElementById('math-canvas');
            if (!container) return;
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 100;
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);
            const particles = new THREE.BufferGeometry();
            const posArr = new Float32Array(1000 * 3);
            for(let i=0; i<3000; i++) posArr[i] = (Math.random() - 0.5) * 400;
            particles.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
            const pSystem = new THREE.Points(particles, new THREE.PointsMaterial({ size: 0.5, color: 0xec4899, transparent: true, opacity: 0.2 }));
            scene.add(pSystem);
            const animate = () => { requestAnimationFrame(animate); pSystem.rotation.y += 0.0002; renderer.render(scene, camera); };
            animate();
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        };

        document.addEventListener('DOMContentLoaded', () => { 
            initScene(); 
            checkAuth(); 
        });
    </script>
</body>
</html>
