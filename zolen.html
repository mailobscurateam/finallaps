<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Hub - Zoom Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js" type="module"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --f1-red: #e10600;
            --f1-black: #050505;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', sans-serif;
            background-color: var(--f1-black);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            background: #000;
            border: 1px solid #222;
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 0; opacity: 0; transition: opacity 1s ease-in;
        }

        .video-container iframe.visible { opacity: 1; }

        .status-bar { height: 4px; background: #111; position: relative; overflow: hidden; }
        .status-progress { position: absolute; height: 100%; background: var(--f1-red); width: 0%; transition: width 0.3s; }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px; font-size: 0.7rem; font-weight: 900;
            text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s;
        }
        .nav-btn:hover { background: var(--f1-red); border-color: var(--f1-red); color: white; }

        .telemetry-box {
            border-left: 2px solid var(--f1-red);
            background: linear-gradient(90deg, rgba(225, 6, 0, 0.05), transparent);
            padding: 1rem;
        }

        .preloader-overlay {
            position: absolute; inset: 0; background: #0a0a0a;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 20; transition: opacity 0.5s ease-out;
        }
    </style>
</head>
<body>

    <header class="p-6 border-b border-white/10 flex justify-between items-center bg-black/50 backdrop-blur-md sticky top-0 z-50">
        <div>
            <h1 class="text-lg font-black italic tracking-tighter">
                ZOOM <span class="text-red-600">FEED</span>
            </h1>
            <p id="lesson-title" class="text-[10px] text-gray-500 tracking-[3px] uppercase mt-1">Authenticating Data Stream...</p>
        </div>
        <div class="flex items-center gap-6">
            <div id="timer-display" class="hidden text-right">
                <p class="text-[8px] text-gray-500 uppercase font-bold tracking-widest">Time Remaining</p>
                <p id="time-left" class="text-sm font-black text-red-500 tracking-tighter">--:--</p>
            </div>
            <button onclick="goBack()" class="nav-btn">Return to Pits</button>
        </div>
    </header>

    <div class="status-bar">
        <div id="loading-bar" class="status-progress"></div>
    </div>

    <main class="flex-1 p-4 md:p-8 max-w-6xl mx-auto w-full">
        <div id="telemetry-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="telemetry-box">
                <p class="text-[9px] text-gray-500 uppercase font-bold">Module ID</p>
                <p id="info-id" class="text-sm font-bold">--</p>
            </div>
            <div class="telemetry-box">
                <p class="text-[9px] text-gray-500 uppercase font-bold">Session Limit</p>
                <p id="info-limit" class="text-sm font-bold tracking-widest">CALCULATING...</p>
            </div>
            <div class="telemetry-box">
                <p class="text-[9px] text-gray-500 uppercase font-bold">Status</p>
                <p id="info-status" class="text-sm font-bold text-yellow-500 italic uppercase">Syncing...</p>
            </div>
        </div>

        <div id="video-wrapper" class="video-container shadow-2xl rounded-sm">
            <div id="preloader" class="preloader-overlay">
                <div id="spinner" class="w-12 h-12 border-2 border-red-600 border-t-transparent rounded-full animate-spin mb-4"></div>
                <p id="loader-text" class="text-[10px] font-bold tracking-[4px] text-gray-600 uppercase text-center">Checking Flight Clearances...</p>
            </div>
            <div id="iframe-holder"></div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIGURATION
        const GOOGLE_SHEET_ID = '1HLQxJv32eo-EloTtdZhw5ZhEWIXuhMOI7OAKsqG-dfI';
        const GOOGLE_API_KEY = 'AIzaSyD3sts8y_s8M8L2Y66Gz0ICY_9SY-VmoEo';
        const LESSONS_SHEET = 'lessons';
        
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('course');
        const lessonId = urlParams.get('lesson');
        
        let currentUser = null;
        let allowedSeconds = 0;
        let watchedSeconds = 0;
        let heartbeatInterval = null;

        // AUTH INITIALIZATION
        async function init() {
            await signInAnonymously(auth);
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    document.body.style.opacity = '1';
                    loadLessonAndCheckLimit();
                }
            });
        }

        async function loadLessonAndCheckLimit() {
            const loadingBar = document.getElementById('loading-bar');
            loadingBar.style.width = '30%';

            try {
                // Fetch limit and video from Sheet
                const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${GOOGLE_SHEET_ID}/values/${LESSONS_SHEET}!A2:L500?key=${GOOGLE_API_KEY}`);
                const data = await response.json();
                
                if (!data.values) throw new Error("No data found");

                const row = data.values.find(r => r[1] === lessonId && r[0] === courseId);
                if (!row) {
                    showError("MODULE NOT FOUND");
                    return;
                }

                // Column K (Index 10) = Hours, Column L (Index 11) = Minutes
                const hours = parseInt(row[10]) || 0;
                const minutes = parseInt(row[11]) || 0;
                allowedSeconds = (hours * 3600) + (minutes * 60);
                
                document.getElementById('lesson-title').innerText = row[3].toUpperCase();
                document.getElementById('info-id').innerText = lessonId.toUpperCase();
                document.getElementById('info-limit').innerText = `${hours}H ${minutes}M`;

                // Check Database for existing progress
                const sessionRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'watch_sessions', `${courseId}_${lessonId}`);
                const sessionSnap = await getDoc(sessionRef);

                if (sessionSnap.exists()) {
                    watchedSeconds = sessionSnap.data().total_seconds_watched || 0;
                } else {
                    await setDoc(sessionRef, { 
                        total_seconds_watched: 0, 
                        courseId, 
                        lessonId,
                        last_updated: new Date().toISOString() 
                    });
                }

                if (watchedSeconds >= allowedSeconds) {
                    showError("ACCESS EXPIRED: WATCH LIMIT REACHED");
                    return;
                }

                prepareVideo(row[5]); // Column F
                startHeartbeat();

            } catch (err) {
                console.error(err);
                showError("CONNECTION TIMEOUT");
            }
        }

        function prepareVideo(url) {
            const holder = document.getElementById('iframe-holder');
            const iframe = document.createElement('iframe');
            iframe.id = "video-iframe";
            iframe.src = url;
            iframe.allow = "autoplay; fullscreen";
            
            iframe.onload = () => {
                document.getElementById('loading-bar').style.width = '100%';
                document.getElementById('info-status').innerText = "LINK ACTIVE";
                document.getElementById('info-status').className = "text-sm font-bold text-green-500 italic uppercase";
                document.getElementById('preloader').style.opacity = '0';
                document.getElementById('timer-display').classList.remove('hidden');
                updateTimerUI();
                
                setTimeout(() => {
                    document.getElementById('preloader').style.display = 'none';
                    iframe.classList.add('visible');
                    document.getElementById('loading-bar').style.opacity = '0';
                }, 500);
            };
            holder.appendChild(iframe);
        }

        function startHeartbeat() {
            heartbeatInterval = setInterval(async () => {
                watchedSeconds += 10;
                updateTimerUI();

                // Save progress to database
                const sessionRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'watch_sessions', `${courseId}_${lessonId}`);
                await updateDoc(sessionRef, {
                    total_seconds_watched: increment(10),
                    last_updated: new Date().toISOString()
                });

                if (watchedSeconds >= allowedSeconds) {
                    clearInterval(heartbeatInterval);
                    showError("WATCH LIMIT EXCEEDED");
                }
            }, 10000); // Check/Update every 10 seconds
        }

        function updateTimerUI() {
            const remaining = Math.max(0, allowedSeconds - watchedSeconds);
            const h = Math.floor(remaining / 3600);
            const m = Math.floor((remaining % 3600) / 60);
            const s = remaining % 60;
            document.getElementById('time-left').innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function showError(msg) {
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            document.getElementById('timer-display').classList.add('hidden');
            document.getElementById('video-wrapper').innerHTML = `
                <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-8 bg-black z-50">
                    <div class="w-16 h-1 border-t border-red-600 mb-4"></div>
                    <p class="text-red-500 font-black tracking-[4px] uppercase mb-2">System Lock</p>
                    <p class="text-[10px] text-gray-400 uppercase tracking-[2px] max-w-xs leading-loose">${msg}</p>
                    <button onclick="window.location.reload()" class="mt-8 text-[9px] border border-white/20 px-4 py-2 hover:bg-white/10 uppercase">Retry Connection</button>
                </div>
            `;
            document.getElementById('info-status').innerText = "BLOCKED";
            document.getElementById('info-status').className = "text-sm font-bold text-red-600 uppercase";
        }

        window.goBack = () => {
            window.location.href = `curriculum.html?id=${courseId}`;
        };

        init();
    </script>
</body>
</html>
