<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrollment | TBCM26</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-full {
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/4/46/A_night_view_of_the_Ruwanweli_Maha_Saya%2C_Sri_Lanka.jpg');
            background-size: cover;
            background-position: center;
        }
        .glass-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #preloader {
            position: fixed;
            inset: 0;
            background: #020617;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden text-white font-sans bg-slate-950">

    <!-- Preloader -->
    <div id="preloader">
        <div class="animate-pulse text-white/50 tracking-widest uppercase">Loading...</div>
    </div>

    <!-- Background Image -->
    <div class="absolute inset-0 bg-full"></div>
    <div class="absolute inset-0 bg-black/50"></div>

    <!-- Star Overlay (Top 20% Only) -->
    <div id="star-overlay" class="absolute top-0 left-0 w-full h-[20%] z-0 overflow-hidden"></div>

    <!-- Moon -->
    <div class="absolute top-8 right-12 w-20 h-20 rounded-full bg-yellow-100 shadow-[0_0_50px_15px_rgba(253,230,138,0.4)] z-0"></div>

    <!-- Main Content -->
    <div class="relative z-10 h-full flex flex-col items-center">
        <!-- Text positioned at 25% from top -->
        <h1 class="text-xl font-light tracking-[0.5em] text-white/70 uppercase mt-[25vh] mb-20">Team Next Level</h1>
        
        <!-- Boxes Container: Added gap-20 to push boxes 80px further apart -->
        <div class="flex w-full max-w-5xl justify-center items-center px-12 gap-80">
            <div class="glass-box p-10 rounded-3xl shadow-2xl text-center w-[45%]">
                <h2 class="text-sm font-bold uppercase tracking-widest text-emerald-400 mb-2">Enrolled Status</h2>
                <p class="text-4xl font-light text-white">Completed</p>
            </div>
            <div class="glass-box p-10 rounded-3xl shadow-2xl text-center w-[45%]">
                <h2 class="text-sm font-bold uppercase tracking-widest text-blue-400 mb-2">Enrolled Month</h2>
                <p class="text-4xl font-light text-white">June</p>
            </div>
        </div>

        <footer class="absolute bottom-6 text-[10px] text-white/40 tracking-[0.3em] uppercase">
            &copy; Copyright Message to TBCM26
        </footer>
    </div>

    <script>
        // Image Preloader logic
        window.addEventListener('load', () => {
            const preloader = document.getElementById('preloader');
            preloader.style.opacity = '0';
            setTimeout(() => preloader.style.display = 'none', 500);
        });

        // Generate 100 stars in the top 20% overlay
        const starOverlay = document.getElementById('star-overlay');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'absolute bg-white rounded-full';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%'; 
            star.style.width = (Math.random() * 1.5) + 'px';
            star.style.height = star.style.width;
            star.style.opacity = (Math.random() * 0.4 + 0.1);
            starOverlay.appendChild(star);
        }
    </script>
</body>
</html>
