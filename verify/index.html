<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified | Nexus Prime</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --math-primary: #ec4899; 
            --math-dark: #09090b;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--math-dark);
            color: #f4f4f5;
            overflow: hidden; 
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        #math-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -10;
        }

        .glass-panel {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .gradient-text {
            background: linear-gradient(to bottom right, #fff 30%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .success-ring {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .success-ring::before {
            content: '';
            position: absolute;
            width: 120%;
            height: 120%;
            border: 2px solid var(--math-primary);
            border-radius: 50%;
            opacity: 0.2;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.2; }
            50% { transform: scale(1.1); opacity: 0.4; }
            100% { transform: scale(1); opacity: 0.2; }
        }

        .progress-bar {
            height: 2px;
            background: rgba(255,255,255,0.1);
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 2rem;
        }

        .progress-fill {
            height: 100%;
            background: var(--math-primary);
            width: 100%;
            transition: width 5s linear;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div id="math-canvas"></div>

    <div class="w-full max-w-md relative z-10">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-pink-600 rounded-2xl mb-6 shadow-lg shadow-pink-500/20 rotate-3">
                <span class="text-3xl font-black">Σ</span>
            </div>
            <h1 class="text-4xl font-black tracking-tighter mb-2">NEXUS<span class="text-pink-500">PRIME</span></h1>
            <p class="mono text-[10px] uppercase tracking-[0.3em] text-gray-500">Mathematics Excellence Portal</p>
        </div>

        <div class="glass-panel rounded-[2.5rem] p-12 text-center">
            <div class="success-ring mb-8">
                <div class="w-20 h-20 bg-emerald-500/10 border border-emerald-500/20 rounded-full flex items-center justify-center text-emerald-500">
                    <i data-lucide="check-circle-2" class="w-10 h-10"></i>
                </div>
            </div>

            <h2 class="text-3xl font-bold mb-4">Verification <span class="gradient-text">Complete</span></h2>
            <p class="text-gray-400 text-sm leading-relaxed mb-8">
                Your email has been successfully verified. You now have full access to the Nexus Prime portal.
            </p>

            <div class="bg-white/5 rounded-2xl p-6 mb-2">
                <p class="mono text-[10px] uppercase tracking-widest text-gray-500 mb-2">Auto-Redirecting In</p>
                <div class="text-3xl font-black text-white" id="countdown">5</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <p class="text-gray-600 text-[10px] mono uppercase mt-6">
                Redirecting to <span class="text-pink-500">/login</span>
            </p>
        </div>
    </div>

    <script>
        (function() {
            // Countdown and Redirect Logic
            let seconds = 5;
            const countdownEl = document.getElementById('countdown');
            const progressFill = document.getElementById('progress-fill');
            
            // Start progress bar animation immediately
            setTimeout(() => {
                progressFill.style.width = '0%';
            }, 100);

            const timer = setInterval(() => {
                seconds--;
                countdownEl.textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(timer);
                    window.location.href = '/login';
                }
            }, 1000);

            // Three.js Background (Synced with your theme)
            const initScene = () => {
                const container = document.getElementById('math-canvas');
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.z = 100;

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                container.appendChild(renderer.domElement);

                const particles = new THREE.BufferGeometry();
                const count = 1500;
                const posArr = new Float32Array(count * 3);

                for(let i=0; i < count * 3; i++) {
                    posArr[i] = (Math.random() - 0.5) * 400;
                }

                particles.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
                const material = new THREE.PointsMaterial({ 
                    size: 0.6, 
                    color: 0xec4899, 
                    transparent: true, 
                    opacity: 0.25 
                });

                const pSystem = new THREE.Points(particles, material);
                scene.add(pSystem);

                const animate = () => {
                    requestAnimationFrame(animate);
                    pSystem.rotation.y += 0.0005;
                    pSystem.rotation.x += 0.0002;
                    renderer.render(scene, camera);
                };
                animate();

                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });
            };

            document.addEventListener('DOMContentLoaded', () => {
                lucide.createIcons();
                initScene();
            });
        })();
    </script>
</body>
</html>
