<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="public, max-age=3600, must-revalidate">
    <title>Secure Viewer | Nexus Prime Security</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        #stream-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #error-state {
            display: none;
            position: fixed;
            inset: 0;
            background-color: #0a0a0b;
            color: #ececec;
            font-family: 'Plus Jakarta Sans', sans-serif;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 9999;
        }

        #error-state h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #ff3333;
        }

        #error-state p {
            color: #94a3b8;
            max-width: 400px;
            margin-bottom: 20px;
        }

        #error-state button {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Simple, distraction-free Error State if the URL fails to load -->
    <div id="error-state">
        <h2>Content Unavailable</h2>
        <p>The requested secure link is invalid, expired, or you do not have permission to access it.</p>
        <button onclick="window.history.back()">Go Back</button>
    </div>
    
    <!-- Full Screen Frame -->
    <iframe 
        id="stream-frame" 
        referrerpolicy="no-referrer-when-downgrade"
        allow="autoplay; fullscreen; picture-in-picture; encrypted-media; clipboard-write; camera; microphone"
        allowfullscreen>
    </iframe>

    <script>
        const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';
        
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const urlParams = new URLSearchParams(window.location.search);
        
        let lessonId = urlParams.get('id');
        if (!lessonId) {
            const rawQuery = window.location.search.substring(1);
            if (rawQuery.startsWith('=')) {
                lessonId = rawQuery.substring(1);
            } else if (rawQuery && !rawQuery.includes('=')) {
                lessonId = rawQuery;
            }
        }

        async function checkAuthenticationAndLoad() {
            // Check session status silently
            const { data: { session } } = await sb.auth.getSession();
            if (!session) {
                window.location.href = '/login';
                return;
            }

            if (!lessonId) {
                showError();
                return;
            }

            try {
                const { data: lesson, error } = await sb
                    .from('lessons')
                    .select('*')
                    .eq('id', lessonId)
                    .maybeSingle();

                if (error) throw error;

                if (lesson && (lesson.video_url || lesson.external_url)) {
                    const frame = document.getElementById('stream-frame');
                    frame.src = lesson.video_url || lesson.external_url;
                } else {
                    showError();
                }
            } catch (err) {
                showError();
            }
        }

        function showError() {
            document.getElementById('stream-frame').style.display = 'none';
            document.getElementById('error-state').style.display = 'flex';
        }

        window.onload = checkAuthenticationAndLoad;
    </script>
</body>
</html>
