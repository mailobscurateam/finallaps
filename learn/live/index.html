<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="public, max-age=3600, must-revalidate">
    <title>Live Stream | Nexus Prime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent: #ff3333;
            --bg: #0a0a0b;
            --card-bg: #111113;
            --border: rgba(255, 255, 255, 0.06);
        }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            color: #ececec; 
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(at 0% 0%, rgba(255, 51, 51, 0.05) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 51, 51, 0.03) 0, transparent 50%);
            z-index: -1;
        }

        .nav-blur {
            backdrop-filter: blur(12px);
            background: rgba(10, 10, 11, 0.8);
            border-bottom: 1px solid var(--border);
        }

        .live-container {
            position: relative;
            flex: 1;
            width: 100%;
            background: #000;
        }

        #stream-frame {
            width: 100%;
            height: 100%;
            border: 0;
            display: none;
        }

        .preloader-overlay {
            position: absolute; 
            inset: 0; 
            background: var(--bg);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            z-index: 40;
        }

        .error-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            text-align: center;
            padding: 2rem;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body>
    <div class="mesh-bg"></div>

    <!-- Header -->
    <nav class="w-full z-50 px-6 py-4 nav-blur shrink-0">
        <div class="max-w-[1800px] mx-auto flex items-center justify-between">
            <button onclick="window.history.back()" class="flex items-center gap-2 text-neutral-400 hover:text-white transition-colors group">
                <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-1 transition-transform"></i>
                <span class="text-sm font-medium">Back</span>
            </button>
            <div class="text-right">
                <p id="stream-title" class="text-xs font-bold uppercase tracking-widest text-neutral-500">Initializing Session...</p>
            </div>
        </div>
    </nav>

    <!-- Content Area -->
    <main class="live-container">
        <!-- Preloader -->
        <div id="preloader" class="preloader-overlay">
            <div class="relative w-12 h-12 mb-6">
                <div class="absolute inset-0 border-2 border-white/5 rounded-full"></div>
                <div class="absolute inset-0 border-2 border-red-500 border-t-transparent rounded-full animate-spin"></div>
            </div>
            <p id="status-text" class="mono text-[9px] font-bold tracking-[0.4em] text-neutral-500 uppercase">Securing Connection</p>
        </div>

        <!-- Error State -->
        <div id="error-state" class="preloader-overlay error-container">
            <i data-lucide="alert-circle" class="w-12 h-12 text-red-500 mb-2"></i>
            <h2 class="text-xl font-bold">Stream Unavailable</h2>
            <p class="text-neutral-400 max-w-md">The requested lesson could not be found or the live link has expired.</p>
            <button onclick="window.history.back()" class="mt-4 px-6 py-2 bg-neutral-800 hover:bg-neutral-700 rounded-full text-sm font-semibold transition-all">Go Back</button>
        </div>
        
        <!-- Video Stream Iframe -->
        <iframe 
            id="stream-frame" 
            referrerpolicy="no-referrer-when-downgrade"
            allow="autoplay; fullscreen; picture-in-picture; encrypted-media; clipboard-write; camera; microphone"
            allowfullscreen>
        </iframe>
    </main>

    <script>
        const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';
        
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const urlParams = new URLSearchParams(window.location.search);
        const lessonId = urlParams.get('id');

        async function init() {
            lucide.createIcons();
            
            if (!lessonId) {
                showError("Missing Lesson ID");
                return;
            }

            try {
                const { data: lesson, error } = await sb
                    .from('lessons')
                    .select('*')
                    .eq('id', lessonId)
                    .maybeSingle();

                if (error) throw error;

                if (lesson && lesson.video_url) {
                    document.getElementById('stream-title').innerText = lesson.title;
                    
                    const frame = document.getElementById('stream-frame');
                    frame.src = lesson.video_url;
                    
                    frame.onload = () => {
                        document.getElementById('preloader').style.display = 'none';
                        frame.style.display = 'block';
                    };

                    // Timeout fallback for preloader if frame takes too long
                    setTimeout(() => {
                        if (frame.style.display !== 'block') {
                            document.getElementById('preloader').style.display = 'none';
                            frame.style.display = 'block';
                        }
                    }, 10000);
                    
                } else {
                    showError("Lesson not found");
                }
            } catch (err) {
                console.error("Initialization error:", err);
                showError("Connection failed");
            }
        }

        function showError(msg) {
            document.getElementById('preloader').style.display = 'none';
            document.getElementById('error-state').style.display = 'flex';
            document.getElementById('stream-title').innerText = "Access Denied";
            console.warn("Stream error:", msg);
        }

        window.onload = init;
    </script>
</body>
</html>
