<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="public, max-age=3600, must-revalidate">
    <title>Stream Launch | Nexus Prime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent: #ff3333;
            --bg: #0a0a0b;
            --card-bg: #111113;
            --border: rgba(255, 255, 255, 0.06);
        }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            color: #ececec; 
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(at 0% 0%, rgba(255, 51, 51, 0.05) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 51, 51, 0.03) 0, transparent 50%);
            z-index: -1;
        }

        .nav-blur {
            backdrop-filter: blur(12px);
            background: rgba(10, 10, 11, 0.8);
            border-bottom: 1px solid var(--border);
        }

        .launch-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body>
    <div class="mesh-bg"></div>

    <!-- Minimal Header -->
    <nav class="w-full z-50 px-6 py-4 nav-blur shrink-0">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <button onclick="window.history.back()" class="flex items-center gap-2 text-neutral-400 hover:text-white transition-colors group">
                <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-1 transition-transform"></i>
                <span class="text-sm font-medium">Back</span>
            </button>
            <div class="text-right">
                <p id="stream-title" class="text-xs font-bold uppercase tracking-widest text-neutral-500">Loading Session...</p>
            </div>
        </div>
    </nav>

    <!-- Content Area -->
    <main class="flex-1 flex items-center justify-center p-6">
        <div class="launch-card max-w-md w-full rounded-3xl p-8 text-center">
            <div class="w-20 h-20 bg-red-500/10 rounded-2xl flex items-center justify-center mx-auto mb-6 border border-red-500/20">
                <i data-lucide="play" class="w-10 h-10 text-red-500 fill-red-500"></i>
            </div>
            
            <h2 class="text-2xl font-bold mb-2 tracking-tight">Ready to Watch</h2>
            <p class="text-neutral-400 text-sm mb-8 leading-relaxed">
                Click below to open the secure recording in a new browser tab. This ensures the best video quality and stable playback.
            </p>

            <button id="btn-launch" class="w-full py-4 bg-white text-black rounded-2xl font-bold text-sm uppercase tracking-widest hover:bg-neutral-200 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                Launch Recording
                <i data-lucide="external-link" class="w-4 h-4"></i>
            </button>

            <div class="mt-8 pt-8 border-t border-white/5">
                <div class="flex items-center justify-center gap-4 text-neutral-500">
                    <div class="flex flex-col items-center">
                        <span class="mono text-[10px] font-bold uppercase tracking-tighter">Secure</span>
                        <i data-lucide="shield-check" class="w-4 h-4 mt-1"></i>
                    </div>
                    <div class="w-px h-8 bg-white/5"></div>
                    <div class="flex flex-col items-center">
                        <span class="mono text-[10px] font-bold uppercase tracking-tighter">HD Feed</span>
                        <i data-lucide="video" class="w-4 h-4 mt-1"></i>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';
        
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const urlParams = new URLSearchParams(window.location.search);
        const lessonId = urlParams.get('id');

        async function init() {
            lucide.createIcons();
            
            if (!lessonId) return;

            const { data: lesson } = await sb.from('lessons').select('*').eq('id', lessonId).maybeSingle();
            if (lesson) {
                document.getElementById('stream-title').innerText = lesson.title;
                
                const launchBtn = document.getElementById('btn-launch');
                launchBtn.onclick = () => {
                    window.open(lesson.video_url, '_blank');
                };
            }
        }

        window.onload = init;
    </script>
</body>
</html>
