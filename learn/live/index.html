<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="public, max-age=3600, must-revalidate">
    <title>Live Stream | Nexus Prime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent: #ff3333;
            --bg: #0a0a0b;
            --card-bg: #111113;
            --border: rgba(255, 255, 255, 0.06);
        }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            color: #ececec; 
            letter-spacing: -0.01em;
            margin: 0;
            overflow: hidden; 
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(at 0% 0%, rgba(255, 51, 51, 0.03) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 51, 51, 0.02) 0, transparent 50%);
            z-index: -1;
        }

        .nav-blur {
            backdrop-filter: blur(12px) saturate(180%);
            background: rgba(10, 10, 11, 0.8);
            border-bottom: 1px solid var(--border);
        }

        .live-container {
            position: relative;
            height: calc(100vh - 74px); 
            width: 100%;
            background: #000;
        }

        .live-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .live-container iframe.visible { opacity: 1; }

        .preloader-overlay {
            position: absolute; 
            inset: 0; 
            background: var(--bg);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            z-index: 40;
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        .status-pill {
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(255, 51, 51, 0.1);
            border: 1px solid rgba(255, 51, 51, 0.2);
        }
    </style>
</head>
<body class="flex flex-col h-screen">
    <div class="mesh-bg"></div>

    <!-- Live Header -->
    <nav class="w-full z-50 px-6 py-4 nav-blur shrink-0">
        <div class="max-w-[1800px] mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <button onclick="window.history.back()" class="w-9 h-9 rounded-xl border border-white/10 flex items-center justify-center hover:bg-white/5 transition-colors">
                    <i data-lucide="chevron-left" class="w-5 h-5 text-neutral-400"></i>
                </button>
                <div>
                    <h1 id="stream-title" class="text-xs font-bold tracking-tight uppercase">Initializing Stream...</h1>
                    <div class="flex items-center gap-2 mt-0.5">
                        <div class="status-pill flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 bg-red-500 rounded-full animate-pulse"></span>
                            <span id="info-status" class="mono text-[9px] text-red-500 font-bold tracking-widest uppercase">Live</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="hidden md:flex flex-col items-end">
                    <p class="mono text-[9px] text-neutral-500 font-bold uppercase tracking-widest">Protocol</p>
                    <p class="text-[10px] font-bold">SECURE_LIVE_FEED</p>
                </div>
                <button id="btn-fullscreen" class="w-9 h-9 rounded-xl border border-white/10 flex items-center justify-center hover:bg-white/5 transition-colors">
                    <i data-lucide="maximize" class="w-4 h-4 text-neutral-400"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-1 overflow-hidden">
        <div id="video-wrapper" class="live-container">
            <!-- Non-blocking Loader -->
            <div id="preloader" class="preloader-overlay">
                <div class="relative w-12 h-12 mb-6">
                    <div class="absolute inset-0 border-2 border-white/5 rounded-full"></div>
                    <div class="absolute inset-0 border-2 border-red-500 border-t-transparent rounded-full animate-spin"></div>
                </div>
                <p class="mono text-[9px] font-bold tracking-[0.4em] text-neutral-500 uppercase">Connecting to uplink</p>
            </div>
            
            <div id="iframe-holder" class="w-full h-full"></div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';
        
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: true },
            global: { headers: { 'Cache-Control': 'max-age=3600' } }
        });

        const urlParams = new URLSearchParams(window.location.search);
        const lessonId = urlParams.get('id');
        let currentVideoUrl = "";

        async function init() {
            lucide.createIcons();
            
            if (!lessonId) return;

            const { data: lesson } = await sb.from('lessons').select('*').eq('id', lessonId).maybeSingle();
            if (lesson) {
                document.getElementById('stream-title').innerText = lesson.title;
                currentVideoUrl = lesson.video_url;
                loadIframe(currentVideoUrl);
            }

            sb.channel('lesson_updates')
                .on('postgres_changes', { 
                    event: 'UPDATE', 
                    schema: 'public', 
                    table: 'lessons', 
                    filter: `id=eq.${lessonId}` 
                }, (payload) => {
                    if (payload.new && payload.new.video_url !== currentVideoUrl) {
                        currentVideoUrl = payload.new.video_url;
                        loadIframe(currentVideoUrl);
                    }
                })
                .subscribe();
        }

        function loadIframe(videoUrl) {
            const holder = document.getElementById('iframe-holder');
            holder.innerHTML = ''; 
            
            const iframe = document.createElement('iframe');
            iframe.src = videoUrl;
            
            // REMOVED SANDBOX: Zoom recording redirects require unrestricted access to cookies and navigation
            // This prevents the "loop" you see when clicking continue.
            iframe.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture; encrypted-media; clipboard-write; camera; microphone');
            iframe.allowFullscreen = true;
            
            iframe.onload = () => {
                const loader = document.getElementById('preloader');
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.visibility = 'hidden';
                }, 400);
                iframe.classList.add('visible');
            };

            holder.appendChild(iframe);
        }

        document.getElementById('btn-fullscreen').onclick = () => {
            const elem = document.getElementById('video-wrapper');
            if (!document.fullscreenElement) {
                elem.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen();
            }
        };

        window.onload = init;
    </script>
</body>
</html>
