<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Gateway | Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f0f12; 
            color: #f8fafc;
        }
        .gateway-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(239, 68, 68, 0.1);
            border-top-color: #ef4444;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="loading-state" class="gateway-container p-6 text-center">
        <div class="flex items-center gap-2 mb-8 justify-center">
            <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center shadow-lg shadow-red-900/20">
                <i data-lucide="shield-check" class="w-6 h-6 text-white"></i>
            </div>
            <span class="text-xl font-bold tracking-tight">Nexus Secure Gateway</span>
        </div>
        
        <div class="spinner mb-6"></div>
        <h2 class="text-xl font-bold mb-2 text-white">Handshaking Session</h2>
        <p class="text-slate-400 max-w-xs mx-auto text-sm">Verifying your credentials and establishing a secure connection to the resource...</p>
    </div>

    <!-- Error State -->
    <div id="error-screen" class="hidden gateway-container p-6 text-center">
        <div class="w-16 h-16 bg-red-900/20 text-red-500 rounded-full flex items-center justify-center mb-6 mx-auto">
            <i data-lucide="alert-circle" class="w-8 h-8"></i>
        </div>
        <h2 class="text-xl font-bold mb-2">Secure Link Expired</h2>
        <p class="text-slate-400 max-w-md mb-8 mx-auto text-sm">We couldn't retrieve the secure access token for this resource. Please relaunch the unit from your dashboard.</p>
        <button onclick="goBack()" class="bg-white text-black px-6 py-2 rounded-lg font-bold hover:bg-slate-200 transition-colors inline-flex items-center gap-2 text-sm">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Return to Dashboard
        </button>
    </div>

    <script>
        async function handleGatewayRedirect() {
            lucide.createIcons();
            
            // 1. Retrieve the protected URL from cache
            const url = localStorage.getItem('external_lesson_url');
            const loading = document.getElementById('loading-state');
            const errorScreen = document.getElementById('error-screen');

            // 2. Small artificial delay to ensure the user perceives the security handshake
            // and to allow the browser to process the localStorage read.
            setTimeout(() => {
                if (url && url.startsWith('http')) {
                    // 3. Clear the sensitive URL from cache BEFORE redirecting
                    // This ensures the link isn't sitting in storage indefinitely.
                    localStorage.removeItem('external_lesson_url');
                    
                    // 4. Perform the redirect at the window level.
                    // .replace() is used so the gateway page isn't in the back-button history.
                    window.location.replace(url);
                } else {
                    loading.classList.add('hidden');
                    errorScreen.classList.remove('hidden');
                }
            }, 1200);
        }

        function goBack() {
            const courseId = localStorage.getItem('active_session_id');
            window.location.href = courseId ? `/curriculum?id=${courseId}` : '/dashboard';
        }

        window.onload = handleGatewayRedirect;
    </script>
</body>
</html>
