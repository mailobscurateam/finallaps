<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Portal | Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f0f12; 
            color: #f8fafc;
            overflow: hidden;
        }
        .portal-header {
            background: rgba(15, 15, 18, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #2d2d35;
            height: 64px;
        }
        .frame-wrapper {
            height: calc(100vh - 64px);
            width: 100%;
            position: relative;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0f0f12;
            z-index: 40;
            transition: opacity 0.4s ease;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(239, 68, 68, 0.1);
            border-top-color: #ef4444;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Persistent Header to hide raw URL and provide Exit -->
    <header class="portal-header flex items-center justify-between px-6 shrink-0 z-50">
        <div class="flex items-center gap-4">
            <button onclick="goBack()" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-all text-sm font-medium">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Exit Resource
            </button>
            <div class="h-4 w-[1px] bg-slate-800"></div>
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 bg-red-600/20 text-red-500 rounded flex items-center justify-center">
                    <i data-lucide="shield" class="w-3.5 h-3.5"></i>
                </div>
                <span class="text-sm font-bold tracking-tight text-slate-200">Secure Learning Portal</span>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div id="status-indicator" class="flex items-center gap-2 text-[10px] uppercase tracking-widest text-slate-500 font-bold">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                Encrypted Session
            </div>
        </div>
    </header>

    <!-- Content Area -->
    <main class="frame-wrapper">
        <div id="loading-state" class="loading-overlay">
            <div class="spinner mb-4"></div>
            <p class="text-sm text-slate-400 font-medium">Loading secure resource...</p>
        </div>

        <!-- Error State -->
        <div id="error-screen" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-[#0f0f12] p-6 text-center z-50">
            <div class="w-16 h-16 bg-red-900/20 text-red-500 rounded-full flex items-center justify-center mb-6">
                <i data-lucide="alert-circle" class="w-8 h-8"></i>
            </div>
            <h2 class="text-xl font-bold mb-2">Access Error</h2>
            <p class="text-slate-400 max-w-md mb-8">This resource cannot be loaded directly or the session has timed out.</p>
            <button onclick="goBack()" class="bg-white text-black px-6 py-2 rounded-lg font-bold hover:bg-slate-200 transition-colors">
                Return to Dashboard
            </button>
        </div>

        <!-- 
             Iframe with broad permissions. 
             Note: Sandbox attribute is removed to support Proton's authentication and complex scripting needs.
        -->
        <iframe 
            id="portal-frame" 
            referrerpolicy="no-referrer"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
        ></iframe>
    </main>

    <script>
        function initPortal() {
            lucide.createIcons();
            
            const url = localStorage.getItem('external_lesson_url');
            const iframe = document.getElementById('portal-frame');
            const loading = document.getElementById('loading-state');
            const errorScreen = document.getElementById('error-screen');

            if (!url || url.trim() === "") {
                loading.classList.add('hidden');
                errorScreen.classList.remove('hidden');
                return;
            }

            // Set source
            iframe.src = url;

            // Handle successful load
            iframe.onload = () => {
                loading.style.opacity = '0';
                setTimeout(() => loading.classList.add('hidden'), 400);
            };

            // Fail-safe for loading indicator
            setTimeout(() => {
                if (!loading.classList.contains('hidden')) {
                    loading.style.opacity = '0';
                    setTimeout(() => loading.classList.add('hidden'), 400);
                }
            }, 5000);
        }

        function goBack() {
            const courseId = localStorage.getItem('active_session_id');
            // We clear the cache on exit to further protect the URL
            localStorage.removeItem('external_lesson_url');
            window.location.href = courseId ? `/curriculum?id=${courseId}` : '/dashboard';
        }

        window.onload = initPortal;
    </script>
</body>
</html>
