<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting | Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f0f12; 
            color: #f8fafc;
        }
        .loading-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(239, 68, 68, 0.1);
            border-top-color: #ef4444;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="loading-state" class="loading-container p-6 text-center">
        <div class="spinner mb-6"></div>
        <h2 class="text-xl font-bold mb-2">Connecting to Portal</h2>
        <p class="text-slate-400 max-w-xs mx-auto">Please wait while we securely redirect you to the external resource...</p>
    </div>

    <!-- Error State (Hidden by default) -->
    <div id="error-screen" class="hidden loading-container p-6 text-center">
        <div class="w-16 h-16 bg-red-900/20 text-red-500 rounded-full flex items-center justify-center mb-6 mx-auto">
            <i data-lucide="alert-circle" class="w-8 h-8"></i>
        </div>
        <h2 class="text-xl font-bold mb-2">Resource Not Found</h2>
        <p class="text-slate-400 max-w-md mb-8 mx-auto">We couldn't find the link for this lesson. Please try launching it again from your curriculum dashboard.</p>
        <button onclick="goBack()" class="bg-white text-black px-6 py-2 rounded-lg font-bold hover:bg-slate-200 transition-colors inline-flex items-center gap-2">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Return to Dashboard
        </button>
    </div>

    <script>
        function handleRedirect() {
            lucide.createIcons();
            
            const url = localStorage.getItem('external_lesson_url');
            const loading = document.getElementById('loading-state');
            const errorScreen = document.getElementById('error-screen');

            // Small delay to show the transition UI
            setTimeout(() => {
                if (url && url.trim() !== "") {
                    // Navigate the actual browser window to the new URL
                    window.location.replace(url);
                } else {
                    loading.classList.add('hidden');
                    errorScreen.classList.remove('hidden');
                }
            }, 800);
        }

        function goBack() {
            const courseId = localStorage.getItem('active_session_id');
            window.location.href = courseId ? `/curriculum?id=${courseId}` : '/dashboard';
        }

        window.onload = handleRedirect;
    </script>
</body>
</html>
