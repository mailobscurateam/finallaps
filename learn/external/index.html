<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External Portal | Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f0f12; 
            color: #f8fafc;
            overflow: hidden; /* Prevent double scrollbars */
        }
        .portal-header {
            background: rgba(26, 26, 31, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #2d2d35;
        }
        .iframe-container {
            height: calc(100 vh - 64px);
            width: 100%;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0f0f12;
            z-index: 50;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(239, 68, 68, 0.1);
            border-top-color: #ef4444;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Portal Header -->
    <header class="portal-header h-16 flex items-center justify-between px-6 shrink-0 z-50">
        <div class="flex items-center gap-4">
            <button onclick="goBack()" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-all text-sm font-medium">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Exit Portal
            </button>
            <div class="h-4 w-[1px] bg-slate-800"></div>
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 bg-blue-600 rounded flex items-center justify-center">
                    <i data-lucide="globe" class="w-3.5 h-3.5 text-white"></i>
                </div>
                <span id="portal-title" class="text-sm font-bold tracking-tight text-slate-200">External Learning Resource</span>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <span id="url-display" class="text-xs text-slate-500 font-mono hidden md:block max-w-xs truncate"></span>
            <button onclick="reloadPortal()" class="p-2 text-slate-400 hover:text-white transition-colors">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- Main Viewport -->
    <main class="relative flex-grow iframe-container">
        <!-- Loading State -->
        <div id="loading" class="loading-overlay">
            <div class="spinner mb-4"></div>
            <p class="text-sm text-slate-400 font-medium animate-pulse">Establishing secure connection...</p>
        </div>

        <!-- Error State (Hidden by default) -->
        <div id="error-screen" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-[#0f0f12] p-6 text-center">
            <div class="w-16 h-16 bg-red-900/20 text-red-500 rounded-full flex items-center justify-center mb-6">
                <i data-lucide="alert-circle" class="w-8 h-8"></i>
            </div>
            <h2 class="text-xl font-bold mb-2">Resource Unavailable</h2>
            <p class="text-slate-400 max-w-md mb-8">This resource could not be loaded or the session has expired. Please try launching it again from the dashboard.</p>
            <button onclick="goBack()" class="bg-white text-black px-6 py-2 rounded-lg font-bold hover:bg-slate-200 transition-colors">
                Return to Dashboard
            </button>
        </div>

        <iframe id="resource-frame" allow="autoplay; fullscreen; microphone; camera; midi; encrypted-media;"></iframe>
    </main>

    <script>
        function initPortal() {
            lucide.createIcons();
            
            const url = localStorage.getItem('external_lesson_url');
            const lessonId = new URLSearchParams(window.location.search).get('id');
            const iframe = document.getElementById('resource-frame');
            const loading = document.getElementById('loading');
            const errorScreen = document.getElementById('error-screen');
            const urlDisplay = document.getElementById('url-display');

            if (!url) {
                loading.classList.add('hidden');
                errorScreen.classList.remove('hidden');
                return;
            }

            // Show short URL for reference
            try {
                const hostname = new URL(url).hostname;
                urlDisplay.textContent = hostname;
            } catch(e) {
                urlDisplay.textContent = 'external-source';
            }

            // Set source
            iframe.src = url;

            // Handle loading state
            iframe.onload = () => {
                loading.style.opacity = '0';
                setTimeout(() => loading.classList.add('hidden'), 500);
            };

            // Safety timeout for loading
            setTimeout(() => {
                if (!loading.classList.contains('hidden')) {
                    loading.style.opacity = '0';
                    setTimeout(() => loading.classList.add('hidden'), 500);
                }
            }, 10000);
        }

        function goBack() {
            const courseId = localStorage.getItem('active_session_id');
            window.location.href = courseId ? `/curriculum?id=${courseId}` : '/dashboard';
        }

        function reloadPortal() {
            const iframe = document.getElementById('resource-frame');
            const loading = document.getElementById('loading');
            loading.classList.remove('hidden');
            loading.style.opacity = '1';
            iframe.src = iframe.src;
        }

        window.onload = initPortal;
    </script>
</body>
</html>
