<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Protocol | Nexus Prime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ec4899;
            --primary-glow: rgba(236, 72, 153, 0.3);
            --bg-dark: #09090b;
            --card-bg: rgba(18, 18, 21, 0.7);
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--bg-dark); 
            color: #f4f4f5; 
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.8s ease-out;
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(236, 72, 153, 0.1), transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(236, 72, 153, 0.05), transparent 40%);
        }
        
        body.ready { opacity: 1; }
        
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .glass-panel { 
            background: var(--card-bg); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            background: #000;
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
        }

        #youtube-player {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 0; opacity: 0; transition: opacity 1.2s ease;
            z-index: 5;
            pointer-events: none;
        }

        #youtube-player.visible { opacity: 1; }

        .controls-overlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 30%, transparent 60%);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .video-container:hover .controls-overlay {
            opacity: 1;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            cursor: pointer;
            position: relative;
            margin-bottom: 16px;
            border-radius: 10px;
            overflow: hidden;
            transition: height 0.3s;
        }
        
        .progress-bar-container:hover { height: 10px; }

        .progress-filled {
            height: 100%;
            background: linear-gradient(90deg, #ec4899, #f472b6);
            width: 0%;
            position: relative;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .speed-menu {
            position: absolute;
            bottom: 100%;
            right: 0;
            background: #121214;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 6px;
            margin-bottom: 12px;
            display: none;
            flex-direction: column;
            min-width: 110px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
        }
        
        .speed-menu.active { display: flex; animation: slideUp 0.2s ease-out; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .speed-option {
            padding: 10px 14px;
            font-size: 11px;
            color: #a1a1aa;
            text-align: left;
            border-radius: 8px;
            transition: all 0.2s;
            font-weight: 600;
        }
        
        .speed-option:hover { background: rgba(255,255,255,0.08); color: white; }
        .speed-option.active { color: #ec4899; background: rgba(236, 72, 153, 0.1); }

        .watermark {
            position: absolute;
            z-index: 50; 
            pointer-events: none;
            user-select: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
            mix-blend-mode: overlay;
            text-transform: lowercase;
            white-space: nowrap;
            letter-spacing: 2px;
        }

        .status-bar { height: 4px; background: rgba(255,255,255,0.03); position: relative; overflow: hidden; }
        .status-progress { position: absolute; height: 100%; background: #ec4899; width: 0%; transition: width 0.3s; box-shadow: 0 0 10px #ec4899; }

        .action-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px; 
            font-size: 11px; 
            font-weight: 800;
            text-transform: uppercase; 
            letter-spacing: 0.12em; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #d1d1d6;
        }

        .action-btn:not(:disabled):hover { 
            background: rgba(236, 72, 153, 0.15); 
            border-color: #ec4899; 
            color: #ec4899; 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(236, 72, 153, 0.2);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .action-btn.primary-active {
            background: #ec4899;
            color: white;
            border-color: #f472b6;
        }

        .telemetry-card {
            border-top: 2px solid rgba(255, 255, 255, 0.05);
            background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, transparent 100%);
            padding: 1.25rem;
            border-radius: 16px;
            transition: border-color 0.3s;
        }

        .telemetry-card:hover {
            border-top-color: #ec4899;
        }

        input[type=range] { 
            accent-color: #ec4899;
            height: 4px;
        }

        .pulse {
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
    </style>
</head>
<body class="selection:bg-pink-500/30">

    <!-- Navbar -->
    <header class="p-6 border-b border-white/5 flex justify-between items-center bg-black/40 backdrop-blur-2xl sticky top-0 z-50">
        <div class="flex items-center gap-5">
            <div class="w-10 h-10 rounded-xl bg-pink-500/10 border border-pink-500/20 flex items-center justify-center text-pink-500 shadow-lg shadow-pink-500/5">
                <i data-lucide="shield-check" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 id="lesson-title" class="text-base font-black tracking-tight text-white uppercase leading-none">Initializing Stream...</h1>
                <div class="flex items-center gap-3 mt-1.5">
                    <span class="mono text-[10px] text-pink-500 uppercase font-bold tracking-[0.2em] bg-pink-500/5 px-2 py-0.5 rounded">Protocol L-4</span>
                    <span id="info-status" class="mono text-[10px] text-yellow-500 uppercase font-bold tracking-widest flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-yellow-500 pulse"></span>
                        Handshake In Progress
                    </span>
                </div>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <div id="timer-display" class="hidden text-right mr-6 border-r border-white/10 pr-6">
                <p class="mono text-[10px] text-gray-500 uppercase font-bold tracking-widest mb-0.5">Time Remaining</p>
                <p id="time-left" class="text-xl font-black text-white tracking-tighter tabular-nums leading-none">--:--:--</p>
            </div>
            <div class="flex gap-2">
                <button id="btn-complete" class="action-btn" disabled>
                    <i data-lucide="check-circle" class="w-4 h-4"></i>
                    Mark Complete
                </button>
                <button id="btn-exit" class="action-btn hover:bg-red-500/10 hover:border-red-500/50 hover:text-red-500">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    Exit
                </button>
            </div>
        </div>
    </header>

    <div class="status-bar">
        <div id="loading-bar" class="status-progress"></div>
    </div>

    <main class="flex-1 p-6 md:p-10 max-w-7xl mx-auto w-full">
        <!-- Telemetry HUD -->
        <div id="telemetry-grid" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-10">
            <div class="telemetry-card glass-panel">
                <p class="mono text-[10px] text-gray-500 uppercase font-bold tracking-widest mb-2">Subject Identifier</p>
                <p id="info-id" class="text-sm font-bold text-white tracking-wide mono">ANALYZING...</p>
            </div>
            <div class="telemetry-card glass-panel">
                <p class="mono text-[10px] text-gray-500 uppercase font-bold tracking-widest mb-2">Watch Allocation</p>
                <p id="info-limit" class="text-sm font-bold text-white tracking-wide mono">-- SEC</p>
            </div>
            <div class="telemetry-card glass-panel">
                <p class="mono text-[10px] text-gray-500 uppercase font-bold tracking-widest mb-2">Signal Status</p>
                <p id="signal-quality" class="text-sm font-bold text-white tracking-wide mono">ENCRYPTED_LINK</p>
            </div>
            <div class="telemetry-card glass-panel border-pink-500/20">
                <p class="mono text-[10px] text-pink-500/70 uppercase font-bold tracking-widest mb-2">Active Node</p>
                <p class="text-sm font-bold text-white tracking-wide mono">EDGE_SERVER_ALPHA</p>
            </div>
        </div>

        <!-- Video Player Section -->
        <div id="video-wrapper" class="video-container">
            <div id="preloader" class="absolute inset-0 bg-[#09090b] flex flex-col items-center justify-center z-[60]">
                <div class="relative w-16 h-16">
                    <div class="absolute inset-0 border-4 border-pink-500/20 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-pink-500 border-t-transparent rounded-full animate-spin"></div>
                </div>
                <p class="mono text-[10px] text-pink-500 font-bold tracking-[0.3em] mt-6 uppercase">Syncing Stream...</p>
            </div>
            
            <div id="moving-watermark" class="watermark">initializing_id...</div>
            <div id="youtube-player"></div>

            <!-- Custom HUD Controls -->
            <div id="custom-controls" class="controls-overlay p-6">
                <div id="progress-container" class="progress-bar-container">
                    <div id="progress-bar" class="progress-filled"></div>
                </div>
                
                <div class="flex items-center justify-between gap-4">
                    <div class="flex items-center gap-6">
                        <button id="play-pause" class="text-white hover:text-pink-500 transition-colors">
                            <i data-lucide="play" class="w-7 h-7 fill-current"></i>
                        </button>
                        
                        <div class="flex items-center gap-4 bg-white/5 px-4 py-2 rounded-xl border border-white/5">
                            <button id="mute-toggle" class="text-white/70 hover:text-white transition-colors">
                                <i data-lucide="volume-2" class="w-5 h-5"></i>
                            </button>
                            <input id="volume-slider" type="range" min="0" max="100" value="100" class="w-20 cursor-pointer">
                        </div>

                        <span id="current-timestamp" class="mono text-[12px] font-bold text-white/50 bg-black/40 px-3 py-1.5 rounded-lg border border-white/5">0:00 / 0:00</span>
                    </div>

                    <div class="flex items-center gap-3">
                        <!-- Speed Control -->
                        <div class="relative">
                            <button id="speed-btn" class="mono text-[10px] font-bold text-white/70 hover:text-pink-500 px-3 py-2 bg-white/5 border border-white/10 rounded-xl transition-all hover:bg-white/10">
                                SPEED 1.0X
                            </button>
                            <div id="speed-menu" class="speed-menu">
                                <button class="speed-option" data-speed="0.5">0.5x</button>
                                <button class="speed-option" data-speed="0.75">0.75x</button>
                                <button class="speed-option active" data-speed="1">1.0x (Normal)</button>
                                <button class="speed-option" data-speed="1.25">1.25x</button>
                                <button class="speed-option" data-speed="1.5">1.5x</button>
                                <button class="speed-option" data-speed="2">2.0x</button>
                            </div>
                        </div>

                        <button id="fullscreen-btn" class="p-2.5 bg-white/5 border border-white/10 rounded-xl text-white/70 hover:text-pink-500 hover:bg-white/10 transition-all">
                            <i data-lucide="maximize" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- Core Logic ---
        const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const urlParams = new URLSearchParams(window.location.search);
        const lessonId = urlParams.get('id');

        let player, currentUser, allowedSeconds, watchedSeconds = 0;
        let watermarkData = { x: 50, y: 50, dx: 0.8, dy: 0.6 };
        let sessionTrackingActive = false;
        let isLessonAlreadyCompleted = false;

        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUser = session.user;

            const isApproved = await verifyCourseApproval();
            if (!isApproved) {
                window.location.href = '/dashboard';
                return;
            }

            document.getElementById('moving-watermark').innerText = currentUser.email;
            document.body.classList.add('ready');
            lucide.createIcons();
            
            await checkInitialCompletionStatus();
            await fetchLessonData();
            startWatermark();
            setupControls();
            startPageSessionTracking();
        }

        async function verifyCourseApproval() {
            try {
                const { data: lesson, error: lessonError } = await sb
                    .from('lessons')
                    .select('course_id')
                    .eq('id', lessonId)
                    .single();

                if (lessonError || !lesson) return false;

                const { data: approval, error: approvalError } = await sb
                    .from('course_status')
                    .select('status')
                    .eq('user_id', currentUser.id)
                    .eq('course_id', lesson.course_id)
                    .eq('status', 'approved')
                    .maybeSingle();

                return !(approvalError || !approval);
            } catch (e) {
                return false;
            }
        }

        async function checkInitialCompletionStatus() {
            const { data: completion } = await sb.from('lesson_completions')
                .select('*')
                .eq('user_id', currentUser.id)
                .eq('lesson_id', lessonId)
                .maybeSingle();

            if (completion) {
                isLessonAlreadyCompleted = true;
                setCompleteUI();
            }
        }

        async function fetchLessonData() {
            const { data: lesson } = await sb.from('lessons').select('*').eq('id', lessonId).single();
            if (!lesson) return;
            allowedSeconds = (parseInt(lesson.watchtime_hours) * 3600) + (parseInt(lesson.watchtime_minutes) * 60);
            
            document.getElementById('lesson-title').innerText = lesson.title;
            document.getElementById('info-id').innerText = `X-CORE-${String(lesson.order_index || '000').padStart(3, '0')}`;
            document.getElementById('info-limit').innerText = `${allowedSeconds} SEC`;
            
            const { data: sessionData } = await sb.from('watch_sessions')
                .select('total_seconds_watched')
                .eq('user_id', currentUser.id)
                .eq('lesson_id', lessonId)
                .maybeSingle();
            
            if (sessionData) watchedSeconds = sessionData.total_seconds_watched;
            loadYouTubeAPI(lesson.video_url);
        }

        function loadYouTubeAPI(videoUrl) {
            let vid = videoUrl.includes('v=') ? videoUrl.split('v=')[1].split('&')[0] : videoUrl.split('/').pop();
            window.onYouTubeIframeAPIReady = () => {
                player = new YT.Player('youtube-player', {
                    videoId: vid,
                    playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1, 'rel': 0, 'modestbranding': 1, 'iv_load_policy': 3 },
                    events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
                });
            };
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            document.body.appendChild(tag);
        }

        function onPlayerReady() {
            document.getElementById('preloader').style.opacity = '0';
            setTimeout(() => document.getElementById('preloader').style.display = 'none', 500);
            document.getElementById('youtube-player').classList.add('visible');
            
            const status = document.getElementById('info-status');
            status.innerText = "• SYNCED_ONLINE";
            status.className = "mono text-[10px] text-green-500 uppercase font-bold tracking-widest flex items-center gap-1.5";
            status.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e]"></span> SYNCED_ONLINE`;
            
            setInterval(() => {
                if (player && player.getCurrentTime) {
                    const curr = player.getCurrentTime();
                    const dur = player.getDuration();
                    document.getElementById('progress-bar').style.width = (curr/dur*100) + '%';
                    document.getElementById('current-timestamp').innerText = `${Math.floor(curr/60)}:${Math.floor(curr%60).toString().padStart(2,'0')} / ${Math.floor(dur/60)}:${Math.floor(dur%60).toString().padStart(2,'0')}`;
                }
            }, 1000);
        }

        function startPageSessionTracking() {
            if (sessionTrackingActive) return;
            sessionTrackingActive = true;
            
            document.getElementById('timer-display').classList.remove('hidden');
            updateTimerUI();

            if (!isLessonAlreadyCompleted) {
                setTimeout(() => {
                    const btn = document.getElementById('btn-complete');
                    btn.disabled = false;
                    btn.onclick = handleMarkComplete;
                }, 10000);
            }

            setInterval(async () => {
                watchedSeconds += 1;
                updateTimerUI();

                if (watchedSeconds % 10 === 0) {
                    await sb.from('watch_sessions').upsert({ 
                        user_id: currentUser.id, 
                        lesson_id: lessonId, 
                        total_seconds_watched: watchedSeconds,
                        last_watched_at: new Date().toISOString()
                    }, { onConflict: 'user_id,lesson_id' });
                }

                if (allowedSeconds > 0 && watchedSeconds >= allowedSeconds) {
                    handleSessionExpired();
                }
            }, 1000);
        }

        function handleSessionExpired() {
            if (player && player.pauseVideo) player.pauseVideo();
            document.getElementById('video-wrapper').innerHTML = `
                <div class="absolute inset-0 bg-black/95 flex flex-col items-center justify-center z-[70] text-center p-8 backdrop-blur-md">
                    <div class="w-20 h-20 rounded-full bg-red-500/10 border border-red-500/20 flex items-center justify-center text-red-500 mb-6">
                        <i data-lucide="alert-triangle" class="w-10 h-10"></i>
                    </div>
                    <p class="mono text-red-500 font-black tracking-[0.2em] mb-3 uppercase text-lg">Access Token Expired</p>
                    <p class="text-sm text-gray-400 max-w-sm leading-relaxed">Safety protocol engaged. Your viewing allocation for this session has been exhausted. Please return to the curriculum dashboard.</p>
                    <button onclick="window.location.href='/curriculum'" class="mt-8 action-btn primary-active px-10 py-4">Return to Command Center</button>
                </div>
            `;
            lucide.createIcons();
        }

        async function handleMarkComplete() {
            const btn = document.getElementById('btn-complete');
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin w-4 h-4 border-2 border-white/20 border-t-white rounded-full"></span> UPLOADING...`;

            const { error } = await sb.from('lesson_completions').insert({
                user_id: currentUser.id,
                lesson_id: lessonId
            });

            if (error) {
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="refresh-ccw" class="w-4 h-4"></i> RETRY SYNC`;
                lucide.createIcons();
                return;
            }
            setCompleteUI();
        }

        function setCompleteUI() {
            const btn = document.getElementById('btn-complete');
            btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> PROTOCOL_SECURED`;
            btn.classList.add('primary-active');
            btn.disabled = true;
            lucide.createIcons();
        }

        function onPlayerStateChange(ev) {
            const btn = document.getElementById('play-pause');
            btn.innerHTML = ev.data === YT.PlayerState.PLAYING 
                ? `<i data-lucide="pause" class="w-7 h-7 fill-current"></i>` 
                : `<i data-lucide="play" class="w-7 h-7 fill-current"></i>`;
            lucide.createIcons();
        }

        function updateTimerUI() {
            const rem = Math.max(0, allowedSeconds - watchedSeconds);
            const h = Math.floor(rem / 3600).toString().padStart(2, '0');
            const m = Math.floor((rem % 3600) / 60).toString().padStart(2, '0');
            const s = (rem % 60).toString().padStart(2, '0');
            document.getElementById('time-left').innerText = `${h}:${m}:${s}`;
            
            // Loading bar update
            const total = allowedSeconds || 3600;
            const progress = (watchedSeconds / total) * 100;
            document.getElementById('loading-bar').style.width = `${progress}%`;
        }

        function setupControls() {
            document.getElementById('play-pause').onclick = () => player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo();
            document.getElementById('mute-toggle').onclick = () => {
                player.isMuted() ? player.unMute() : player.mute();
                document.getElementById('mute-toggle').innerHTML = player.isMuted() 
                    ? `<i data-lucide="volume-x" class="w-5 h-5 text-red-500"></i>` 
                    : `<i data-lucide="volume-2" class="w-5 h-5"></i>`;
                lucide.createIcons();
            };
            document.getElementById('volume-slider').oninput = (e) => player.setVolume(e.target.value);
            document.getElementById('progress-container').onclick = (e) => player.seekTo(player.getDuration() * (e.offsetX / e.currentTarget.offsetWidth), true);
            document.getElementById('fullscreen-btn').onclick = () => {
                const wrapper = document.getElementById('video-wrapper');
                if (!document.fullscreenElement) wrapper.requestFullscreen();
                else document.exitFullscreen();
            };

            const speedBtn = document.getElementById('speed-btn');
            const speedMenu = document.getElementById('speed-menu');
            
            speedBtn.onclick = (e) => {
                e.stopPropagation();
                speedMenu.classList.toggle('active');
            };

            document.querySelectorAll('.speed-option').forEach(opt => {
                opt.onclick = () => {
                    const speed = parseFloat(opt.dataset.speed);
                    player.setPlaybackRate(speed);
                    speedBtn.innerText = `SPEED ${speed.toFixed(1)}X`;
                    document.querySelectorAll('.speed-option').forEach(o => o.classList.remove('active'));
                    opt.classList.add('active');
                    speedMenu.classList.remove('active');
                };
            });

            window.onclick = () => speedMenu.classList.remove('active');
        }

        function startWatermark() {
            const el = document.getElementById('moving-watermark');
            const wrap = document.getElementById('video-wrapper');
            function anim() {
                const r = wrap.getBoundingClientRect();
                const er = el.getBoundingClientRect();
                watermarkData.x += watermarkData.dx;
                watermarkData.y += watermarkData.dy;
                if (watermarkData.x <= 0 || watermarkData.x >= r.width - er.width) watermarkData.dx *= -1;
                if (watermarkData.y <= 0 || watermarkData.y >= r.height - er.height) watermarkData.dy *= -1;
                el.style.transform = `translate(${watermarkData.x}px, ${watermarkData.y}px)`;
                requestAnimationFrame(anim);
            }
            anim();
        }

        document.getElementById('btn-exit').onclick = () => window.location.href = '/curriculum';
        window.onload = init;
    </script>
</body>
</html>
