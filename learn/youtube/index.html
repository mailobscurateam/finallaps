<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Protocol | Nexus Prime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #09090b; 
            color: #f4f4f5; 
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        body.ready { opacity: 1; }
        
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .glass-card { 
            background: rgba(24, 24, 27, 0.4); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            background: #000;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #youtube-player {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 0; opacity: 0; transition: opacity 0.8s ease-in;
        }

        #youtube-player.visible { opacity: 1; }

        .watermark {
            position: absolute;
            z-index: 30;
            pointer-events: none;
            user-select: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: rgba(236, 72, 153, 0.25);
            text-transform: lowercase;
            white-space: nowrap;
        }

        .status-bar { height: 2px; background: rgba(255,255,255,0.05); position: relative; overflow: hidden; }
        .status-progress { position: absolute; height: 100%; background: #ec4899; width: 0%; transition: width 0.3s; }

        .nav-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 16px; 
            font-size: 10px; 
            font-weight: 700;
            text-transform: uppercase; 
            letter-spacing: 0.1em; 
            transition: all 0.3s;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-btn:hover { 
            background: rgba(236, 72, 153, 0.1); 
            border-color: #ec4899; 
            color: #ec4899; 
        }
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.3);
        }
        .nav-btn.complete-active {
            background: #10b981;
            border-color: #10b981;
            color: white;
        }

        .telemetry-box {
            border-left: 2px solid #ec4899;
            background: rgba(236, 72, 153, 0.03);
            padding: 1rem;
            border-radius: 0 12px 12px 0;
        }

        .preloader-overlay {
            position: absolute; inset: 0; background: #09090b;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 20;
        }
    </style>
</head>
<body>

    <header class="p-6 border-b border-white/5 flex justify-between items-center bg-black/20 backdrop-blur-xl sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <div class="w-8 h-8 rounded-lg bg-pink-500/20 flex items-center justify-center text-pink-500">
                <i data-lucide="play-circle" class="w-4 h-4"></i>
            </div>
            <div>
                <h1 id="lesson-title" class="text-sm font-bold tracking-tight text-white uppercase">Authenticating Protocol...</h1>
                <div class="flex items-center gap-2 mt-0.5">
                    <span class="mono text-[9px] text-pink-500 uppercase font-bold tracking-widest">YouTube Node</span>
                    <span id="info-status" class="mono text-[9px] text-yellow-500 uppercase font-bold tracking-widest">• Syncing</span>
                </div>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <div id="timer-display" class="hidden text-right mr-4">
                <p class="mono text-[9px] text-gray-500 uppercase font-bold tracking-widest">Time Remaining</p>
                <p id="time-left" class="text-lg font-black text-white tracking-tighter tabular-nums">--:--:--</p>
            </div>
            
            <button id="btn-complete" class="nav-btn" disabled>
                <i data-lucide="check-circle" class="w-3 h-3"></i>
                Mark Complete
            </button>

            <button id="btn-exit" class="nav-btn">
                <i data-lucide="arrow-left" class="w-3 h-3"></i>
                Exit
            </button>
        </div>
    </header>

    <div class="status-bar">
        <div id="loading-bar" class="status-progress"></div>
    </div>

    <main class="flex-1 p-6 md:p-12 max-w-6xl mx-auto w-full">
        <div id="telemetry-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="telemetry-box">
                <p class="mono text-[10px] text-gray-500 uppercase font-bold tracking-widest mb-1">Session UID</p>
                <p id="info-id" class="text-sm font-bold text-white tracking-tight">ANALYZING...</p>
            </div>
            <div class="telemetry-box">
                <p class="mono text-[10px] text-gray-500 uppercase font-bold tracking-widest mb-1">Watch Limit</p>
                <p id="info-limit" class="text-sm font-bold text-white tracking-tight">--</p>
            </div>
            <div class="telemetry-box">
                <p class="mono text-[10px] text-gray-500 uppercase font-bold tracking-widest mb-1">Stream Status</p>
                <p id="signal-quality" class="text-sm font-bold text-white tracking-tight">WAITING_FOR_HANDSHAKE</p>
            </div>
        </div>

        <div id="video-wrapper" class="video-container shadow-2xl">
            <div id="preloader" class="preloader-overlay">
                <div class="relative w-16 h-16 mb-6">
                    <div class="absolute inset-0 border-2 border-pink-500/20 rounded-full"></div>
                    <div class="absolute inset-0 border-2 border-pink-500 border-t-transparent rounded-full animate-spin"></div>
                </div>
                <p id="loader-text" class="mono text-[10px] font-bold tracking-[0.3em] text-pink-500 uppercase text-center">Decrypting Stream</p>
            </div>
            
            <div id="moving-watermark" class="watermark">initializing_secure_layer</div>
            <div id="youtube-player"></div>
        </div>
    </main>

    <script>
        // Configuration
        const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const lessonId = urlParams.get('id');

        let player;
        let currentUser = null;
        let allowedSeconds = 0;
        let watchedSeconds = 0;
        let sessionTimer = null;
        let watermarkData = { x: 10, y: 10, dx: 0.6, dy: 0.4 };
        let isCompleted = false;

        // Initialize App
        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }

            currentUser = session.user;
            document.getElementById('moving-watermark').innerText = currentUser.email;
            document.body.classList.add('ready');
            
            lucide.createIcons();
            await fetchLessonData();
            await checkCompletionStatus();
            startWatermark();
        }

        // Fetch Lesson Info & Timer Logic
        async function fetchLessonData() {
            if (!lessonId) { window.location.href = '/curriculum'; return; }

            const { data: lesson, error } = await sb
                .from('lessons')
                .select('*')
                .eq('id', lessonId)
                .single();

            if (error || !lesson) { showError("DATA_STREAM_CORRUPTED"); return; }

            const hours = parseInt(lesson.watchtime_hours) || 0;
            const minutes = parseInt(lesson.watchtime_minutes) || 0;
            allowedSeconds = (hours * 3600) + (minutes * 60);

            document.getElementById('lesson-title').innerText = lesson.title;
            document.getElementById('info-id').innerText = `X-CORE-${lesson.order_index || '000'}`;
            document.getElementById('info-limit').innerText = `${hours}H ${minutes}M ALLOCATED`;

            await syncSessionProgress();

            if (allowedSeconds > 0 && watchedSeconds >= allowedSeconds) {
                showError("WATCH_LIMIT_EXCEEDED");
                return;
            }

            loadYouTubeAPI(lesson.video_url);
        }

        // Database: Get existing watch time
        async function syncSessionProgress() {
            const { data } = await sb
                .from('watch_sessions')
                .select('total_seconds_watched')
                .eq('user_id', currentUser.id)
                .eq('lesson_id', lessonId)
                .maybeSingle();

            if (data) {
                watchedSeconds = data.total_seconds_watched;
            } else {
                await sb.from('watch_sessions').insert({
                    user_id: currentUser.id,
                    lesson_id: lessonId,
                    total_seconds_watched: 0
                });
            }
            updateTimerUI();
        }

        // YouTube API Loader
        function loadYouTubeAPI(videoUrl) {
            // Extract ID from URL (handles watch?v=, share links, etc)
            let videoId = videoUrl;
            if (videoUrl.includes('v=')) {
                videoId = videoUrl.split('v=')[1].split('&')[0];
            } else if (videoUrl.includes('youtu.be/')) {
                videoId = videoUrl.split('youtu.be/')[1].split('?')[0];
            }

            window.onYouTubeIframeAPIReady = () => {
                player = new YT.Player('youtube-player', {
                    videoId: videoId,
                    playerVars: {
                        'autoplay': 0,
                        'controls': 1,
                        'rel': 0,
                        'modestbranding': 1,
                        'origin': window.location.origin
                    },
                    events: {
                        'onReady': onPlayerReady,
                        'onStateChange': onPlayerStateChange
                    }
                });
            };

            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            document.body.appendChild(tag);
        }

        function onPlayerReady(event) {
            document.getElementById('loading-bar').style.width = '100%';
            document.getElementById('info-status').innerText = "• ONLINE";
            document.getElementById('info-status').className = "mono text-[9px] text-green-500 uppercase font-bold tracking-widest";
            document.getElementById('signal-quality').innerText = "STABLE_ENCRYPTED";
            document.getElementById('preloader').style.display = 'none';
            document.getElementById('youtube-player').classList.add('visible');
            document.getElementById('timer-display').classList.remove('hidden');
            
            startTracking();
        }

        function onPlayerStateChange(event) {
            // Optional: Pause tracking if video is paused? 
            // In high-security simulations, we usually track session time regardless.
        }

        // Heartbeat & Timer logic
        function startTracking() {
            sessionTimer = setInterval(async () => {
                watchedSeconds += 1;
                updateTimerUI();

                // Periodic DB Sync
                if (watchedSeconds % 10 === 0) {
                    await sb.from('watch_sessions')
                        .update({ 
                            total_seconds_watched: watchedSeconds, 
                            last_watched_at: new Date().toISOString() 
                        })
                        .eq('user_id', currentUser.id)
                        .eq('lesson_id', lessonId);
                }

                // Limit Enforcement
                if (allowedSeconds > 0 && watchedSeconds >= allowedSeconds) {
                    clearInterval(sessionTimer);
                    player.stopVideo();
                    showError("SESSION_EXPIRED");
                }
            }, 1000);
        }

        function updateTimerUI() {
            const remaining = Math.max(0, allowedSeconds - watchedSeconds);
            const h = Math.floor(remaining / 3600);
            const m = Math.floor((remaining % 3600) / 60);
            const s = remaining % 60;
            document.getElementById('time-left').innerText = 
                `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        // Completion Logic
        async function checkCompletionStatus() {
            const { data } = await sb
                .from('lesson_completions')
                .select('*')
                .eq('user_id', currentUser.id)
                .eq('lesson_id', lessonId)
                .maybeSingle();

            if (data) {
                setCompleteUI();
            } else {
                // Enable button after 10s of presence
                setTimeout(() => {
                    if(!isCompleted) document.getElementById('btn-complete').disabled = false;
                }, 10000);
            }
        }

        async function handleMarkComplete() {
            if (isCompleted) return;
            const btn = document.getElementById('btn-complete');
            btn.disabled = true;
            btn.innerText = "UPLOADING...";

            const { error } = await sb
                .from('lesson_completions')
                .insert({ user_id: currentUser.id, lesson_id: lessonId });

            if (error) {
                btn.innerText = "RETRY_UPLOAD";
                btn.disabled = false;
                return;
            }
            setCompleteUI();
        }

        function setCompleteUI() {
            const btn = document.getElementById('btn-complete');
            btn.innerHTML = `<i data-lucide="check" class="w-3 h-3"></i> COMPLETE`;
            btn.classList.add('complete-active');
            btn.disabled = true;
            isCompleted = true;
            lucide.createIcons();
        }

        // Visual Watermark
        function startWatermark() {
            const el = document.getElementById('moving-watermark');
            const wrapper = document.getElementById('video-wrapper');
            function animate() {
                const rect = wrapper.getBoundingClientRect();
                const elRect = el.getBoundingClientRect();
                watermarkData.x += watermarkData.dx;
                watermarkData.y += watermarkData.dy;
                
                if (watermarkData.x <= 0 || watermarkData.x + elRect.width >= rect.width) watermarkData.dx *= -1;
                if (watermarkData.y <= 0 || watermarkData.y + elRect.height >= rect.height) watermarkData.dy *= -1;
                
                el.style.left = watermarkData.x + 'px';
                el.style.top = watermarkData.y + 'px';
                requestAnimationFrame(animate);
            }
            animate();
        }

        function showError(msg) {
            document.getElementById('preloader').style.display = 'flex';
            document.getElementById('preloader').innerHTML = `
                <div class="text-center p-8 glass-card rounded-2xl border-pink-500/20">
                    <p class="mono text-pink-500 font-black tracking-widest uppercase mb-2">ACCESS_DENIED</p>
                    <p class="text-[10px] text-gray-500 uppercase tracking-[4px]">${msg}</p>
                    <button onclick="window.location.href='/curriculum'" class="mt-8 nav-btn mx-auto">
                        Return to Dashboard
                    </button>
                </div>
            `;
            document.getElementById('info-status').innerText = "• TERMINATED";
            document.getElementById('info-status').className = "mono text-[9px] text-red-500 uppercase font-bold tracking-widest";
            document.getElementById('signal-quality').innerText = "CONNECTION_LOST";
        }

        document.getElementById('btn-exit').onclick = () => window.location.href = '/curriculum';
        document.getElementById('btn-complete').onclick = handleMarkComplete;
        window.onload = init;
    </script>
</body>
</html>
