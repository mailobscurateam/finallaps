<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Protocol | Nexus Prime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #09090b; 
            color: #f4f4f5; 
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        body.ready { opacity: 1; }
        
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .glass-card { 
            background: rgba(24, 24, 27, 0.4); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            background: #000;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #youtube-player {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 0; opacity: 0; transition: opacity 0.8s ease-in;
            z-index: 5;
            pointer-events: none;
        }

        #youtube-player.visible { opacity: 1; }

        .controls-overlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 40%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .video-container:hover .controls-overlay {
            opacity: 1;
        }

        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            cursor: pointer;
            position: relative;
            margin-bottom: 12px;
            transition: height 0.2s;
        }
        
        .progress-bar-container:hover { height: 6px; }

        .progress-filled {
            height: 100%;
            background: #ec4899;
            width: 0%;
            position: relative;
        }

        .speed-menu {
            position: absolute;
            bottom: 100%;
            right: 0;
            background: #18181b;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 8px;
            display: none;
            flex-direction: column;
            min-width: 80px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        
        .speed-menu.active { display: flex; }
        
        .speed-option {
            padding: 8px 12px;
            font-size: 11px;
            color: #a1a1aa;
            text-align: left;
            border-radius: 4px;
            transition: all 0.2s;
        }
        
        .speed-option:hover { background: rgba(255,255,255,0.05); color: white; }
        .speed-option.active { color: #ec4899; font-weight: 800; }

        .watermark {
            position: absolute;
            z-index: 50; 
            pointer-events: none;
            user-select: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
            mix-blend-mode: difference;
            text-transform: lowercase;
            white-space: nowrap;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .status-bar { height: 2px; background: rgba(255,255,255,0.05); position: relative; overflow: hidden; }
        .status-progress { position: absolute; height: 100%; background: #ec4899; width: 0%; transition: width 0.3s; }

        .nav-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 16px; 
            font-size: 10px; 
            font-weight: 700;
            text-transform: uppercase; 
            letter-spacing: 0.1em; 
            transition: all 0.3s;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-btn:hover { 
            background: rgba(236, 72, 153, 0.1); 
            border-color: #ec4899; 
            color: #ec4899; 
        }

        .telemetry-box {
            border-left: 2px solid #ec4899;
            background: rgba(236, 72, 153, 0.03);
            padding: 1rem;
            border-radius: 0 12px 12px 0;
        }

        input[type=range] { accent-color: #ec4899; }
    </style>
</head>
<body>

    <header class="p-6 border-b border-white/5 flex justify-between items-center bg-black/20 backdrop-blur-xl sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <div class="w-8 h-8 rounded-lg bg-pink-500/20 flex items-center justify-center text-pink-500">
                <i data-lucide="play-circle" class="w-4 h-4"></i>
            </div>
            <div>
                <h1 id="lesson-title" class="text-sm font-bold tracking-tight text-white uppercase">Authenticating Protocol...</h1>
                <div class="flex items-center gap-2 mt-0.5">
                    <span class="mono text-[9px] text-pink-500 uppercase font-bold tracking-widest">YouTube Node</span>
                    <span id="info-status" class="mono text-[9px] text-yellow-500 uppercase font-bold tracking-widest">• Syncing</span>
                </div>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <div id="timer-display" class="hidden text-right mr-4">
                <p class="mono text-[9px] text-gray-500 uppercase font-bold tracking-widest">Time Remaining</p>
                <p id="time-left" class="text-lg font-black text-white tracking-tighter tabular-nums">--:--:--</p>
            </div>
            <button id="btn-complete" class="nav-btn" disabled>Mark Complete</button>
            <button id="btn-exit" class="nav-btn">Exit</button>
        </div>
    </header>

    <div class="status-bar">
        <div id="loading-bar" class="status-progress"></div>
    </div>

    <main class="flex-1 p-6 md:p-12 max-w-6xl mx-auto w-full">
        <div id="telemetry-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="telemetry-box">
                <p class="mono text-[10px] text-gray-500 uppercase font-bold tracking-widest mb-1">Session UID</p>
                <p id="info-id" class="text-sm font-bold text-white tracking-tight">ANALYZING...</p>
            </div>
            <div class="telemetry-box">
                <p class="mono text-[10px] text-gray-500 uppercase font-bold tracking-widest mb-1">Watch Limit</p>
                <p id="info-limit" class="text-sm font-bold text-white tracking-tight">--</p>
            </div>
            <div class="telemetry-box">
                <p class="mono text-[10px] text-gray-500 uppercase font-bold tracking-widest mb-1">Stream Status</p>
                <p id="signal-quality" class="text-sm font-bold text-white tracking-tight">WAITING_FOR_HANDSHAKE</p>
            </div>
        </div>

        <div id="video-wrapper" class="video-container shadow-2xl">
            <div id="preloader" class="absolute inset-0 bg-black flex items-center justify-center z-[60]">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-pink-500"></div>
            </div>
            
            <div id="moving-watermark" class="watermark">initializing...</div>
            <div id="youtube-player"></div>

            <!-- Custom Controls -->
            <div id="custom-controls" class="controls-overlay p-4">
                <div id="progress-container" class="progress-bar-container">
                    <div id="progress-bar" class="progress-filled"></div>
                </div>
                
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-6">
                        <button id="play-pause" class="text-white hover:text-pink-500">
                            <i data-lucide="play" class="w-6 h-6 fill-current"></i>
                        </button>
                        
                        <div class="flex items-center gap-3">
                            <button id="mute-toggle" class="text-white hover:text-pink-500">
                                <i data-lucide="volume-2" class="w-5 h-5"></i>
                            </button>
                            <input id="volume-slider" type="range" min="0" max="100" value="100" class="w-16 h-1 bg-white/20 rounded-lg appearance-none cursor-pointer">
                        </div>

                        <span id="current-timestamp" class="mono text-[11px] text-white/70">0:00 / 0:00</span>
                    </div>

                    <div class="flex items-center gap-4 relative">
                        <!-- Speed Control -->
                        <div class="relative">
                            <button id="speed-btn" class="mono text-[10px] font-bold text-white/70 hover:text-pink-500 px-2 py-1 border border-white/10 rounded">
                                SPEED 1.0X
                            </button>
                            <div id="speed-menu" class="speed-menu">
                                <button class="speed-option" data-speed="0.5">0.5x</button>
                                <button class="speed-option" data-speed="0.75">0.75x</button>
                                <button class="speed-option active" data-speed="1">1.0x (Norm)</button>
                                <button class="speed-option" data-speed="1.25">1.25x</button>
                                <button class="speed-option" data-speed="1.5">1.5x</button>
                                <button class="speed-option" data-speed="2">2.0x</button>
                            </div>
                        </div>

                        <button id="fullscreen-btn" class="text-white hover:text-pink-500">
                            <i data-lucide="maximize" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const urlParams = new URLSearchParams(window.location.search);
        const lessonId = urlParams.get('id');

        let player, currentUser, allowedSeconds, watchedSeconds = 0;
        let watermarkData = { x: 50, y: 50, dx: 0.8, dy: 0.6 };
        let sessionTrackingActive = false;
        let isLessonAlreadyCompleted = false;

        async function init() {
            // Check Auth
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUser = session.user;

            // Security Check: Verify Course Approval
            const isApproved = await verifyCourseApproval();
            if (!isApproved) {
                window.location.href = '/dashboard';
                return;
            }

            document.getElementById('moving-watermark').innerText = currentUser.email;
            document.body.classList.add('ready');
            lucide.createIcons();
            
            // Step 1: Check database for existing completion
            await checkInitialCompletionStatus();
            
            // Step 2: Fetch lesson details and setup player
            await fetchLessonData();
            startWatermark();
            setupControls();
            
            // Step 3: Start session tracking
            startPageSessionTracking();
        }

        async function verifyCourseApproval() {
            try {
                // 1. Get the lesson to find which course it belongs to
                const { data: lesson, error: lessonError } = await sb
                    .from('lessons')
                    .select('course_id')
                    .eq('id', lessonId)
                    .single();

                if (lessonError || !lesson) return false;

                // 2. Check if user has an 'approved' status for this course_id in course_approvals table
                const { data: approval, error: approvalError } = await sb
                    .from('course_approvals')
                    .select('status')
                    .eq('user_id', currentUser.id)
                    .eq('course_id', lesson.course_id)
                    .eq('status', 'approved')
                    .maybeSingle();

                if (approvalError || !approval) return false;

                return true;
            } catch (e) {
                console.error("Approval verification failed:", e);
                return false;
            }
        }

        async function checkInitialCompletionStatus() {
            const { data: completion } = await sb.from('lesson_completions')
                .select('*')
                .eq('user_id', currentUser.id)
                .eq('lesson_id', lessonId)
                .maybeSingle();

            if (completion) {
                isLessonAlreadyCompleted = true;
                setCompleteUI();
            }
        }

        async function fetchLessonData() {
            const { data: lesson } = await sb.from('lessons').select('*').eq('id', lessonId).single();
            if (!lesson) return;
            allowedSeconds = (parseInt(lesson.watchtime_hours) * 3600) + (parseInt(lesson.watchtime_minutes) * 60);
            document.getElementById('lesson-title').innerText = lesson.title;
            document.getElementById('info-id').innerText = `X-CORE-${lesson.order_index || '000'}`;
            
            // Fetch initial progress from DB
            const { data: sessionData } = await sb.from('watch_sessions')
                .select('total_seconds_watched')
                .eq('user_id', currentUser.id)
                .eq('lesson_id', lessonId)
                .maybeSingle();
            
            if (sessionData) {
                watchedSeconds = sessionData.total_seconds_watched;
            }

            loadYouTubeAPI(lesson.video_url);
        }

        function loadYouTubeAPI(videoUrl) {
            let vid = videoUrl.includes('v=') ? videoUrl.split('v=')[1].split('&')[0] : videoUrl.split('/').pop();
            window.onYouTubeIframeAPIReady = () => {
                player = new YT.Player('youtube-player', {
                    videoId: vid,
                    playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1, 'rel': 0, 'modestbranding': 1 },
                    events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
                });
            };
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            document.body.appendChild(tag);
        }

        function onPlayerReady() {
            document.getElementById('preloader').style.display = 'none';
            document.getElementById('youtube-player').classList.add('visible');
            document.getElementById('info-status').innerText = "• ONLINE";
            document.getElementById('info-status').className = "mono text-[9px] text-green-500 uppercase font-bold tracking-widest";
            
            setInterval(() => {
                if (player && player.getCurrentTime) {
                    const curr = player.getCurrentTime();
                    const dur = player.getDuration();
                    document.getElementById('progress-bar').style.width = (curr/dur*100) + '%';
                    document.getElementById('current-timestamp').innerText = `${Math.floor(curr/60)}:${Math.floor(curr%60).toString().padStart(2,'0')} / ${Math.floor(dur/60)}:${Math.floor(dur%60).toString().padStart(2,'0')}`;
                }
            }, 1000);
        }

        function startPageSessionTracking() {
            if (sessionTrackingActive) return;
            sessionTrackingActive = true;
            
            document.getElementById('timer-display').classList.remove('hidden');
            updateTimerUI();

            // Unlock Logic
            if (!isLessonAlreadyCompleted) {
                setTimeout(() => {
                    const btn = document.getElementById('btn-complete');
                    btn.disabled = false;
                    btn.onclick = handleMarkComplete;
                }, 10000);
            }

            setInterval(async () => {
                watchedSeconds += 1;
                updateTimerUI();

                if (watchedSeconds % 10 === 0) {
                    await sb.from('watch_sessions')
                        .upsert({ 
                            user_id: currentUser.id, 
                            lesson_id: lessonId, 
                            total_seconds_watched: watchedSeconds,
                            last_watched_at: new Date().toISOString()
                        }, { onConflict: 'user_id,lesson_id' });
                }

                if (allowedSeconds > 0 && watchedSeconds >= allowedSeconds) {
                    handleSessionExpired();
                }
            }, 1000);
        }

        function handleSessionExpired() {
            if (player && player.pauseVideo) player.pauseVideo();
            document.getElementById('video-wrapper').innerHTML = `
                <div class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-[70] text-center p-6">
                    <p class="mono text-red-500 font-bold tracking-widest mb-2 uppercase">Session Limit Reached</p>
                    <p class="text-xs text-gray-400 max-w-xs">Your allocated access time for this protocol has expired. Please return to the dashboard.</p>
                    <button onclick="window.location.href='/curriculum'" class="mt-6 nav-btn">Return to Dashboard</button>
                </div>
            `;
        }

        async function handleMarkComplete() {
            const btn = document.getElementById('btn-complete');
            btn.disabled = true;
            btn.innerText = "PROCESSING...";

            const { error } = await sb.from('lesson_completions').insert({
                user_id: currentUser.id,
                lesson_id: lessonId
            });

            if (error) {
                btn.disabled = false;
                btn.innerText = "RETRY COMPLETE";
                return;
            }
            setCompleteUI();
        }

        function setCompleteUI() {
            const btn = document.getElementById('btn-complete');
            btn.innerText = "COMPLETE";
            btn.classList.add('bg-pink-600', 'border-pink-500', 'text-white');
            btn.disabled = true;
        }

        function onPlayerStateChange(ev) {
            const btn = document.getElementById('play-pause');
            btn.innerHTML = ev.data === YT.PlayerState.PLAYING ? `<i data-lucide="pause" class="w-6 h-6 fill-current"></i>` : `<i data-lucide="play" class="w-6 h-6 fill-current"></i>`;
            lucide.createIcons();
        }

        function updateTimerUI() {
            const rem = Math.max(0, allowedSeconds - watchedSeconds);
            const h = Math.floor(rem / 3600).toString().padStart(2, '0');
            const m = Math.floor((rem % 3600) / 60).toString().padStart(2, '0');
            const s = (rem % 60).toString().padStart(2, '0');
            document.getElementById('time-left').innerText = `${h}:${m}:${s}`;
        }

        function setupControls() {
            document.getElementById('play-pause').onclick = () => player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo();
            document.getElementById('mute-toggle').onclick = () => {
                player.isMuted() ? player.unMute() : player.mute();
                document.getElementById('mute-toggle').innerHTML = player.isMuted() ? `<i data-lucide="volume-x" class="w-5 h-5 text-red-500"></i>` : `<i data-lucide="volume-2" class="w-5 h-5"></i>`;
                lucide.createIcons();
            };
            document.getElementById('volume-slider').oninput = (e) => player.setVolume(e.target.value);
            document.getElementById('progress-container').onclick = (e) => player.seekTo(player.getDuration() * (e.offsetX / e.currentTarget.offsetWidth), true);
            document.getElementById('fullscreen-btn').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.getElementById('video-wrapper').requestFullscreen();

            const speedBtn = document.getElementById('speed-btn');
            const speedMenu = document.getElementById('speed-menu');
            
            speedBtn.onclick = (e) => {
                e.stopPropagation();
                speedMenu.classList.toggle('active');
            };

            document.querySelectorAll('.speed-option').forEach(opt => {
                opt.onclick = () => {
                    const speed = parseFloat(opt.dataset.speed);
                    player.setPlaybackRate(speed);
                    speedBtn.innerText = `SPEED ${speed.toFixed(1)}X`;
                    document.querySelectorAll('.speed-option').forEach(o => o.classList.remove('active'));
                    opt.classList.add('active');
                    speedMenu.classList.remove('active');
                };
            });

            window.onclick = () => speedMenu.classList.remove('active');
        }

        function startWatermark() {
            const el = document.getElementById('moving-watermark');
            const wrap = document.getElementById('video-wrapper');
            function anim() {
                const r = wrap.getBoundingClientRect();
                const er = el.getBoundingClientRect();
                watermarkData.x += watermarkData.dx;
                watermarkData.y += watermarkData.dy;
                if (watermarkData.x <= 0 || watermarkData.x >= r.width - er.width) watermarkData.dx *= -1;
                if (watermarkData.y <= 0 || watermarkData.y >= r.height - er.height) watermarkData.dy *= -1;
                el.style.transform = `translate(${watermarkData.x}px, ${watermarkData.y}px)`;
                requestAnimationFrame(anim);
            }
            anim();
        }

        document.getElementById('btn-exit').onclick = () => window.location.href = '/curriculum';
        window.onload = init;
    </script>
</body>
</html>
