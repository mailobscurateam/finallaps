<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Simulation | Nexus Prime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #09090b; 
            color: #f4f4f5; 
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        body.ready { opacity: 1; }
        
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .glass-card { 
            background: rgba(24, 24, 27, 0.4); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            background: #000;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 0; opacity: 0; transition: opacity 0.8s ease-in;
            background: #000;
        }

        .video-container iframe.visible { opacity: 1; }

        .watermark {
            position: absolute;
            z-index: 30;
            pointer-events: none;
            user-select: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: rgba(236, 72, 153, 0.3);
            text-transform: lowercase;
            white-space: nowrap;
        }

        .status-bar { height: 2px; background: rgba(255,255,255,0.05); position: relative; overflow: hidden; }
        .status-progress { position: absolute; height: 100%; background: #ec4899; width: 0%; transition: width 0.3s; }

        .nav-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 16px; 
            font-size: 10px; 
            font-weight: 700;
            text-transform: uppercase; 
            letter-spacing: 0.1em; 
            transition: all 0.3s;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-btn:hover { 
            background: rgba(236, 72, 153, 0.1); 
            border-color: #ec4899; 
            color: #ec4899; 
        }
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.3);
        }
        .nav-btn.complete-active {
            background: #10b981;
            border-color: #10b981;
            color: white;
        }

        .telemetry-box {
            border-left: 2px solid #ec4899;
            background: rgba(236, 72, 153, 0.03);
            padding: 1rem;
            border-radius: 0 12px 12px 0;
        }

        .preloader-overlay {
            position: absolute; inset: 0; background: #09090b;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 20;
        }
    </style>
</head>
<body>

    <header class="p-6 border-b border-white/5 flex justify-between items-center bg-black/20 backdrop-blur-xl sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <div class="w-8 h-8 rounded-lg bg-pink-500/20 flex items-center justify-center text-pink-500">
                <i data-lucide="video" class="w-4 h-4"></i>
            </div>
            <div>
                <h1 id="lesson-title" class="text-sm font-bold tracking-tight text-white uppercase">Authenticating Stream...</h1>
                <div class="flex items-center gap-2 mt-0.5">
                    <span class="mono text-[9px] text-pink-500 uppercase font-bold tracking-widest">Live Session</span>
                    <span id="info-status" class="mono text-[9px] text-yellow-500 uppercase font-bold tracking-widest">• Syncing</span>
                </div>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <div id="timer-display" class="hidden text-right mr-4">
                <p class="mono text-[9px] text-gray-500 uppercase font-bold tracking-widest">Time Remaining</p>
                <p id="time-left" class="text-lg font-black text-white tracking-tighter tabular-nums">--:--:--</p>
            </div>
            
            <button id="btn-complete" class="nav-btn" disabled>
                <i data-lucide="check-circle" class="w-3 h-3"></i>
                Mark Complete
            </button>

            <button id="btn-exit" class="nav-btn">
                <i data-lucide="x" class="w-3 h-3"></i>
                Exit
            </button>
        </div>
    </header>

    <div class="status-bar">
        <div id="loading-bar" class="status-progress"></div>
    </div>

    <main class="flex-1 p-6 md:p-12 max-w-6xl mx-auto w-full">
        <div id="telemetry-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="telemetry-box">
                <p class="mono text-[10px] text-gray-500 uppercase font-bold tracking-widest mb-1">Stream Identifier</p>
                <p id="info-id" class="text-sm font-bold text-white tracking-tight">REDACTED</p>
            </div>
            <div class="telemetry-box">
                <p class="mono text-[10px] text-gray-500 uppercase font-bold tracking-widest mb-1">Access Protocol</p>
                <p id="info-limit" class="text-sm font-bold text-white tracking-tight">--</p>
            </div>
            <div class="telemetry-box">
                <p class="mono text-[10px] text-gray-500 uppercase font-bold tracking-widest mb-1">Connection Integrity</p>
                <p id="signal-quality" class="text-sm font-bold text-white tracking-tight">STABLE_ENCRYPTED</p>
            </div>
        </div>

        <div id="video-wrapper" class="video-container shadow-2xl">
            <div id="preloader" class="preloader-overlay">
                <div class="relative w-16 h-16 mb-6">
                    <div class="absolute inset-0 border-2 border-pink-500/20 rounded-full"></div>
                    <div class="absolute inset-0 border-2 border-pink-500 border-t-transparent rounded-full animate-spin"></div>
                </div>
                <p id="loader-text" class="mono text-[10px] font-bold tracking-[0.3em] text-pink-500 uppercase text-center">Establishing Link</p>
            </div>
            
            <div id="moving-watermark" class="watermark">initializing_secure_layer</div>
            <div id="iframe-holder"></div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const lessonId = urlParams.get('id');

        let currentUser = null;
        let allowedSeconds = 0;
        let watchedSeconds = 0;
        let sessionTimer = null;
        let watermarkData = { x: 10, y: 10, dx: 0.5, dy: 0.5 };
        let isCompleted = false;

        async function checkAuth() {
            // 1. Initial Session Check
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUser = session.user;

            // 2. Verify Course Approval Status before proceeding
            const isApproved = await verifyCourseApproval();
            if (!isApproved) {
                window.location.href = '/dashboard';
                return;
            }

            // 3. Setup UI
            document.getElementById('moving-watermark').innerText = currentUser.email;
            document.body.classList.add('ready');
            
            lucide.createIcons();
            fetchLessonData();
            checkCompletionStatus();
            startWatermark();
        }

        /**
         * Verifies if the current user has "approved" status for the course 
         * associated with this specific lesson.
         */
        async function verifyCourseApproval() {
            try {
                // Fetch the lesson to get the course_id
                const { data: lesson, error: lessonError } = await sb
                    .from('lessons')
                    .select('course_id')
                    .eq('id', lessonId)
                    .single();

                if (lessonError || !lesson) return false;

                // Check course_status table for this user/course combo
                const { data: approval, error: approvalError } = await sb
                    .from('course_status')
                    .select('status')
                    .eq('user_id', currentUser.id)
                    .eq('course_id', lesson.course_id)
                    .eq('status', 'approved')
                    .maybeSingle();

                if (approvalError || !approval) return false;

                return true;
            } catch (e) {
                console.error("Critical Security Check Failed:", e);
                return false;
            }
        }

        async function fetchLessonData() {
            if (!lessonId) { window.location.href = '/curriculum'; return; }

            const { data: lesson, error } = await sb
                .from('lessons')
                .select('*')
                .eq('id', lessonId)
                .single();

            if (error || !lesson) { showError("LINK FAILED: DATA NOT FOUND"); return; }

            const hours = parseInt(lesson.watchtime_hours) || 0;
            const minutes = parseInt(lesson.watchtime_minutes) || 0;
            allowedSeconds = (hours * 3600) + (minutes * 60);

            document.getElementById('lesson-title').innerText = lesson.title;
            document.getElementById('info-id').innerText = `X-CORE-${lesson.order_index || '000'}`;
            document.getElementById('info-limit').innerText = `${hours}H ${minutes}M ALLOCATED`;

            await syncProgress();

            if (allowedSeconds > 0 && watchedSeconds >= allowedSeconds) {
                showError("AIRTIME DEPLETED");
                return;
            }

            initStream(lesson.video_url);
        }

        async function checkCompletionStatus() {
            const { data } = await sb
                .from('lesson_completions')
                .select('*')
                .eq('user_id', currentUser.id)
                .eq('lesson_id', lessonId)
                .maybeSingle();

            if (data) {
                setCompleteUI(true);
            } else {
                // Enable button after 5 seconds of session
                setTimeout(() => {
                    document.getElementById('btn-complete').disabled = false;
                }, 5000);
            }
        }

        async function syncProgress() {
            const { data } = await sb
                .from('watch_sessions')
                .select('total_seconds_watched')
                .eq('user_id', currentUser.id)
                .eq('lesson_id', lessonId)
                .maybeSingle();

            if (data) {
                watchedSeconds = data.total_seconds_watched;
            } else {
                await sb.from('watch_sessions').insert({
                    user_id: currentUser.id,
                    lesson_id: lessonId,
                    total_seconds_watched: 0
                });
            }
        }

        function initStream(url) {
            const holder = document.getElementById('iframe-holder');
            const iframe = document.createElement('iframe');
            iframe.src = url;
            iframe.allow = "autoplay; fullscreen; microphone; camera; display-capture";
            
            iframe.onload = () => {
                document.getElementById('loading-bar').style.width = '100%';
                document.getElementById('info-status').innerText = "• ONLINE";
                document.getElementById('info-status').className = "mono text-[9px] text-green-500 uppercase font-bold tracking-widest";
                document.getElementById('preloader').style.display = 'none';
                iframe.classList.add('visible');
                
                document.getElementById('timer-display').classList.remove('hidden');
                startClock();
            };

            holder.appendChild(iframe);
        }

        function startClock() {
            sessionTimer = setInterval(async () => {
                watchedSeconds += 1;
                updateUI();

                if (watchedSeconds % 10 === 0) { // Sync every 10s
                    await sb.from('watch_sessions')
                        .update({ total_seconds_watched: watchedSeconds, last_watched_at: new Date().toISOString() })
                        .eq('user_id', currentUser.id)
                        .eq('lesson_id', lessonId);
                }

                if (allowedSeconds > 0 && watchedSeconds >= allowedSeconds) {
                    clearInterval(sessionTimer);
                    showError("WATCH LIMIT REACHED");
                }
            }, 1000);
        }

        function updateUI() {
            const remaining = Math.max(0, allowedSeconds - watchedSeconds);
            const h = Math.floor(remaining / 3600);
            const m = Math.floor((remaining % 3600) / 60);
            const s = remaining % 60;
            document.getElementById('time-left').innerText = 
                `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function startWatermark() {
            const el = document.getElementById('moving-watermark');
            const wrapper = document.getElementById('video-wrapper');
            function animate() {
                const rect = wrapper.getBoundingClientRect();
                const elRect = el.getBoundingClientRect();
                watermarkData.x += watermarkData.dx;
                watermarkData.y += watermarkData.dy;
                if (watermarkData.x <= 0 || watermarkData.x + elRect.width >= rect.width) watermarkData.dx *= -1;
                if (watermarkData.y <= 0 || watermarkData.y + elRect.height >= rect.height) watermarkData.dy *= -1;
                el.style.left = watermarkData.x + 'px';
                el.style.top = watermarkData.y + 'px';
                requestAnimationFrame(animate);
            }
            animate();
        }

        function setCompleteUI(alreadyDone = false) {
            const btn = document.getElementById('btn-complete');
            btn.innerHTML = `<i data-lucide="check" class="w-3 h-3"></i> COMPLETED`;
            btn.classList.add('complete-active');
            btn.disabled = true;
            isCompleted = true;
            lucide.createIcons();
        }

        async function markAsComplete() {
            if (isCompleted) return;

            const btn = document.getElementById('btn-complete');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerText = "SYNCING...";

            const { error } = await sb
                .from('lesson_completions')
                .insert({
                    user_id: currentUser.id,
                    lesson_id: lessonId
                });

            if (error) {
                console.error("Completion error:", error);
                btn.innerHTML = originalText;
                btn.disabled = false;
                return;
            }

            setCompleteUI();
        }

        function showError(msg) {
            document.getElementById('preloader').style.display = 'flex';
            document.getElementById('preloader').innerHTML = `
                <div class="text-center p-6">
                    <p class="mono text-pink-500 font-black tracking-widest uppercase mb-2">ACCESS TERMINATED</p>
                    <p class="text-[10px] text-gray-500 uppercase tracking-[4px]">${msg}</p>
                    <button onclick="window.location.href='/curriculum'" class="mt-8 nav-btn mx-auto">Return to Curriculum</button>
                </div>
            `;
            document.getElementById('info-status').innerText = "• DISCONNECTED";
            document.getElementById('info-status').className = "mono text-[9px] text-red-500 uppercase font-bold tracking-widest";
        }

        document.getElementById('btn-exit').onclick = () => window.location.href = '/curriculum';
        document.getElementById('btn-complete').onclick = markAsComplete;
        window.onload = checkAuth;
    </script>
</body>
</html>
