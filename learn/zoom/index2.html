<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Terminal | Nexus Prime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent: #ff3333;
            --bg: #0a0a0b;
            --card-bg: #111113;
            --border: rgba(255, 255, 255, 0.06);
        }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            color: #ececec; 
            letter-spacing: -0.01em;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        body.ready { opacity: 1; }

        .mono { font-family: 'JetBrains Mono', monospace; }

        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(at 0% 0%, rgba(255, 51, 51, 0.03) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 51, 51, 0.02) 0, transparent 50%);
            z-index: -1;
        }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
        }

        .nav-blur {
            backdrop-filter: blur(12px) saturate(180%);
            background: rgba(10, 10, 11, 0.8);
            border-bottom: 1px solid var(--border);
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            background: #000;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 0; opacity: 0; transition: opacity 1s ease;
        }
        .video-container iframe.visible { opacity: 1; }

        .watermark {
            position: absolute;
            z-index: 30;
            pointer-events: none;
            user-select: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: rgba(255, 51, 51, 0.2);
            text-transform: lowercase;
            white-space: nowrap;
        }

        .btn-primary {
            background: #fff;
            color: #000;
            transition: all 0.2s ease;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--accent);
            color: #fff;
            transform: translateY(-1px);
        }
        .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.08); }

        .telemetry-box {
            background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 100%);
            border: 1px solid var(--border);
            padding: 1.25rem;
            border-radius: 20px;
        }

        .preloader-overlay {
            position: absolute; inset: 0; background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 40;
        }

        .progress-line {
            height: 2px;
            background: rgba(255, 51, 51, 0.1);
            position: relative;
            overflow: hidden;
        }
        .progress-line-fill {
            position: absolute;
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.4s ease;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <div class="mesh-bg"></div>

    <!-- Terminal Nav -->
    <nav class="fixed top-0 w-full z-50 px-6 py-4 nav-blur">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='/curriculum'" class="w-8 h-8 rounded-full border border-white/10 flex items-center justify-center hover:bg-white/5 transition-colors">
                    <i data-lucide="arrow-left" class="w-4 h-4 text-neutral-400"></i>
                </button>
                <div>
                    <h1 id="lesson-title" class="text-xs font-bold tracking-tight uppercase">Authenticating...</h1>
                    <div class="flex items-center gap-2">
                        <span id="info-status" class="mono text-[9px] text-yellow-500 font-bold tracking-widest uppercase">● Syncing</span>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-6">
                <div id="timer-display" class="hidden text-right border-r border-white/10 pr-6">
                    <p class="mono text-[8px] text-neutral-500 font-bold tracking-widest uppercase">Airtime Remaining</p>
                    <p id="time-left" class="text-lg font-bold tracking-tighter tabular-nums">--:--:--</p>
                </div>
                
                <div class="flex items-center gap-3">
                    <button id="btn-complete" class="btn-primary px-5 py-2 rounded-xl text-[10px] font-bold uppercase tracking-wider flex items-center gap-2" disabled>
                        <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
                        Complete
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="fixed top-[73px] w-full z-40 progress-line">
        <div id="loading-bar" class="progress-line-fill"></div>
    </div>

    <main class="flex-1 pt-32 pb-20 px-6 max-w-6xl mx-auto w-full">
        <!-- Telemetry Data -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="telemetry-box">
                <p class="mono text-[9px] text-neutral-500 font-bold uppercase tracking-[0.2em] mb-1">Signal Hash</p>
                <p id="info-id" class="text-sm font-bold tracking-tight">X-CORE-REDACTED</p>
            </div>
            <div class="telemetry-box">
                <p class="mono text-[9px] text-neutral-500 font-bold uppercase tracking-[0.2em] mb-1">Access Tier</p>
                <p id="info-limit" class="text-sm font-bold tracking-tight text-neutral-300">--</p>
            </div>
            <div class="telemetry-box">
                <p class="mono text-[9px] text-neutral-500 font-bold uppercase tracking-[0.2em] mb-1">Security Status</p>
                <p class="text-sm font-bold tracking-tight text-green-500 flex items-center gap-2">
                    <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
                    STABLE_AES256
                </p>
            </div>
        </div>

        <!-- Video Stage -->
        <div id="video-wrapper" class="video-container">
            <div id="preloader" class="preloader-overlay">
                <div class="relative w-12 h-12 mb-6">
                    <div class="absolute inset-0 border-2 border-white/5 rounded-full"></div>
                    <div class="absolute inset-0 border-2 border-red-500 border-t-transparent rounded-full animate-spin"></div>
                </div>
                <p id="loader-text" class="mono text-[9px] font-bold tracking-[0.4em] text-neutral-500 uppercase">Handshaking Server</p>
            </div>
            
            <div id="moving-watermark" class="watermark">initializing_nexus_layer</div>
            <div id="iframe-holder"></div>
        </div>

        <div class="mt-8 flex justify-between items-center text-neutral-600">
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-2">
                    <i data-lucide="eye" class="w-4 h-4"></i>
                    <span class="text-[10px] font-bold uppercase tracking-widest">Active Stream</span>
                </div>
                <div class="flex items-center gap-2">
                    <i data-lucide="shield-check" class="w-4 h-4"></i>
                    <span class="text-[10px] font-bold uppercase tracking-widest">Encrypted Session</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const lessonId = urlParams.get('id');

        let currentUser = null;
        let allowedSeconds = 0;
        let watchedSeconds = 0;
        let sessionTimer = null;
        let watermarkData = { x: 10, y: 10, dx: 0.4, dy: 0.4 };
        let isCompleted = false;

        async function checkAuth() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) return window.location.href = 'login.html';
            currentUser = session.user;

            const isApproved = await verifyCourseApproval();
            if (!isApproved) return window.location.href = '/dashboard';

            document.getElementById('moving-watermark').innerText = currentUser.email;
            document.body.classList.add('ready');
            
            lucide.createIcons();
            fetchLessonData();
            checkCompletionStatus();
            startWatermark();
        }

        async function verifyCourseApproval() {
            try {
                const { data: lesson } = await sb.from('lessons').select('course_id').eq('id', lessonId).single();
                if (!lesson) return false;

                const { data: approval } = await sb.from('course_status')
                    .select('status').eq('user_id', currentUser.id)
                    .eq('course_id', lesson.course_id).eq('status', 'approved').maybeSingle();

                return !!approval;
            } catch (e) { return false; }
        }

        async function fetchLessonData() {
            if (!lessonId) return window.location.href = '/dashboard';

            const { data: lesson, error } = await sb.from('lessons').select('*').eq('id', lessonId).single();
            if (error || !lesson) return showError("LESSON_NOT_FOUND");

            const hours = parseInt(lesson.watchtime_hours) || 0;
            const minutes = parseInt(lesson.watchtime_minutes) || 0;
            allowedSeconds = (hours * 3600) + (minutes * 60);

            document.getElementById('lesson-title').innerText = lesson.title;
            document.getElementById('info-id').innerText = `X-CORE-${lesson.order_index || '000'}`;
            document.getElementById('info-limit').innerText = `${hours}H ${minutes}M ALLOCATED`;

            await syncProgress();

            if (allowedSeconds > 0 && watchedSeconds >= allowedSeconds) {
                showError("AIRTIME_DEPLETED");
                return;
            }

            initStream(lesson.video_url);
        }

        async function checkCompletionStatus() {
            const { data } = await sb.from('lesson_completions').select('*')
                .eq('user_id', currentUser.id).eq('lesson_id', lessonId).maybeSingle();

            if (data) {
                setCompleteUI(true);
            } else {
                setTimeout(() => { document.getElementById('btn-complete').disabled = false; }, 5000);
            }
        }

        async function syncProgress() {
            const { data } = await sb.from('watch_sessions').select('total_seconds_watched')
                .eq('user_id', currentUser.id).eq('lesson_id', lessonId).maybeSingle();

            if (data) {
                watchedSeconds = data.total_seconds_watched;
            } else {
                await sb.from('watch_sessions').insert({
                    user_id: currentUser.id, lesson_id: lessonId, total_seconds_watched: 0
                });
            }
        }

        function initStream(url) {
            const holder = document.getElementById('iframe-holder');
            const iframe = document.createElement('iframe');
            iframe.src = url;
            iframe.allow = "autoplay; fullscreen; microphone; camera; display-capture";
            
            iframe.onload = () => {
                document.getElementById('loading-bar').style.width = '100%';
                document.getElementById('info-status').innerText = "● ONLINE";
                document.getElementById('info-status').className = "mono text-[9px] text-green-500 font-bold tracking-widest uppercase";
                document.getElementById('preloader').style.display = 'none';
                iframe.classList.add('visible');
                document.getElementById('timer-display').classList.remove('hidden');
                startClock();
            };
            holder.appendChild(iframe);
        }

        function startClock() {
            sessionTimer = setInterval(async () => {
                watchedSeconds += 1;
                updateUI();

                if (watchedSeconds % 15 === 0) {
                    await sb.from('watch_sessions').update({ total_seconds_watched: watchedSeconds, last_watched_at: new Date().toISOString() })
                        .eq('user_id', currentUser.id).eq('lesson_id', lessonId);
                }

                if (allowedSeconds > 0 && watchedSeconds >= allowedSeconds) {
                    clearInterval(sessionTimer);
                    showError("WATCH_LIMIT_EXCEEDED");
                }
            }, 1000);
        }

        function updateUI() {
            const remaining = Math.max(0, allowedSeconds - watchedSeconds);
            const h = Math.floor(remaining / 3600);
            const m = Math.floor((remaining % 3600) / 60);
            const s = remaining % 60;
            document.getElementById('time-left').innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function startWatermark() {
            const el = document.getElementById('moving-watermark');
            const wrapper = document.getElementById('video-wrapper');
            function animate() {
                const rect = wrapper.getBoundingClientRect();
                const elRect = el.getBoundingClientRect();
                watermarkData.x += watermarkData.dx;
                watermarkData.y += watermarkData.dy;
                if (watermarkData.x <= 0 || watermarkData.x + elRect.width >= rect.width) watermarkData.dx *= -1;
                if (watermarkData.y <= 0 || watermarkData.y + elRect.height >= rect.height) watermarkData.dy *= -1;
                el.style.left = watermarkData.x + 'px';
                el.style.top = watermarkData.y + 'px';
                requestAnimationFrame(animate);
            }
            animate();
        }

        function setCompleteUI(alreadyDone = false) {
            const btn = document.getElementById('btn-complete');
            btn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5"></i> COMPLETED`;
            btn.classList.replace('btn-primary', 'btn-secondary');
            btn.classList.add('text-green-500');
            btn.disabled = true;
            isCompleted = true;
            lucide.createIcons();
        }

        async function markAsComplete() {
            if (isCompleted) return;
            const btn = document.getElementById('btn-complete');
            btn.disabled = true;
            btn.innerText = "SYNCING...";

            const { error } = await sb.from('lesson_completions').insert({
                user_id: currentUser.id, lesson_id: lessonId
            });

            if (error) {
                btn.innerText = "ERROR - RETRY";
                btn.disabled = false;
                return;
            }
            setCompleteUI();
        }

        function showError(msg) {
            document.getElementById('preloader').style.display = 'flex';
            document.getElementById('preloader').innerHTML = `
                <div class="text-center p-12 glass-card">
                    <p class="mono text-red-500 font-black tracking-widest uppercase mb-4">ACCESS TERMINATED</p>
                    <p class="text-[10px] text-neutral-500 uppercase tracking-[4px] mb-8">${msg}</p>
                    <button onclick="window.location.href='/curriculum'" class="btn-primary px-8 py-3 rounded-xl text-xs font-bold uppercase tracking-wider mx-auto">
                        Return to Hub
                    </button>
                </div>
            `;
            document.getElementById('info-status').innerText = "● OFFLINE";
            document.getElementById('info-status').className = "mono text-[9px] text-red-500 font-bold tracking-widest uppercase";
        }

        document.getElementById('btn-complete').onclick = markAsComplete;
        window.onload = checkAuth;
    </script>
</body>
</html>
