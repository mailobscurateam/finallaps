<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal | Nexus Prime | Tharaka B Jayathilaka</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --math-primary: #ec4899; 
            --math-dark: #09090b;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--math-dark);
            color: #f4f4f5;
            overflow-x: hidden; 
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        #math-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -10;
        }

        .glass-panel {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-field {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: var(--math-primary);
            background: rgba(236, 72, 153, 0.05);
            outline: none;
            box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.1);
        }

        .gradient-btn {
            background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
            transition: all 0.3s ease;
        }

        .gradient-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(236, 72, 153, 0.5);
        }

        .gradient-text {
            background: linear-gradient(to bottom right, #fff 30%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .eye-icon {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .showing-password .eye-icon {
            transform: scale(1.2) rotate(10deg);
            color: var(--math-primary);
        }
        
        .page-transition {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        
        .hidden-page {
            display: none;
            opacity: 0;
            transform: translateY(10px);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div id="math-canvas"></div>

    <div class="w-full max-w-md relative z-10 py-12">
        <!-- Logo Section -->
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-pink-600 rounded-2xl mb-6 shadow-lg shadow-pink-500/20 rotate-3">
                <span class="text-3xl font-black text-white">Σ</span>
            </div>
            <h1 class="text-4xl font-black tracking-tighter mb-2">NEXUS<span class="text-pink-500">PRIME</span></h1>
            <p class="mono text-[10px] uppercase tracking-[0.3em] text-gray-500">Mathematics Excellence Portal</p>
        </div>

        <!-- LOGIN PAGE -->
        <div class="glass-panel rounded-[2.5rem] p-10 page-transition" id="login-page">
            <h2 class="text-2xl font-bold mb-8 text-center">Student <span class="gradient-text">Sign In</span></h2>
            
            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block mono text-[10px] uppercase tracking-widest text-gray-400 mb-2 ml-1">Email Address</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
                        <input type="email" id="login-email" required placeholder="name@student.com" 
                            class="input-field w-full py-4 pl-12 pr-4 rounded-2xl text-sm">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-end mb-2 ml-1">
                        <label class="block mono text-[10px] uppercase tracking-widest text-gray-400">Password</label>
                        <i data-lucide="shield-check" class="w-4 h-4 text-pink-500/50" id="login-guard"></i>
                    </div>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
                        <input type="password" id="login-password" required placeholder="••••••••" 
                            class="input-field w-full py-4 pl-12 pr-12 rounded-2xl text-sm">
                        
                        <button type="button" onclick="togglePasswordVisibility('login-password', 'login-eye', 'login-guard', 'login-page')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition-colors">
                            <i data-lucide="eye" class="w-4 h-4 eye-icon" id="login-eye"></i>
                        </button>
                    </div>
                    <div class="flex justify-end mt-2 mr-1">
                        <a href="#" class="mono text-[9px] uppercase tracking-wider text-gray-500 hover:text-pink-500 transition-colors">Forgot Password?</a>
                    </div>
                </div>

                <div id="login-error" class="hidden flex items-start space-x-2 p-4 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-xs">
                    <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
                    <span id="login-error-text">Invalid credentials provided.</span>
                </div>

                <button type="submit" id="login-submit" class="gradient-btn w-full py-4 rounded-2xl font-bold text-xs uppercase tracking-[0.2em] flex items-center justify-center space-x-3">
                    <span>Access Portal</span>
                    <div class="spinner" id="login-spinner"></div>
                </button>
            </form>

            <div class="mt-8 pt-8 border-t border-white/5 text-center">
                <p class="text-gray-500 text-xs">New to the portal?</p>
                <button onclick="switchPage('register')" class="text-pink-500 font-bold text-xs mt-2 inline-block hover:underline">Create Account</button>
            </div>
        </div>

        <!-- REGISTER PAGE -->
        <div class="glass-panel rounded-[2.5rem] p-10 page-transition hidden-page" id="register-page">
            <h2 class="text-2xl font-bold mb-8 text-center">Student <span class="gradient-text">Registration</span></h2>
            
            <form id="register-form" class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block mono text-[10px] uppercase tracking-widest text-gray-400 mb-2 ml-1">First Name</label>
                        <input type="text" id="reg-fname" required placeholder="John" 
                            class="input-field w-full py-4 px-4 rounded-2xl text-sm">
                    </div>
                    <div>
                        <label class="block mono text-[10px] uppercase tracking-widest text-gray-400 mb-2 ml-1">Last Name</label>
                        <input type="text" id="reg-lname" required placeholder="Doe" 
                            class="input-field w-full py-4 px-4 rounded-2xl text-sm">
                    </div>
                </div>

                <div>
                    <label class="block mono text-[10px] uppercase tracking-widest text-gray-400 mb-2 ml-1">Email Address</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
                        <input type="email" id="reg-email" required placeholder="name@student.com" 
                            class="input-field w-full py-4 pl-12 pr-4 rounded-2xl text-sm">
                    </div>
                </div>

                <div>
                    <label class="block mono text-[10px] uppercase tracking-widest text-gray-400 mb-2 ml-1">Set Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
                        <input type="password" id="reg-password" required placeholder="••••••••" 
                            class="input-field w-full py-4 pl-12 pr-12 rounded-2xl text-sm">
                        
                        <button type="button" onclick="togglePasswordVisibility('reg-password', 'reg-eye', 'reg-guard', 'register-page')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition-colors">
                            <i data-lucide="eye" class="w-4 h-4 eye-icon" id="reg-eye"></i>
                        </button>
                    </div>
                    <div class="flex items-center space-x-2 mt-2 ml-1">
                         <i data-lucide="shield-check" class="w-3 h-3 text-pink-500/50" id="reg-guard"></i>
                         <p class="text-[9px] text-gray-500 uppercase tracking-tighter">Secure connection enabled</p>
                    </div>
                </div>

                <div id="reg-error" class="hidden flex items-start space-x-2 p-4 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-xs">
                    <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
                    <span id="reg-error-text">Registration failed.</span>
                </div>

                <button type="submit" id="reg-submit" class="gradient-btn w-full py-4 rounded-2xl font-bold text-xs uppercase tracking-[0.2em] flex items-center justify-center space-x-3 mt-4">
                    <span>Register Account</span>
                    <div class="spinner" id="reg-spinner"></div>
                </button>
            </form>

            <div class="mt-8 pt-8 border-t border-white/5 text-center">
                <p class="text-gray-500 text-xs">Already registered?</p>
                <button onclick="switchPage('login')" class="text-pink-500 font-bold text-xs mt-2 inline-block hover:underline">Return to Login</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';

            const supabaseInstance = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // UI Helpers
            window.switchPage = (page) => {
                const loginPage = document.getElementById('login-page');
                const regPage = document.getElementById('register-page');
                
                if (page === 'register') {
                    loginPage.style.opacity = '0';
                    setTimeout(() => {
                        loginPage.classList.add('hidden-page');
                        regPage.classList.remove('hidden-page');
                        setTimeout(() => regPage.style.opacity = '1', 50);
                    }, 400);
                } else {
                    regPage.style.opacity = '0';
                    setTimeout(() => {
                        regPage.classList.add('hidden-page');
                        loginPage.classList.remove('hidden-page');
                        setTimeout(() => loginPage.style.opacity = '1', 50);
                    }, 400);
                }
            };

            window.togglePasswordVisibility = (inputId, eyeId, guardId, containerId) => {
                const input = document.getElementById(inputId);
                const eye = document.getElementById(eyeId);
                const guard = document.getElementById(guardId);
                const container = document.getElementById(containerId);
                
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                
                if (isPassword) {
                    container.classList.add('showing-password');
                    eye.setAttribute('data-lucide', 'eye-off');
                    guard.setAttribute('data-lucide', 'shield-alert');
                } else {
                    container.classList.remove('showing-password');
                    eye.setAttribute('data-lucide', 'eye');
                    guard.setAttribute('data-lucide', 'shield-check');
                }
                lucide.createIcons();
            };

            // Login Handler
            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const spinner = document.getElementById('login-spinner');
                const submitBtn = document.getElementById('login-submit');
                const errorMsg = document.getElementById('login-error');
                
                errorMsg.classList.add('hidden');
                spinner.style.display = 'block';
                submitBtn.disabled = true;

                try {
                    const { error } = await supabaseInstance.auth.signInWithPassword({
                        email: document.getElementById('login-email').value,
                        password: document.getElementById('login-password').value
                    });
                    if (error) throw error;
                    alert('Login successful! Redirecting...');
                } catch (err) {
                    document.getElementById('login-error-text').textContent = err.message;
                    errorMsg.classList.remove('hidden');
                } finally {
                    spinner.style.display = 'none';
                    submitBtn.disabled = false;
                }
            });

            // Registration Handler
            document.getElementById('register-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const spinner = document.getElementById('reg-spinner');
                const submitBtn = document.getElementById('reg-submit');
                const errorMsg = document.getElementById('reg-error');
                
                errorMsg.classList.add('hidden');
                spinner.style.display = 'block';
                submitBtn.disabled = true;

                try {
                    const { error } = await supabaseInstance.auth.signUp({
                        email: document.getElementById('reg-email').value,
                        password: document.getElementById('reg-password').value,
                        options: {
                            data: {
                                first_name: document.getElementById('reg-fname').value,
                                last_name: document.getElementById('reg-lname').value,
                            }
                        }
                    });
                    if (error) throw error;
                    alert('Check your email for verification!');
                    switchPage('login');
                } catch (err) {
                    document.getElementById('reg-error-text').textContent = err.message;
                    errorMsg.classList.remove('hidden');
                } finally {
                    spinner.style.display = 'none';
                    submitBtn.disabled = false;
                }
            });

            // Three.js Background
            const initScene = () => {
                const container = document.getElementById('math-canvas');
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.z = 100;
                
                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                container.appendChild(renderer.domElement);

                const particles = new THREE.BufferGeometry();
                const count = 2000;
                const posArr = new Float32Array(count * 3);
                
                for(let i=0; i<count * 3; i++) {
                    posArr[i] = (Math.random() - 0.5) * 400;
                }
                
                particles.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
                const pMaterial = new THREE.PointsMaterial({ 
                    size: 0.8, 
                    color: 0xec4899, 
                    transparent: true, 
                    opacity: 0.3 
                });
                
                const pSystem = new THREE.Points(particles, pMaterial);
                scene.add(pSystem);

                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });

                const animate = () => {
                    requestAnimationFrame(animate);
                    pSystem.rotation.y += 0.0004;
                    pSystem.rotation.x += 0.0001;
                    renderer.render(scene, camera);
                };
                animate();
            };

            document.addEventListener('DOMContentLoaded', () => {
                lucide.createIcons();
                initScene();
            });
        })();
    </script>
</body>
</html>
