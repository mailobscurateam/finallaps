<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Status | Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #0f0f12;
            --bg-card: #1a1a1f;
            --border: #2d2d35;
            --primary: #ef4444;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-page); 
            color: #f8fafc;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }

        .status-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .status-card:hover {
            border-color: #3f3f46;
            transform: translateY(-2px);
        }

        .status-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .pending-pill { background: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.2); }
        .approved-pill { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .rejected-pill { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen">
    <nav class="sticky top-0 z-50 bg-[#0f0f12]/80 backdrop-blur-md border-b border-[#2d2d35]">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="curriculum_dashboard.html" class="flex items-center gap-2 text-slate-400 hover:text-white transition-colors text-sm font-medium">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    Back to Curriculum
                </a>
            </div>
            <div class="flex items-center gap-2 text-white font-bold">
                <div class="w-6 h-6 bg-red-600 rounded flex items-center justify-center">
                    <i data-lucide="activity" class="w-4 h-4 text-white"></i>
                </div>
                Nexus Status
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-12">
        <header class="mb-10">
            <h1 class="text-3xl font-extrabold text-white mb-2">Monthly Approvals</h1>
            <p class="text-slate-400">Track the status of your module activation requests.</p>
        </header>

        <!-- Summary Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10">
            <div class="status-card p-5 rounded-2xl">
                <div class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-1">Total Requests</div>
                <div id="stat-total" class="text-2xl font-bold text-white">0</div>
            </div>
            <div class="status-card p-5 rounded-2xl">
                <div class="text-amber-500 text-xs font-bold uppercase tracking-wider mb-1">Pending</div>
                <div id="stat-pending" class="text-2xl font-bold text-white">0</div>
            </div>
            <div class="status-card p-5 rounded-2xl">
                <div class="text-emerald-500 text-xs font-bold uppercase tracking-wider mb-1">Active Modules</div>
                <div id="stat-approved" class="text-2xl font-bold text-white">0</div>
            </div>
        </div>

        <div id="approvals-list" class="space-y-4">
            <!-- Loading State -->
            <div class="animate-pulse space-y-4">
                <div class="h-20 bg-slate-800/50 rounded-2xl"></div>
                <div class="h-20 bg-slate-800/50 rounded-2xl"></div>
                <div class="h-20 bg-slate-800/50 rounded-2xl"></div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        async function loadStatus() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) return window.location.href = 'login.html';

            try {
                // Fetch approvals joined with course names
                const { data, error } = await sb
                    .from('monthly_approvals')
                    .select(`
                        id,
                        month_number,
                        status,
                        created_at,
                        courses ( name )
                    `)
                    .eq('user_id', session.user.id)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                renderList(data);
                updateStats(data);
            } catch (err) {
                console.error(err);
                document.getElementById('approvals-list').innerHTML = `
                    <div class="p-6 bg-red-900/10 border border-red-900/20 rounded-2xl text-center">
                        <p class="text-red-400">Failed to load request status. Please try again later.</p>
                    </div>
                `;
            }
        }

        function updateStats(data) {
            document.getElementById('stat-total').textContent = data.length;
            document.getElementById('stat-pending').textContent = data.filter(r => r.status === 'pending').length;
            document.getElementById('stat-approved').textContent = data.filter(r => r.status === 'approved').length;
        }

        function renderList(requests) {
            const container = document.getElementById('approvals-list');
            
            if (!requests || requests.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20 bg-slate-900/20 rounded-3xl border-2 border-dashed border-slate-800">
                        <div class="w-12 h-12 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="clipboard-list" class="w-6 h-6 text-slate-500"></i>
                        </div>
                        <h3 class="text-white font-bold mb-1">No requests found</h3>
                        <p class="text-slate-500 text-sm mb-6">You haven't requested any module activations yet.</p>
                        <a href="curriculum_dashboard.html" class="inline-flex items-center gap-2 px-6 py-2 bg-white text-black text-sm font-bold rounded-lg hover:bg-slate-200 transition-colors">
                            View Curriculum
                        </a>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = requests.map((req, idx) => {
                const status = req.status || 'pending';
                const date = new Date(req.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                const monthLabel = MONTH_NAMES[req.month_number - 1] || `Month ${req.month_number}`;
                const courseName = req.courses?.name || 'Unknown Course';

                return `
                    <div class="status-card p-5 rounded-2xl flex items-center justify-between gap-4 animate-slide" style="animation-delay: ${idx * 50}ms">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl bg-slate-800/50 flex items-center justify-center text-slate-400">
                                <i data-lucide="calendar" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-white">${monthLabel}</h4>
                                <p class="text-xs text-slate-500 font-medium">${courseName} • Requested ${date}</p>
                            </div>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            <span class="status-badge ${status}-pill">
                                ${status}
                            </span>
                            ${status === 'pending' ? 
                                '<span class="text-[10px] text-slate-600 font-medium">Reviewing...</span>' : 
                                '<span class="text-[10px] text-slate-600 font-medium">Completed</span>'
                            }
                        </div>
                    </div>
                `;
            }).join('');
            
            lucide.createIcons();
        }

        window.onload = loadStatus;
    </script>
</body>
</html>
