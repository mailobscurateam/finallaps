<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Terminal | Nexus Prime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #09090b; color: #f4f4f5; min-height: 100vh; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: rgba(24, 24, 27, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .table-row { transition: all 0.2s ease; border-bottom: 1px solid rgba(255, 255, 255, 0.02); }
        .table-row:hover { background: rgba(255, 255, 255, 0.02); }
        .glow { position: fixed; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(236, 72, 153, 0.04) 0%, transparent 70%); z-index: -1; pointer-events: none; }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="glow top-[-20%] left-[-10%]"></div>

    <main class="max-w-6xl mx-auto w-full">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-end gap-6 mb-12">
            <div>
                <div class="flex items-center gap-2 mb-4">
                    <div class="w-2 h-2 rounded-full bg-pink-500 animate-pulse"></div>
                    <span class="mono text-[10px] text-pink-500 uppercase font-black tracking-[0.3em]">Central Registry</span>
                </div>
                <h1 class="text-4xl font-black tracking-tighter text-white">Enrollment Status</h1>
            </div>
            <div class="flex items-center gap-4">
                <p id="user-email" class="mono text-[10px] text-gray-500 uppercase border-r border-white/10 pr-4">Identifying...</p>
                <a href="courses.html" class="text-xs font-bold hover:text-pink-500 transition flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> New Application
                </a>
            </div>
        </header>

        <div class="glass-panel rounded-3xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-white/5">
                            <th class="px-8 py-5 mono text-[10px] text-gray-400 uppercase tracking-widest font-bold">Course Name</th>
                            <th class="px-8 py-5 mono text-[10px] text-gray-400 uppercase tracking-widest font-bold">Requested Time</th>
                            <th class="px-8 py-5 mono text-[10px] text-gray-400 uppercase tracking-widest font-bold">Status</th>
                            <th class="px-8 py-5 mono text-[10px] text-gray-400 uppercase tracking-widest font-bold text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="course-table-body">
                        <tr>
                            <td colspan="4" class="px-8 py-20 text-center">
                                <div id="loading-spinner" class="flex flex-col items-center gap-4">
                                    <div class="w-8 h-8 border-2 border-pink-500 border-t-transparent rounded-full animate-spin"></div>
                                    <p class="mono text-[10px] text-gray-500 uppercase tracking-widest">Accessing Mainframe...</p>
                                </div>
                                <div id="empty-msg" class="hidden">
                                    <p class="text-gray-500 italic">No applications found in your history.</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) return window.location.href = 'login.html';
            
            document.getElementById('user-email').textContent = session.user.email;
            fetchEnrollments(session.user.id);

            // Subscribe to real-time updates
            sb.channel('db-changes')
                .on('postgres_changes', { 
                    event: '*', 
                    schema: 'public', 
                    table: 'course_status',
                    filter: `user_id=eq.${session.user.id}`
                }, () => fetchEnrollments(session.user.id))
                .subscribe();
        }

        async function fetchEnrollments(userId) {
            const { data, error } = await sb
                .from('course_status')
                .select('*')
                .order('created_at', { ascending: false });

            const tbody = document.getElementById('course-table-body');
            
            if (error || !data || data.length === 0) {
                document.getElementById('loading-spinner').classList.add('hidden');
                document.getElementById('empty-msg').classList.remove('hidden');
                return;
            }

            tbody.innerHTML = '';
            data.forEach(item => {
                tbody.appendChild(renderRow(item));
            });
            lucide.createIcons();
        }

        function renderRow(item) {
            const tr = document.createElement('tr');
            tr.className = 'table-row';

            // Format Date
            const date = new Date(item.created_at).toLocaleDateString('en-US', {
                month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });

            // Status Config
            const states = {
                approved: { 
                    color: 'text-green-400', 
                    bg: 'bg-green-400/10', 
                    icon: 'shield-check',
                    btn: 'opacity-100 pointer-events-auto bg-pink-500 hover:bg-pink-600'
                },
                rejected: { 
                    color: 'text-red-400', 
                    bg: 'bg-red-400/10', 
                    icon: 'shield-alert',
                    btn: 'opacity-30 pointer-events-none bg-zinc-800'
                },
                pending: { 
                    color: 'text-yellow-400', 
                    bg: 'bg-yellow-400/10', 
                    icon: 'clock',
                    btn: 'opacity-30 pointer-events-none bg-zinc-800'
                }
            };

            const s = states[item.status] || states.pending;

            tr.innerHTML = `
                <td class="px-8 py-6">
                    <div class="font-bold text-white">${item.course_name || 'System Module'}</div>
                    <div class="mono text-[9px] text-gray-600 tracking-tighter uppercase mt-1">Ref: ${item.course_id}</div>
                </td>
                <td class="px-8 py-6 mono text-xs text-gray-400">
                    ${date}
                </td>
                <td class="px-8 py-6">
                    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full ${s.bg} ${s.color} border border-current/10">
                        <i data-lucide="${s.icon}" class="w-3 h-3"></i>
                        <span class="mono text-[9px] font-bold uppercase tracking-widest">${item.status}</span>
                    </div>
                </td>
                <td class="px-8 py-6 text-right">
                    <button onclick="window.location.href='/curriculum?id=${item.course_id}'" 
                            class="px-5 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest transition-all ${s.btn} text-white">
                        Access
                    </button>
                </td>
            `;
            return tr;
        }

        window.onload = init;
    </script>
</body>
</html>
