<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Approvals | Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #0b0b0e;
            --bg-card: #16161a;
            --border: #26262c;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-page); 
            color: #f1f5f9;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }

        .status-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
        }

        .shimmer {
            background: linear-gradient(90deg, #16161a 25%, #1c1c21 50%, #16161a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="min-h-screen pb-12">
    <!-- Simple Header -->
    <nav class="border-b border-[#26262c] bg-black/20 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 font-bold text-lg tracking-tight">
                <div class="w-7 h-7 bg-red-600 rounded flex items-center justify-center">
                    <i data-lucide="layers" class="w-4 h-4 text-white"></i>
                </div>
                Nexus Student
            </div>
            <button onclick="handleLogout()" class="text-slate-400 hover:text-white text-sm font-medium">
                Logout
            </button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-10">
        <header class="mb-10">
            <h1 class="text-3xl font-extrabold text-white mb-2">My Approval Status</h1>
            <p class="text-slate-400">Track your course access and monthly curriculum requests.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Column: Course Enrollment Status -->
            <div class="lg:col-span-1">
                <h2 class="text-sm font-bold text-slate-500 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <i data-lucide="book-open" class="w-4 h-4"></i>
                    Main Courses
                </h2>
                <div id="course-container" class="space-y-4">
                    <!-- Skeleton Loader -->
                    <div class="status-card p-4 rounded-2xl shimmer h-24"></div>
                </div>
            </div>

            <!-- Right Column: Monthly Modules Status -->
            <div class="lg:col-span-2">
                <h2 class="text-sm font-bold text-slate-500 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <i data-lucide="calendar" class="w-4 h-4"></i>
                    Monthly Modules
                </h2>
                <div id="monthly-container" class="space-y-4">
                    <!-- Skeleton Loader -->
                    <div class="status-card p-4 rounded-2xl shimmer h-20"></div>
                    <div class="status-card p-4 rounded-2xl shimmer h-20"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        async function checkStatus() {
            const { data: { user } } = await sb.auth.getUser();
            
            if (!user) {
                window.location.href = 'login.html'; // Adjust to your login page name
                return;
            }

            try {
                // 1. Fetch Course Approvals
                const { data: courses, error: courseErr } = await sb
                    .from('course_approvals')
                    .select('*, courses(name)')
                    .eq('user_id', user.id);

                // 2. Fetch Monthly Approvals
                const { data: monthly, error: monthlyErr } = await sb
                    .from('monthly_approvals')
                    .select('*, courses(name)')
                    .eq('user_id', user.id)
                    .order('month_number', { ascending: true });

                renderCourses(courses || []);
                renderMonthly(monthly || []);
            } catch (err) {
                console.error(err);
            }
        }

        function getStatusUI(status) {
            switch(status) {
                case 'approved':
                    return { icon: 'check-circle', color: 'text-emerald-500', bg: 'bg-emerald-500/10', label: 'Approved' };
                case 'rejected':
                    return { icon: 'alert-circle', color: 'text-red-500', bg: 'bg-red-500/10', label: 'Denied' };
                default:
                    return { icon: 'clock', color: 'text-amber-500', bg: 'bg-amber-500/10', label: 'Pending Review' };
            }
        }

        function renderCourses(data) {
            const container = document.getElementById('course-container');
            if (data.length === 0) {
                container.innerHTML = `<div class="status-card p-8 rounded-2xl text-center text-slate-500 text-sm italic">No course applications found.</div>`;
                return;
            }

            container.innerHTML = data.map(item => {
                const ui = getStatusUI(item.status);
                return `
                    <div class="status-card p-5 rounded-2xl">
                        <p class="text-xs text-slate-500 font-bold mb-1">COURSE ACCESS</p>
                        <h3 class="text-white font-bold mb-4">${item.courses?.name || 'Unknown Course'}</h3>
                        <div class="flex items-center gap-2 ${ui.bg} ${ui.color} w-fit px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider">
                            <i data-lucide="${ui.icon}" class="w-4 h-4"></i>
                            ${ui.label}
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function renderMonthly(data) {
            const container = document.getElementById('monthly-container');
            if (data.length === 0) {
                container.innerHTML = `<div class="status-card p-8 rounded-2xl text-center text-slate-500 text-sm italic">No monthly activation requests found.</div>`;
                return;
            }

            container.innerHTML = data.map(item => {
                const ui = getStatusUI(item.status);
                return `
                    <div class="status-card p-5 rounded-2xl flex items-center justify-between group">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-slate-900 rounded-xl flex flex-col items-center justify-center border border-slate-800">
                                <span class="text-[10px] text-slate-500 font-bold uppercase">Month</span>
                                <span class="text-lg font-bold text-white leading-none">${item.month_number}</span>
                            </div>
                            <div>
                                <h3 class="text-white font-bold">${MONTHS[item.month_number - 1]} Content</h3>
                                <p class="text-xs text-slate-500">${item.courses?.name}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 ${ui.color} font-bold text-xs uppercase tracking-widest bg-slate-900/50 px-4 py-2 rounded-xl border border-slate-800">
                            <i data-lucide="${ui.icon}" class="w-4 h-4"></i>
                            ${ui.label}
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        async function handleLogout() {
            await sb.auth.signOut();
            window.location.reload();
        }

        window.onload = checkStatus;
    </script>
</body>
</html>
