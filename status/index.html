<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Terminal | Nexus Prime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #09090b; color: #f4f4f5; min-height: 100vh; overflow-x: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass-card { background: rgba(24, 24, 27, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.3s ease; }
        .glass-card:hover { border-color: rgba(236, 72, 153, 0.2); background: rgba(24, 24, 27, 0.6); }
        .glow { position: fixed; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(236, 72, 153, 0.05) 0%, transparent 70%); z-index: -1; pointer-events: none; }
        .status-pill { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; padding: 4px 12px; border-radius: 99px; }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="glow top-[-20%] left-[-10%]"></div>
    <div class="glow bottom-[-20%] right-[-10%]" style="background: radial-gradient(circle, rgba(168, 85, 247, 0.05) 0%, transparent 70%);"></div>

    <nav class="max-w-6xl mx-auto w-full flex justify-between items-center mb-12">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-pink-500/20 flex items-center justify-center text-pink-500 shadow-lg shadow-pink-500/10">
                <i data-lucide="layout-grid" class="w-5 h-5"></i>
            </div>
            <div>
                <span class="mono text-[10px] text-pink-500 uppercase font-black tracking-[0.3em] block">Nexus Prime</span>
                <span class="text-xs text-gray-400 font-bold">Course Command Center</span>
            </div>
        </div>
        <div class="flex items-center gap-6">
            <div class="text-right hidden sm:block">
                <p id="user-email" class="mono text-[10px] text-gray-500 uppercase">Syncing...</p>
            </div>
            <a href="courses.html" class="bg-white/5 hover:bg-white/10 px-4 py-2 rounded-lg text-xs font-bold transition flex items-center gap-2 border border-white/5">
                <i data-lucide="plus" class="w-4 h-4"></i> Browse More
            </a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto w-full">
        <header class="mb-10">
            <h1 class="text-4xl font-black tracking-tighter text-white mb-2">My Applications</h1>
            <p class="text-gray-500 max-w-lg">Track your security clearance for enrolled modules and access approved curriculum content.</p>
        </header>

        <div id="loading-state" class="py-20 flex flex-col items-center justify-center">
            <div class="w-12 h-12 border-2 border-pink-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="mono text-[10px] text-pink-500 tracking-[0.3em] uppercase">Interrogating Database...</p>
        </div>

        <div id="empty-state" class="hidden glass-card rounded-3xl p-12 text-center">
            <div class="w-16 h-16 bg-white/5 rounded-full flex items-center justify-center mx-auto mb-6 text-gray-600">
                <i data-lucide="folder-open" class="w-8 h-8"></i>
            </div>
            <h3 class="text-xl font-bold mb-2">No Active Enrollments</h3>
            <p class="text-gray-500 mb-8">You haven't applied for any courses yet.</p>
            <a href="courses.html" class="inline-flex items-center gap-2 bg-pink-500 hover:bg-pink-600 text-white px-6 py-3 rounded-xl font-bold transition-all transform hover:scale-105">
                Explore Curriculum <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </a>
        </div>

        <div id="course-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) return window.location.href = 'login.html';
            
            document.getElementById('user-email').textContent = session.user.email;
            
            fetchCourses(session.user.id);

            // Real-time listener for any status changes
            sb.channel('realtime-status')
                .on('postgres_changes', { 
                    event: '*', 
                    schema: 'public', 
                    table: 'course_status',
                    filter: `user_id=eq.${session.user.id}`
                }, () => {
                    fetchCourses(session.user.id); // Refresh list on change
                })
                .subscribe();
        }

        async function fetchCourses(userId) {
            const { data, error } = await sb
                .from('course_status')
                .select('*')
                .eq('user_id', userId)
                .order('created_at', { ascending: false });

            document.getElementById('loading-state').classList.add('hidden');
            
            if (error || !data || data.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }

            renderGrid(data);
        }

        function renderGrid(courses) {
            const grid = document.getElementById('course-grid');
            grid.innerHTML = '';
            
            courses.forEach(course => {
                const card = createCourseCard(course);
                grid.appendChild(card);
            });
            
            lucide.createIcons();
        }

        function createCourseCard(course) {
            const div = document.createElement('div');
            div.className = 'glass-card rounded-3xl p-6 flex flex-col h-full';
            
            const config = {
                approved: {
                    pill: 'bg-green-500/10 text-green-500 border border-green-500/20',
                    icon: 'check-circle',
                    label: 'Clearance Granted',
                    btn: 'bg-pink-500 text-white hover:bg-pink-600',
                    action: `window.location.href='/curriculum?id=${course.course_id}'`
                },
                rejected: {
                    pill: 'bg-red-500/10 text-red-500 border border-red-500/20',
                    icon: 'x-circle',
                    label: 'Access Denied',
                    btn: 'bg-white/5 text-gray-500 cursor-not-allowed',
                    action: ''
                },
                pending: {
                    pill: 'bg-yellow-500/10 text-yellow-500 border border-yellow-500/20',
                    icon: 'clock',
                    label: 'Security Review',
                    btn: 'bg-white/5 text-gray-400 cursor-wait',
                    action: ''
                }
            };

            const style = config[course.status] || config.pending;

            div.innerHTML = `
                <div class="flex justify-between items-start mb-6">
                    <div class="mono text-[10px] text-gray-500 tracking-tighter">ID: ${course.course_id}</div>
                    <span class="status-pill ${style.pill}">${course.status}</span>
                </div>
                
                <h3 class="text-xl font-bold text-white mb-2 group-hover:text-pink-400 transition">
                    ${course.course_name || 'Technical Module'}
                </h3>
                
                <div class="flex items-center gap-3 mb-8 text-xs text-gray-500">
                    <i data-lucide="${style.icon}" class="w-4 h-4"></i>
                    ${style.label}
                </div>

                <div class="mt-auto">
                    <button onclick="${style.action}" class="w-full py-3 rounded-xl font-bold text-xs uppercase tracking-widest transition-all ${style.btn}">
                        ${course.status === 'approved' ? 'Enter Curriculum' : 'Locked'}
                    </button>
                </div>
            `;
            return div;
        }

        window.onload = init;
    </script>
</body>
</html>
