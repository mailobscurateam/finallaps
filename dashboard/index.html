<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Nexus Prime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent: #ff3333;
            --bg: #0a0a0b;
            --card-bg: #111113;
            --border: rgba(255, 255, 255, 0.06);
        }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            color: #ececec; 
            letter-spacing: -0.01em;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Smooth Mesh Background */
        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(at 0% 0%, rgba(255, 51, 51, 0.03) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 51, 51, 0.02) 0, transparent 50%);
            z-index: -1;
        }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(255, 51, 51, 0.3);
            background: #141416;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        .stat-card {
            background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 100%);
            border: 1px solid var(--border);
        }

        .nav-blur {
            backdrop-filter: blur(12px) saturate(180%);
            background: rgba(10, 10, 11, 0.7);
            border-bottom: 1px solid var(--border);
        }

        .btn-primary {
            background: #fff;
            color: #000;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background: var(--accent);
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px -6px rgba(255, 51, 51, 0.4);
        }

        .badge-red {
            background: rgba(255, 51, 51, 0.1);
            color: var(--accent);
            border: 1px solid rgba(255, 51, 51, 0.2);
        }

        /* Module Grid Custom Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-reveal {
            animation: fadeIn 0.5s ease forwards;
        }
    </style>
</head>
<body>
    <div class="mesh-bg"></div>

    <!-- Minimal Nav -->
    <nav class="fixed top-0 w-full z-50 px-6 py-4 nav-blur">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-white rounded-lg flex items-center justify-center">
                    <i data-lucide="zap" class="w-4 h-4 text-black fill-black"></i>
                </div>
                <span class="font-bold tracking-tight text-sm">NEXUS<span class="text-neutral-500">PRIME</span></span>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="h-8 w-[1px] bg-white/10 mx-2"></div>
                <button onclick="handleLogout()" class="text-neutral-400 hover:text-white transition-colors">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="pt-28 pb-20 px-6 max-w-7xl mx-auto w-full">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- SIDEBAR: Profile & Stats -->
            <div class="lg:col-span-4 space-y-6">
                <!-- User Profile Card -->
                <div class="glass-card p-8">
                    <div class="flex items-center gap-4 mb-8">
                        <div class="w-14 h-14 rounded-2xl bg-neutral-800 border border-white/5 flex items-center justify-center overflow-hidden">
                            <i data-lucide="user" class="w-6 h-6 text-neutral-400"></i>
                        </div>
                        <div>
                            <h2 id="profile-name" class="text-xl font-bold tracking-tight leading-tight capitalize">...</h2>
                            <p id="profile-email" class="text-xs text-neutral-500 font-medium lowercase">Loading session...</p>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <div class="flex justify-between items-center p-3 rounded-xl bg-white/5 border border-white/5">
                            <span class="text-[11px] font-semibold uppercase tracking-wider text-neutral-400">Security</span>
                            <span class="badge-red px-2 py-0.5 rounded-md text-[10px] font-bold">L-4 AUTH</span>
                        </div>
                        <div class="flex justify-between items-center p-3 rounded-xl bg-white/5 border border-white/5">
                            <span class="text-[11px] font-semibold uppercase tracking-wider text-neutral-400">Uptime</span>
                            <span class="text-[11px] font-bold text-green-500">99.9%</span>
                        </div>
                    </div>
                </div>

                <!-- Simple Stats Grid -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="stat-card p-6 rounded-3xl">
                        <p class="text-[10px] font-bold text-neutral-500 uppercase tracking-widest mb-1">Approved</p>
                        <p id="stat-approved" class="text-3xl font-bold tracking-tighter">0</p>
                    </div>
                    <div class="stat-card p-6 rounded-3xl">
                        <p class="text-[10px] font-bold text-neutral-500 uppercase tracking-widest mb-1">Pending</p>
                        <p id="stat-pending" class="text-3xl font-bold tracking-tighter text-neutral-600">0</p>
                    </div>
                </div>

                <!-- Action Button -->
                <a href="/status" class="flex items-center justify-between p-5 glass-card group">
                    <span class="text-xs font-bold text-neutral-300">Enrollment History</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-neutral-600 group-hover:text-white transition-all group-hover:translate-x-1"></i>
                </a>
            </div>

            <!-- MAIN CONTENT: Modules -->
            <div class="lg:col-span-8 space-y-8">
                <header class="flex justify-between items-end">
                    <div>
                        <h1 class="text-4xl font-extrabold tracking-tight">Active Sectors</h1>
                        <p class="text-neutral-500 text-sm mt-1">Your authorized training environments.</p>
                    </div>
                </header>

                <div id="modules-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Loading State -->
                    <div id="loading-state" class="col-span-full py-32 flex flex-col items-center justify-center">
                        <div class="w-6 h-6 border-2 border-white/10 border-t-white rounded-full animate-spin mb-4"></div>
                        <p class="text-[10px] font-bold text-neutral-500 uppercase tracking-widest">Accessing Registry</p>
                    </div>
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="hidden glass-card p-20 text-center border-dashed">
                    <div class="w-16 h-16 rounded-full bg-neutral-900 border border-white/5 flex items-center justify-center mx-auto mb-6">
                        <i data-lucide="shield-off" class="w-6 h-6 text-neutral-700"></i>
                    </div>
                    <h3 class="text-lg font-bold mb-2">No Active Access</h3>
                    <p class="text-neutral-500 text-sm max-w-xs mx-auto mb-8">
                        Authorized modules will appear here once your enrollment is finalized.
                    </p>
                    <a href="courses.html" class="btn-primary inline-flex items-center gap-2 px-8 py-3 rounded-xl text-xs font-bold uppercase tracking-wider">
                        Request Clearance
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) return window.location.href = 'login.html';
            
            const user = session.user;
            
            // Priority: Fetch from public.profiles -> metadata -> email fallback
            try {
                const { data: profile } = await sb
                    .from('profiles')
                    .select('full_name')
                    .eq('id', user.id)
                    .single();

                const displayName = profile?.full_name || user.user_metadata?.display_name || user.email.split('@')[0];
                document.getElementById('profile-name').textContent = displayName;
            } catch (err) {
                console.warn("Profile fetch error, using fallback:", err);
                document.getElementById('profile-name').textContent = user.email.split('@')[0];
            }
            
            document.getElementById('profile-email').textContent = user.email;
            
            fetchVerifiedModules(user.id);

            // Real-time listener
            sb.channel('dashboard-updates')
                .on('postgres_changes', { 
                    event: '*', 
                    schema: 'public', 
                    table: 'course_status',
                    filter: `user_id=eq.${user.id}`
                }, () => fetchVerifiedModules(user.id))
                .subscribe();
        }

        async function fetchVerifiedModules(userId) {
            const container = document.getElementById('modules-container');
            const empty = document.getElementById('empty-state');
            const loading = document.getElementById('loading-state');

            try {
                const { data, error } = await sb
                    .from('course_status')
                    .select('*, courses (*)')
                    .eq('user_id', userId);

                if (loading) loading.classList.add('hidden');
                if (error) throw error;

                const verified = data.filter(item => item.status === 'approved');
                const pending = data.filter(item => item.status === 'pending');

                document.getElementById('stat-approved').textContent = verified.length;
                document.getElementById('stat-pending').textContent = pending.length;

                container.innerHTML = '';
                
                if (verified.length === 0) {
                    empty.classList.remove('hidden');
                } else {
                    empty.classList.add('hidden');
                    verified.forEach((m, idx) => {
                        const card = createModuleCard(m);
                        card.style.animationDelay = `${idx * 0.1}s`;
                        card.classList.add('animate-reveal');
                        container.appendChild(card);
                    });
                }
                lucide.createIcons();
            } catch (err) {
                console.error("Dashboard Error:", err);
            }
        }

        function createModuleCard(item) {
            const div = document.createElement('div');
            div.className = 'glass-card p-8 flex flex-col h-full';
            
            const name = item.courses?.name || 'Classified Data';
            const instructor = item.courses?.instructor || 'Staff';
            const id = item.course_id;
            
            div.innerHTML = `
                <div class="flex justify-between items-start mb-6">
                    <div class="w-10 h-10 rounded-xl bg-white/5 border border-white/5 flex items-center justify-center">
                        <i data-lucide="layers" class="w-5 h-5 text-neutral-400"></i>
                    </div>
                    <span class="mono text-[9px] text-neutral-600 font-medium">REF#${id.slice(0,5)}</span>
                </div>

                <h3 class="text-xl font-bold tracking-tight mb-1">${name}</h3>
                <p class="text-xs text-neutral-500 mb-8 font-medium">${instructor}</p>

                <div class="mt-auto">
                    <button onclick="handleLaunch('${id}')" 
                            class="w-full py-3.5 btn-primary rounded-xl text-[11px] font-bold uppercase tracking-wider flex items-center justify-center gap-2">
                        Enter Workspace
                        <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            `;
            return div;
        }

        window.handleLaunch = (id) => {
            localStorage.setItem('active_session_id', id);
            window.location.href = '/curriculum';
        };

        window.handleLogout = async () => {
            await sb.auth.signOut();
            window.location.href = 'login.html';
        };

        window.onload = init;
    </script>
</body>
</html>
