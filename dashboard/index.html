<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Nexus Prime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --math-primary: #ec4899; --math-dark: #09090b; }
        body { font-family: 'Outfit', sans-serif; background-color: var(--math-dark); color: #f4f4f5; overflow-x: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        #math-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -10; }
        .glass-card { background: rgba(24, 24, 27, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.3s ease; }
        .glass-card:hover { border-color: rgba(236, 72, 153, 0.3); }
        .progress-bar-bg { background: rgba(255, 255, 255, 0.05); height: 6px; border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { background: linear-gradient(90deg, #ec4899, #f472b6); height: 100%; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
        .gradient-text { background: linear-gradient(to bottom right, #fff 30%, #ec4899 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-[#09090b]">
    <div id="math-canvas"></div>

    <nav class="fixed top-0 w-full z-50 p-6 flex justify-between items-center backdrop-blur-md bg-black/20 border-b border-white/5">
        <a href="index.html" class="flex items-center space-x-3 group">
            <div class="w-10 h-10 bg-pink-600 rounded-lg flex items-center justify-center font-black text-xl">Σ</div>
            <div class="font-black text-xl tracking-tighter">NEXUS<span class="text-pink-500">PRIME</span></div>
        </a>
        <div class="flex items-center space-x-6">
            <a href="courses.html" class="mono text-[10px] font-bold uppercase tracking-widest text-gray-400 hover:text-white transition">All Modules</a>
            <button onclick="handleLogout()" class="text-[10px] font-bold uppercase tracking-[0.2em] text-pink-500 hover:text-white transition">Logout</button>
        </div>
    </nav>

    <main class="relative z-10 pt-32 pb-20 px-6 max-w-6xl mx-auto">
        <header class="mb-12">
            <h1 class="text-4xl md:text-5xl font-black tracking-tighter mb-2">Student <span class="gradient-text">Dashboard</span></h1>
            <p id="welcome-msg" class="text-gray-400 mono text-xs uppercase tracking-widest">Initialising session...</p>
        </header>

        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <div class="glass-card p-6 rounded-2xl">
                <p class="mono text-[10px] text-gray-500 uppercase tracking-widest mb-1">Active Modules</p>
                <h2 id="active-count" class="text-3xl font-black text-white">0</h2>
            </div>
            <div class="glass-card p-6 rounded-2xl">
                <p class="mono text-[10px] text-gray-500 uppercase tracking-widest mb-1">Total Progress</p>
                <h2 id="avg-progress" class="text-3xl font-black text-white">0%</h2>
            </div>
            <div class="glass-card p-6 rounded-2xl">
                <p class="mono text-[10px] text-gray-500 uppercase tracking-widest mb-1">Completed Lessons</p>
                <h2 id="total-completed" class="text-3xl font-black text-white">0</h2>
            </div>
        </div>

        <!-- Enrolled Courses -->
        <section>
            <h3 class="mono text-[11px] uppercase text-gray-500 font-bold tracking-widest mb-6 flex items-center gap-2">
                <i data-lucide="book-open" class="w-3 h-3"></i>
                My Learning Path
            </h3>
            
            <div id="dashboard-loader" class="py-20 text-center">
                <div class="w-10 h-10 border-2 border-pink-500/20 border-t-pink-500 rounded-full animate-spin mx-auto mb-4"></div>
                <p class="mono text-[10px] text-gray-500 animate-pulse">Syncing completion data...</p>
            </div>

            <div id="enrolled-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 hidden">
                <!-- Course Cards will be injected here -->
            </div>

            <div id="empty-state" class="hidden glass-card p-12 text-center rounded-[2rem]">
                <p class="text-gray-400 mb-6 leading-relaxed">You haven't been approved for any modules yet.</p>
                <a href="courses.html" class="inline-block px-8 py-3 bg-pink-600 text-white rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-pink-500 transition-all">
                    Browse Modules
                </a>
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function initDashboard() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) return window.location.href = 'login.html';

            document.getElementById('welcome-msg').textContent = `Welcome back, ${session.user.email.split('@')[0]}`;

            try {
                // 1. Get all approved courses for user
                const { data: enrolled, error: eErr } = await sb
                    .from('course_status')
                    .select(`
                        course_id,
                        courses (*)
                    `)
                    .eq('user_id', session.user.id)
                    .eq('status', 'approved');

                if (eErr) throw eErr;

                if (!enrolled || enrolled.length === 0) {
                    document.getElementById('dashboard-loader').classList.add('hidden');
                    document.getElementById('empty-state').classList.remove('hidden');
                    return;
                }

                // 2. Get all lessons for these courses to calculate totals
                const courseIds = enrolled.map(e => e.course_id);
                const { data: allLessons } = await sb
                    .from('lessons')
                    .select('id, course_id')
                    .in('course_id', courseIds);

                // 3. Get completed lessons for this user
                const { data: completions } = await sb
                    .from('lesson_completions')
                    .select('lesson_id')
                    .eq('user_id', session.user.id);

                const completedIds = new Set(completions.map(c => c.lesson_id));

                // 4. Process data per course
                const dashboardData = enrolled.map(enrollment => {
                    const course = enrollment.courses;
                    const courseLessons = allLessons.filter(l => l.course_id === course.id);
                    const totalLessons = courseLessons.length;
                    const completedInCourse = courseLessons.filter(l => completedIds.has(l.id)).length;
                    const percentage = totalLessons > 0 ? Math.round((completedInCourse / totalLessons) * 100) : 0;

                    return { ...course, totalLessons, completedInCourse, percentage };
                });

                renderDashboard(dashboardData);
                updateStats(dashboardData);

            } catch (err) {
                console.error("Dashboard error:", err);
            }
        }

        function renderDashboard(courses) {
            const container = document.getElementById('enrolled-container');
            container.innerHTML = courses.map(c => `
                <div class="glass-card p-8 rounded-[2rem] group flex flex-col justify-between h-full">
                    <div>
                        <div class="flex justify-between items-start mb-6">
                            <div class="w-12 h-12 bg-pink-500/10 rounded-xl flex items-center justify-center text-pink-500">
                                <i data-lucide="award" class="w-6 h-6"></i>
                            </div>
                            <div class="text-right">
                                <span class="mono text-[10px] text-gray-500 uppercase">Progress</span>
                                <p class="text-xl font-black text-white">${c.percentage}%</p>
                            </div>
                        </div>
                        <h4 class="text-2xl font-black text-white mb-2 group-hover:text-pink-500 transition-colors">${c.name}</h4>
                        <p class="text-gray-400 text-sm mb-8 line-clamp-2">${c.description}</p>
                    </div>

                    <div class="mt-auto">
                        <div class="flex justify-between items-center mb-2">
                            <span class="mono text-[9px] text-gray-500 uppercase tracking-widest">${c.completedInCourse} / ${c.totalLessons} Lessons Completed</span>
                        </div>
                        <div class="progress-bar-bg mb-8">
                            <div class="progress-bar-fill" style="width: ${c.percentage}%"></div>
                        </div>
                        <button onclick="goToCourse('${c.id}')" class="w-full py-4 bg-white/5 border border-white/10 rounded-xl text-[10px] font-black uppercase tracking-[0.2em] hover:bg-pink-600 hover:border-pink-600 transition-all flex items-center justify-center gap-2">
                            Resume Module <i data-lucide="chevron-right" class="w-3 h-3"></i>
                        </button>
                    </div>
                </div>
            `).join('');

            document.getElementById('dashboard-loader').classList.add('hidden');
            container.classList.remove('hidden');
            lucide.createIcons();
        }

        function updateStats(courses) {
            const activeCount = courses.length;
            const totalCompleted = courses.reduce((acc, c) => acc + c.completedInCourse, 0);
            const avgProgress = activeCount > 0 
                ? Math.round(courses.reduce((acc, c) => acc + c.percentage, 0) / activeCount) 
                : 0;

            document.getElementById('active-count').textContent = activeCount;
            document.getElementById('avg-progress').textContent = `${avgProgress}%`;
            document.getElementById('total-completed').textContent = totalCompleted;
        }

        window.goToCourse = (id) => {
            // Updated to use active_course_id based on your usage
            sessionStorage.setItem('active_course_id', id);
            window.location.href = 'curriculum.html';
        };

        window.handleLogout = async () => {
            await sb.auth.signOut();
            window.location.href = 'login.html';
        };

        // ThreeJS Background (Simplified from Courses)
        const initScene = () => {
            const container = document.getElementById('math-canvas');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 100;
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);
            const particles = new THREE.BufferGeometry();
            const posArr = new Float32Array(500 * 3);
            for(let i=0; i<1500; i++) posArr[i] = (Math.random() - 0.5) * 400;
            particles.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
            const pSystem = new THREE.Points(particles, new THREE.PointsMaterial({ size: 0.8, color: 0xec4899, transparent: true, opacity: 0.1 }));
            scene.add(pSystem);
            const animate = () => { requestAnimationFrame(animate); pSystem.rotation.y += 0.0001; renderer.render(scene, camera); };
            animate();
        };

        document.addEventListener('DOMContentLoaded', () => {
            initScene();
            initDashboard();
        });
    </script>
</body>
</html>
