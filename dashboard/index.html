<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center | Nexus Prime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #09090b; color: #f4f4f5; opacity: 0; transition: opacity 0.5s ease-in-out; }
        body.ready { opacity: 1; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass-card { background: rgba(24, 24, 27, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .progress-ring { transition: stroke-dashoffset 0.35s; transform: rotate(-90deg); transform-origin: 50% 50%; }
        
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline {
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, transparent, rgba(236, 72, 153, 0.05), transparent);
            height: 100px;
            pointer-events: none;
            animation: scanline 8s linear infinite;
            z-index: 100;
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="scanline"></div>

    <nav class="p-6 flex justify-between items-center border-b border-white/5 bg-black/20 sticky top-0 z-50 backdrop-blur-md">
        <div class="flex items-center space-x-4">
            <div class="w-8 h-8 bg-pink-500 rounded-lg flex items-center justify-center">
                <i data-lucide="layout-grid" class="w-5 h-5 text-black"></i>
            </div>
            <span class="mono text-xs uppercase font-black tracking-[0.3em]">Nexus Prime <span class="text-pink-500">v4.0</span></span>
        </div>
        
        <div class="flex items-center space-x-6">
            <div class="hidden md:flex flex-col items-end">
                <span class="mono text-[8px] text-gray-500 uppercase tracking-widest">Operator</span>
                <span id="user-display" class="mono text-[10px] font-bold text-white">---</span>
            </div>
            <button id="btn-signout" class="p-2 hover:bg-white/5 rounded-full transition-colors text-gray-400 hover:text-pink-500">
                <i data-lucide="log-out" class="w-5 h-5"></i>
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 md:p-10 space-y-10">
        <!-- Header -->
        <section>
            <h1 class="text-4xl md:text-6xl font-black italic uppercase tracking-tighter mb-2">Command Center</h1>
            <p class="mono text-xs text-gray-500 uppercase tracking-widest">Trajectory analysis and approved sector access</p>
        </section>

        <!-- Stats Overview -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass-card p-6 rounded-3xl border-l-4 border-pink-500">
                <div class="flex items-center justify-between mb-2">
                    <span class="mono text-[10px] text-gray-500 uppercase font-bold tracking-widest">Active Sectors</span>
                    <i data-lucide="shield-check" class="w-4 h-4 text-pink-500"></i>
                </div>
                <div id="count-courses" class="text-4xl font-black italic">00</div>
            </div>
            <div class="glass-card p-6 rounded-3xl">
                <div class="flex items-center justify-between mb-2">
                    <span class="mono text-[10px] text-gray-500 uppercase font-bold tracking-widest">Modules Finalized</span>
                    <i data-lucide="zap" class="w-4 h-4 text-yellow-500"></i>
                </div>
                <div id="count-completed" class="text-4xl font-black italic">00</div>
            </div>
            <div class="glass-card p-6 rounded-3xl">
                <div class="flex items-center justify-between mb-2">
                    <span class="mono text-[10px] text-gray-500 uppercase font-bold tracking-widest">Global Sync</span>
                    <i data-lucide="activity" class="w-4 h-4 text-green-500"></i>
                </div>
                <div class="text-4xl font-black italic text-green-500">STABLE</div>
            </div>
        </section>

        <!-- Course Progress List -->
        <section>
            <div class="flex items-center space-x-3 mb-6">
                <h2 class="mono text-xs font-black uppercase tracking-[0.4em] text-pink-500">Approved Curriculum</h2>
                <div class="h-[1px] flex-grow bg-white/5"></div>
            </div>

            <div id="courses-container" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Loading State -->
                <div id="loading-state" class="lg:col-span-2 py-20 flex flex-col items-center justify-center space-y-4">
                    <div class="w-12 h-12 border-2 border-pink-500/20 border-t-pink-500 rounded-full animate-spin"></div>
                    <span class="mono text-[10px] text-gray-600 uppercase tracking-[0.2em]">Synchronizing local records...</span>
                </div>
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }

            currentUser = session.user;
            document.getElementById('user-display').innerText = currentUser.email.split('@')[0].toUpperCase();
            document.body.classList.add('ready');
            lucide.createIcons();

            fetchDashboardData();
        }

        /**
         * Exponential backoff wrapper for API calls
         */
        async function fetchWithRetry(fn, retries = 5, delay = 1000) {
            try {
                return await fn();
            } catch (error) {
                if (retries <= 0) throw error;
                await new Promise(resolve => setTimeout(resolve, delay));
                return fetchWithRetry(fn, retries - 1, delay * 2);
            }
        }

        async function fetchDashboardData() {
            const container = document.getElementById('courses-container');
            
            try {
                // 1. Fetch all lessons and courses to build the map using retry logic
                const [lessonsRes, coursesRes, sessionsRes] = await Promise.all([
                    fetchWithRetry(() => sb.from('lessons').select('id, course_id')),
                    fetchWithRetry(() => sb.from('courses').select('*')),
                    fetchWithRetry(() => sb.from('watch_sessions')
                        .select('lesson_id, is_completed')
                        .eq('user_id', currentUser.id)
                        .eq('is_completed', true))
                ]);

                if (lessonsRes.error || coursesRes.error || sessionsRes.error) {
                    throw new Error("Data sync failure");
                }

                const lessons = lessonsRes.data;
                const courses = coursesRes.data;
                const sessions = sessionsRes.data;

                container.innerHTML = '';

                let totalCompleted = sessions.length;
                document.getElementById('count-completed').innerText = totalCompleted.toString().padStart(2, '0');
                document.getElementById('count-courses').innerText = courses.length.toString().padStart(2, '0');

                courses.forEach(course => {
                    const courseLessons = lessons.filter(l => l.course_id === course.id);
                    const totalLessons = courseLessons.length;
                    
                    if (totalLessons === 0) return;

                    const completedInCourse = courseLessons.filter(cl => 
                        sessions.some(s => s.lesson_id === cl.id)
                    ).length;

                    const percentage = Math.round((completedInCourse / totalLessons) * 100);

                    const card = document.createElement('div');
                    card.className = 'glass-card p-8 rounded-[2.5rem] flex items-center space-x-8 group hover:border-pink-500/30 transition-all cursor-pointer';
                    card.onclick = () => window.location.href = `curriculum.html?course=${course.id}`;
                    
                    card.innerHTML = `
                        <div class="relative flex-shrink-0 w-24 h-24">
                            <svg class="w-full h-full" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="45" fill="transparent" stroke="rgba(255,255,255,0.05)" stroke-width="8"/>
                                <circle cx="50" cy="50" r="45" fill="transparent" stroke="#ec4899" stroke-width="8" 
                                    stroke-dasharray="282.7" 
                                    stroke-dashoffset="${282.7 - (282.7 * percentage / 100)}" 
                                    class="progress-ring"
                                    stroke-linecap="round"/>
                            </svg>
                            <div class="absolute inset-0 flex flex-col items-center justify-center">
                                <span class="text-xl font-black italic">${percentage}%</span>
                            </div>
                        </div>
                        <div class="flex-grow space-y-2">
                            <div class="flex items-center space-x-2">
                                <span class="px-2 py-0.5 bg-pink-500/10 border border-pink-500/20 text-pink-500 mono text-[8px] uppercase font-black tracking-widest">Approved</span>
                            </div>
                            <h3 class="text-2xl font-black italic uppercase tracking-tighter group-hover:text-pink-500 transition-colors">${course.title}</h3>
                            <div class="flex items-center justify-between">
                                <span class="mono text-[10px] text-gray-500 uppercase tracking-widest">${completedInCourse} / ${totalLessons} Modules Defused</span>
                                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-700 group-hover:text-pink-500 group-hover:translate-x-1 transition-all"></i>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });

                lucide.createIcons();
            } catch (err) {
                console.error("Dashboard link failed:", err);
                container.innerHTML = `
                    <div class="lg:col-span-2 p-12 glass-card rounded-[2.5rem] text-center border-red-500/20">
                        <div class="w-16 h-16 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-6">
                            <i data-lucide="wifi-off" class="w-8 h-8 text-red-500"></i>
                        </div>
                        <h3 class="text-2xl font-black italic uppercase tracking-tighter mb-2">Sync Interrupted</h3>
                        <p class="mono text-[10px] uppercase tracking-widest text-gray-500 mb-6">Failed to establish data link with the main sector</p>
                        <button onclick="window.location.reload()" class="px-6 py-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-full mono text-[10px] uppercase font-bold tracking-[0.2em] transition-all">
                            Attempt Re-link
                        </button>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        document.getElementById('btn-signout').onclick = async () => {
            await sb.auth.signOut();
            window.location.href = 'index.html';
        };

        window.onload = init;
    </script>
</body>
</html>
