<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Nexus Prime | Tharaka B Jayathilaka</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --math-primary: #ec4899; 
            --math-dark: #09090b;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--math-dark);
            color: #f4f4f5;
            overflow-x: hidden; 
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        #math-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -10;
        }

        .glass-panel {
            background: rgba(24, 24, 27, 0.4);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(236, 72, 153, 0.3), transparent);
        }

        .input-field {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-field:focus {
            border-color: var(--math-primary);
            background: rgba(236, 72, 153, 0.03);
            outline: none;
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.1);
        }

        .gradient-btn {
            background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .gradient-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.6s;
        }

        .gradient-btn:hover::after {
            left: 100%;
        }

        .gradient-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -10px rgba(236, 72, 153, 0.5);
        }

        .gradient-text {
            background: linear-gradient(to bottom right, #fff 30%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .secure-pulse {
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; color: var(--math-primary); }
        }

        .input-group:focus-within .floating-label {
            color: var(--math-primary);
            transform: translateY(-2px);
        }

        .floating-label {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen py-12 px-6">

    <div id="math-canvas"></div>

    <div class="w-full max-w-md relative z-10">
        <!-- Logo Section -->
        <div class="text-center mb-10">
            <div class="relative inline-block">
                <div class="absolute inset-0 bg-pink-500 blur-2xl opacity-20 scale-150"></div>
                <div class="relative inline-flex items-center justify-center w-20 h-20 bg-zinc-900 border border-white/10 rounded-3xl mb-6 shadow-2xl rotate-3 hover:rotate-0 transition-all duration-500 group">
                    <span class="text-4xl font-black text-pink-500 group-hover:scale-110 transition-transform">Σ</span>
                </div>
            </div>
            <h1 class="text-5xl font-black tracking-tighter mb-3">NEXUS<span class="text-pink-500">PRIME</span></h1>
            <div class="flex items-center justify-center space-x-3">
                <div class="h-[1px] w-8 bg-zinc-800"></div>
                <p class="mono text-[10px] uppercase tracking-[0.5em] text-zinc-500">Academic Infrastructure</p>
                <div class="h-[1px] w-8 bg-zinc-800"></div>
            </div>
        </div>

        <!-- Registration Form Card -->
        <div class="glass-panel rounded-[2.5rem] p-10 overflow-hidden">
            <div class="relative z-10">
                <header class="mb-10 text-center">
                    <h2 class="text-3xl font-bold tracking-tight">Student <span class="gradient-text">Onboarding</span></h2>
                    <p class="text-zinc-500 text-sm mt-2">Create your secure identity in the portal.</p>
                </header>
                
                <form id="register-form" class="space-y-6">
                    <!-- Name Field -->
                    <div class="input-group">
                        <label class="floating-label block mono text-[10px] uppercase tracking-[0.2em] text-zinc-500 mb-2.5 ml-1">Identity Name</label>
                        <div class="relative">
                            <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-600 transition-colors"></i>
                            <input type="text" id="fullname" required placeholder="Ex: Professor X" 
                                class="input-field w-full py-4.5 pl-12 pr-4 rounded-2xl text-sm placeholder:text-zinc-800">
                        </div>
                    </div>

                    <!-- Email Field -->
                    <div class="input-group">
                        <label class="floating-label block mono text-[10px] uppercase tracking-[0.2em] text-zinc-500 mb-2.5 ml-1">Terminal Email</label>
                        <div class="relative">
                            <i data-lucide="at-sign" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-600 transition-colors"></i>
                            <input type="email" id="email" required placeholder="user@nexus.io" 
                                class="input-field w-full py-4.5 pl-12 pr-4 rounded-2xl text-sm placeholder:text-zinc-800">
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="input-group">
                        <div class="flex justify-between items-center mb-2.5 ml-1">
                            <label class="floating-label block mono text-[10px] uppercase tracking-[0.2em] text-zinc-500">Security Phrase</label>
                            <i data-lucide="shield-check" class="w-3.5 h-3.5 text-zinc-700 secure-pulse"></i>
                        </div>
                        <div class="relative">
                            <i data-lucide="key-round" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-600 transition-colors"></i>
                            <input type="password" id="password" required placeholder="••••••••" 
                                class="input-field w-full py-4.5 pl-12 pr-12 rounded-2xl text-sm placeholder:text-zinc-800">
                            <button type="button" id="toggle-password" class="absolute right-4 top-1/2 -translate-y-1/2 text-zinc-600 hover:text-pink-500 transition-all">
                                <i data-lucide="eye-off" class="w-4.5 h-4.5" id="eye-icon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Status Notification -->
                    <div id="status-msg" class="hidden transform transition-all duration-300">
                        <div class="flex items-center space-x-3 p-4 rounded-2xl border text-xs" id="status-container">
                            <i data-lucide="info" class="w-4 h-4 flex-shrink-0" id="status-icon"></i>
                            <span id="status-text"></span>
                        </div>
                    </div>

                    <button type="submit" id="submit-btn" class="gradient-btn w-full py-5 rounded-2xl font-bold text-xs uppercase tracking-[0.3em] flex items-center justify-center space-x-3 text-white">
                        <span>Deploy Account</span>
                        <div class="spinner" id="btn-spinner"></div>
                    </button>
                </form>

                <div class="mt-10 pt-8 border-t border-white/5 text-center">
                    <p class="text-zinc-500 text-xs mb-4">Already authenticated?</p>
                    <a href="/login" class="inline-flex items-center space-x-2 px-6 py-2.5 rounded-full bg-zinc-900 border border-white/5 text-pink-500 font-bold text-[10px] uppercase tracking-[0.2em] hover:bg-zinc-800 hover:border-pink-500/30 transition-all">
                        <span>Access Portal</span>
                        <i data-lucide="arrow-right" class="w-3 h-3"></i>
                    </a>
                </div>
            </div>
        </div>

        <footer class="mt-12 text-center">
            <p class="mono text-[8px] text-zinc-600 uppercase tracking-[0.5em]">
                Nexus Prime Security Infrastructure &copy; 2026
            </p>
        </footer>
    </div>

    <script>
        (function() {
            const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';

            if (!window.supabaseClient) {
                window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
            const supabaseInstance = window.supabaseClient;

            const form = document.getElementById('register-form');
            const togglePass = document.getElementById('toggle-password');
            const passInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');

            togglePass.addEventListener('click', () => {
                const isPassword = passInput.type === 'password';
                passInput.type = isPassword ? 'text' : 'password';
                eyeIcon.setAttribute('data-lucide', isPassword ? 'eye' : 'eye-off');
                lucide.createIcons();
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const spinner = document.getElementById('btn-spinner');
                const submitBtn = document.getElementById('submit-btn');
                const statusMsg = document.getElementById('status-msg');
                const statusText = document.getElementById('status-text');
                const statusContainer = document.getElementById('status-container');

                statusMsg.classList.add('hidden');
                spinner.style.display = 'block';
                submitBtn.disabled = true;
                submitBtn.style.opacity = '0.7';

                try {
                    const { data, error } = await supabaseInstance.auth.signUp({
                        email: document.getElementById('email').value,
                        password: passInput.value,
                        options: { data: { full_name: document.getElementById('fullname').value } }
                    });
                    
                    if (error) throw error;
                    
                    // Success state
                    statusContainer.className = 'flex items-center space-x-3 p-4 rounded-2xl bg-green-500/10 border-green-500/20 text-green-400 text-xs';
                    
                    // Start countdown for redirection
                    let countdown = 3;
                    statusMsg.classList.remove('hidden');
                    
                    const updateStatus = () => {
                        statusText.textContent = `Identity initialized. Redirecting to terminal in ${countdown}s...`;
                    };
                    
                    updateStatus();
                    
                    const interval = setInterval(() => {
                        countdown--;
                        if (countdown <= 0) {
                            clearInterval(interval);
                            window.location.href = '/login'; // Redirect to login
                        } else {
                            updateStatus();
                        }
                    }, 1000);

                    form.reset();

                } catch (err) {
                    statusContainer.className = 'flex items-center space-x-3 p-4 rounded-2xl bg-red-500/10 border-red-500/20 text-red-400 text-xs';
                    statusText.textContent = err.message;
                    statusMsg.classList.remove('hidden');
                    spinner.style.display = 'none';
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                } finally {
                    lucide.createIcons();
                }
            });

            // Three.js Background
            const initScene = () => {
                const container = document.getElementById('math-canvas');
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.z = 100;
                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(window.innerWidth, window.innerHeight);
                container.appendChild(renderer.domElement);

                const particles = new THREE.BufferGeometry();
                const pCount = 2000;
                const posArr = new Float32Array(pCount * 3);
                for(let i=0; i<pCount*3; i++) posArr[i] = (Math.random() - 0.5) * 450;
                particles.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
                
                const pMat = new THREE.PointsMaterial({ 
                    size: 1, 
                    color: 0xec4899, 
                    transparent: true, 
                    opacity: 0.1,
                    blending: THREE.AdditiveBlending 
                });
                
                const pSystem = new THREE.Points(particles, pMat);
                scene.add(pSystem);

                const animate = () => {
                    requestAnimationFrame(animate);
                    pSystem.rotation.y += 0.0003;
                    pSystem.rotation.x += 0.0001;
                    renderer.render(scene, camera);
                };
                animate();

                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });
            };

            document.addEventListener('DOMContentLoaded', () => {
                lucide.createIcons();
                initScene();
            });
        })();
    </script>
</body>
</html>
