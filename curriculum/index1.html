<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ef4444; /* Red 500 */
            --primary-soft: rgba(239, 68, 68, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --bg-page: #0f0f12; /* Deeper black-slate */
            --bg-card: #1a1a1f;
            --border: #2d2d35;
            --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.5);
            --card-hover: 0 20px 25px -5px rgb(0 0 0 / 0.6);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-page); 
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4 {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .custom-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .custom-card:hover {
            box-shadow: var(--card-hover);
            transform: translateY(-2px);
            border-color: #451a1a; /* Subtle dark red border on hover */
        }

        .category-pill {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .category-pill:hover {
            border-color: #ef4444;
            color: #fca5a5;
        }

        .category-pill.active {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
        }

        .lesson-icon-box {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-soft);
            color: var(--primary);
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .badge-red { background: rgba(153, 27, 27, 0.3); color: #fca5a5; border: 1px solid rgba(252, 165, 165, 0.2); }
        .badge-amber { background: rgba(146, 64, 14, 0.3); color: #fcd34d; border: 1px solid rgba(252, 211, 77, 0.2); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-page); }
        ::-webkit-scrollbar-thumb { background: #2d2d35; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ef4444; }
    </style>
</head>
<body class="min-h-screen">
    <nav class="sticky top-0 z-50 bg-[#0f0f12]/80 backdrop-blur-md border-b border-[#2d2d35]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="/dashboard" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-all text-sm font-medium">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    Back
                </a>
                <div class="h-4 w-[1px] bg-slate-800"></div>
                <a href="/dashboard" class="flex items-center gap-2 text-white font-bold text-xl tracking-tight">
                    <div class="w-8 h-8 bg-red-600 rounded-lg flex items-center justify-center shadow-lg shadow-red-900/20">
                        <i data-lucide="book-open" class="w-5 h-5 text-white"></i>
                    </div>
                    Nexus
                </a>
            </div>
            <div class="flex items-center gap-4">
                <div class="h-8 w-8 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center">
                    <i data-lucide="user" class="w-4 h-4 text-slate-400"></i>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-12">
        <header class="mb-12">
            <div class="flex items-center gap-2 text-red-500 font-semibold text-sm mb-4">
                <i data-lucide="flame" class="w-4 h-4"></i>
                ACTIVE LEARNING PATHWAY
            </div>
            <h1 id="course-title" class="text-4xl md:text-5xl font-extrabold text-white mb-6 tracking-tight">
                Loading curriculum...
            </h1>
            <p id="course-desc" class="text-lg text-slate-400 leading-relaxed max-w-3xl"></p>
        </header>

        <!-- Filters (Month Toggles) -->
        <div class="mb-12">
            <div id="month-filter" class="flex flex-wrap gap-3">
                <!-- Month pills injected here -->
            </div>
        </div>

        <div id="lessons-container" class="space-y-16">
            <!-- Skeleton Loader -->
            <div class="animate-pulse space-y-6">
                <div class="h-8 bg-slate-800/50 rounded w-48"></div>
                <div class="grid gap-4">
                    <div class="h-24 bg-slate-800/50 rounded-xl"></div>
                    <div class="h-24 bg-slate-800/50 rounded-xl"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allLessons = [];
        const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) return window.location.href = 'login.html';

            const urlParams = new URLSearchParams(window.location.search);
            const courseId = urlParams.get('course_id') || urlParams.get('id') || localStorage.getItem('active_session_id');
            if (!courseId) return window.location.href = '/dashboard';
            localStorage.setItem('active_session_id', courseId);

            try {
                const { data: statusCheck } = await sb.from('course_status')
                    .select('status').eq('user_id', session.user.id).eq('course_id', courseId).single();

                if (!statusCheck || statusCheck.status !== 'approved') {
                    renderRestrictedUI(statusCheck?.status || 'unauthorized');
                    return;
                }

                const { data: course } = await sb.from('courses').select('*').eq('id', courseId).single();
                document.getElementById('course-title').textContent = course.name;
                document.getElementById('course-desc').textContent = course.description;

                const { data: lessons } = await sb.from('lessons').select('*')
                    .eq('course_id', courseId).order('order_index', { ascending: true });

                allLessons = lessons;
                generateMonthFilters(lessons);
                
                // Set initial view to the first available month automatically
                const uniqueMonths = [...new Set(lessons.map(l => l.month))].filter(m => m != null).sort((a, b) => a - b);
                if (uniqueMonths.length > 0) {
                    filterByMonth(uniqueMonths[0]);
                } else {
                    renderCategorizedLessons(lessons);
                }

            } catch (err) {
                renderErrorUI(err.message);
            }
        }

        function generateMonthFilters(lessons) {
            const filterContainer = document.getElementById('month-filter');
            const uniqueMonths = [...new Set(lessons.map(l => l.month))].filter(m => m != null).sort((a, b) => a - b);
            
            uniqueMonths.forEach(monthNum => {
                const btn = document.createElement('button');
                btn.onclick = () => filterByMonth(monthNum);
                btn.setAttribute('data-month', monthNum);
                btn.className = "category-pill";
                btn.innerText = MONTH_NAMES[monthNum - 1];
                filterContainer.appendChild(btn);
            });
        }

        function filterByMonth(val) {
            // Update UI state for pills
            document.querySelectorAll('.category-pill').forEach(t => {
                t.classList.toggle('active', t.getAttribute('data-month') == val);
            });
            
            // Filter lessons by the selected month
            const filtered = allLessons.filter(l => l.month == val);
            renderCategorizedLessons(filtered);
        }

        function renderCategorizedLessons(lessons) {
            const container = document.getElementById('lessons-container');
            if (!lessons.length) {
                container.innerHTML = `
                    <div class="text-center py-20 bg-red-900/5 rounded-2xl border-2 border-dashed border-red-900/20">
                        <p class="text-slate-500 font-medium">No lessons available in this module.</p>
                    </div>`;
                return;
            }

            const grouped = lessons.reduce((acc, l) => {
                const c = l.categories || 'General Content';
                if (!acc[c]) acc[c] = [];
                acc[c].push(l);
                return acc;
            }, {});

            container.innerHTML = Object.entries(grouped).map(([name, items], idx) => `
                <section class="animate-fade-in" style="animation-delay: ${idx * 100}ms">
                    <div class="flex items-center gap-4 mb-6">
                        <h3 class="text-xl font-bold text-red-50/90 tracking-tight">${name}</h3>
                        <div class="h-[1px] flex-1 bg-red-900/20"></div>
                        <span class="text-xs font-bold text-red-500/60 uppercase tracking-widest">${items.length} units</span>
                    </div>
                    <div class="grid gap-4">
                        ${items.map(l => renderLessonItem(l)).join('')}
                    </div>
                </section>
            `).join('');
            lucide.createIcons();
        }

        function renderLessonItem(l) {
            const type = (l.lesson_type || 'video').toLowerCase();
            const icon = type === 'pdf' ? 'file-text' : (['zoom', 'live'].includes(type) ? 'radio' : 'play');
            
            return `
                <div class="custom-card p-5 md:p-6 rounded-xl flex flex-col md:flex-row md:items-center justify-between gap-6 group">
                    <div class="flex items-start md:items-center gap-5">
                        <div class="lesson-icon-box flex-shrink-0 group-hover:bg-red-600 group-hover:text-white transition-all duration-300">
                            <i data-lucide="${icon}" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <div class="flex flex-wrap items-center gap-3 mb-1">
                                <h4 class="font-bold text-lg text-white group-hover:text-red-400 transition-colors">
                                    ${l.title}
                                </h4>
                                <span class="badge ${type === 'pdf' ? 'badge-red' : 'badge-amber'}">${type}</span>
                            </div>
                            <div class="flex items-center gap-4 text-sm text-slate-500 font-medium">
                                <span class="flex items-center gap-1.5">
                                    <i data-lucide="clock" class="w-4 h-4 text-slate-600"></i>
                                    ${l.watchtime_hours || 0} hours
                                </span>
                                ${l.month ? `
                                    <span class="flex items-center gap-1.5 border-l border-slate-800 pl-4">
                                        <i data-lucide="calendar" class="w-4 h-4 text-slate-600"></i>
                                        ${MONTH_NAMES[l.month-1]}
                                    </span>
                                ` : ''}
                                ${l.is_completed ? `
                                    <span class="flex items-center gap-1.5 text-red-400 border-l border-slate-800 pl-4">
                                        <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                                        Completed
                                    </span>
                                ` : ''}
                            </div>
                        </div>
                    </div>

                    <a href="/learn/${type}?id=${l.id}" 
                       class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-lg bg-white text-black font-bold text-sm hover:bg-red-600 hover:text-white transition-all shadow-lg shadow-black/20">
                        Launch Unit
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </a>
                </div>
            `;
        }

        function renderRestrictedUI(status) {
            document.getElementById('lessons-container').innerHTML = `
                <div class="text-center py-24 px-6 bg-[#1a1a1f] border border-red-900/20 rounded-2xl">
                    <div class="w-16 h-16 bg-red-900/20 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6">
                        <i data-lucide="lock" class="w-8 h-8"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-white mb-2">Access Restricted</h3>
                    <p class="text-slate-500 mb-10 max-w-sm mx-auto">Registration status: ${status.toUpperCase()}. Please contact administration for clearance.</p>
                    <a href="/dashboard" class="inline-flex items-center gap-2 px-8 py-3 bg-red-600 text-white rounded-lg font-bold hover:bg-red-500 transition-all">
                        Back to Command
                    </a>
                </div>
            `;
            lucide.createIcons();
        }

        function renderErrorUI(msg) {
            document.getElementById('lessons-container').innerHTML = `
                <div class="p-6 bg-red-900/10 border border-red-900/30 rounded-xl text-center">
                    <p class="text-red-400 font-medium">SYSTEM_ERROR: ${msg}</p>
                </div>`;
        }

        window.onload = init;
    </script>
</body>
</html>
