<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Dashboard | Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ef4444;
            --primary-soft: rgba(239, 68, 68, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --bg-page: #0f0f12;
            --bg-card: #1a1a1f;
            --border: #2d2d35;
            --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.5);
            --card-hover: 0 20px 25px -5px rgb(0 0 0 / 0.6);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-page); 
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4 { font-family: 'Plus Jakarta Sans', sans-serif; }

        .custom-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .custom-card:hover:not(.locked) {
            box-shadow: var(--card-hover);
            transform: translateY(-2px);
            border-color: #451a1a;
        }

        .category-pill {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.2s;
            cursor: pointer;
        }

        .category-pill.active {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
        }

        .category-pill.is-locked::after {
            content: '';
            font-family: 'lucide';
            font-size: 10px;
            margin-left: 6px;
            opacity: 0.7;
        }

        .lesson-icon-box {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-soft);
            color: var(--primary);
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .badge-red { background: rgba(153, 27, 27, 0.3); color: #fca5a5; border: 1px solid rgba(252, 165, 165, 0.2); }
        .badge-amber { background: rgba(146, 64, 14, 0.3); color: #fcd34d; border: 1px solid rgba(252, 211, 77, 0.2); }
        .badge-blue { background: rgba(30, 58, 138, 0.3); color: #93c5fd; border: 1px solid rgba(147, 197, 253, 0.2); }
        .badge-live { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.4); animation: pulse-red 2s infinite; }

        @keyframes pulse-red {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }

        .live-card-glow {
            position: relative;
            overflow: hidden;
        }
        .live-card-glow::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen">
    <nav class="sticky top-0 z-50 bg-[#0f0f12]/80 backdrop-blur-md border-b border-[#2d2d35]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="/dashboard" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-all text-sm font-medium">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    Dashboard
                </a>
                <div class="h-4 w-[1px] bg-slate-800"></div>
                <div class="flex items-center gap-2 text-white font-bold text-xl tracking-tight">
                    <div class="w-8 h-8 bg-red-600 rounded-lg flex items-center justify-center shadow-lg shadow-red-900/20">
                        <i data-lucide="shield-check" class="w-5 h-5 text-white"></i>
                    </div>
                    Nexus
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div id="user-display" class="hidden md:block text-xs text-slate-500 font-medium"></div>
                <div class="h-8 w-8 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center">
                    <i data-lucide="user" class="w-4 h-4 text-slate-400"></i>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-12">
        <header class="mb-8">
            <div class="flex items-center gap-2 text-red-500 font-semibold text-sm mb-4">
                <i data-lucide="graduation-cap" class="w-4 h-4"></i>
                CURRICULUM ENROLLMENT
            </div>
            <h1 id="course-title" class="text-4xl md:text-5xl font-extrabold text-white mb-6 tracking-tight">Loading...</h1>
            <p id="course-desc" class="text-lg text-slate-400 leading-relaxed max-w-3xl"></p>
        </header>

        <!-- Live Class Highlight Banner -->
        <div id="active-live-highlight" class="mb-10 hidden">
            <div class="custom-card live-card-glow border-red-500/30 bg-red-500/5 p-6 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-6 animate-fade-in">
                <div class="flex items-center gap-5">
                    <div class="w-16 h-16 rounded-xl bg-red-600 flex items-center justify-center shadow-2xl shadow-red-600/40 relative">
                        <i data-lucide="radio" class="w-8 h-8 text-white"></i>
                        <span class="absolute -top-1 -right-1 flex h-4 w-4">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-4 w-4 bg-red-500"></span>
                        </span>
                    </div>
                    <div>
                        <div class="flex items-center gap-3 mb-1">
                            <h2 id="live-lesson-title" class="text-xl font-bold text-white">Live Session Active</h2>
                            <span class="badge-live px-2 py-0.5 rounded text-[10px] uppercase font-bold">Live Now</span>
                        </div>
                        <p class="text-slate-400 text-sm">A live unit is currently available for your current module. Join now to interact with your mentor.</p>
                    </div>
                </div>
                <a id="live-join-btn" class="w-full md:w-auto px-10 py-4 bg-white text-black hover:bg-red-600 hover:text-white transition-all font-extrabold rounded-xl shadow-2xl flex items-center justify-center gap-2 group">
                    JOIN LIVE CLASS
                    <i data-lucide="arrow-right" class="w-5 h-5 group-hover:translate-x-1 transition-transform"></i>
                </a>
            </div>
        </div>

        <div class="mb-12">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-sm font-bold text-slate-500 uppercase tracking-widest">Select Learning Module</h3>
            </div>
            <div id="month-filter" class="flex flex-wrap gap-3"></div>
        </div>

        <div id="lessons-container" class="space-y-16"></div>
    </main>

    <div id="feedback-toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[100] hidden">
        <div id="toast-bg" class="bg-slate-900 border border-slate-800 px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 min-w-[300px]">
            <div id="toast-icon" class="w-8 h-8 rounded-full flex items-center justify-center"></div>
            <div id="toast-message" class="text-sm font-semibold text-white"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allLessons = [];
        let approvedMonths = [];
        let pendingMonths = [];
        let currentUser = null;
        let activeCourseId = null;
        const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) return window.location.href = 'login.html';
            
            currentUser = session.user;
            document.getElementById('user-display').textContent = session.user.email;

            const urlParams = new URLSearchParams(window.location.search);
            const courseId = urlParams.get('course_id') || urlParams.get('id') || localStorage.getItem('active_session_id');
            if (!courseId) return window.location.href = '/dashboard';
            activeCourseId = courseId;
            localStorage.setItem('active_session_id', courseId);

            try {
                const { data: statusCheck } = await sb.from('course_status').select('status').eq('user_id', currentUser.id).eq('course_id', courseId).single();
                if (!statusCheck || statusCheck.status !== 'approved') return renderRestrictedUI(statusCheck?.status || 'unauthorized');

                await fetchApprovals();
                const { data: course } = await sb.from('courses').select('*').eq('id', courseId).single();
                document.getElementById('course-title').textContent = course.name;
                document.getElementById('course-desc').textContent = course.description;

                const { data: lessons } = await sb.from('lessons').select('*').eq('course_id', courseId);
                allLessons = lessons;
                generateMonthFilters(lessons);
                
                const uniqueMonths = [...new Set(lessons.map(l => l.month))].filter(m => m != null).sort((a, b) => a - b);
                if (uniqueMonths.length > 0) filterByMonth(uniqueMonths[0]);
            } catch (err) {
                renderErrorUI(err.message);
            }
        }

        async function fetchApprovals() {
            const { data: approvals } = await sb.from('monthly_approvals').select('month_number, status').eq('user_id', currentUser.id).eq('course_id', activeCourseId);
            approvedMonths = approvals ? approvals.filter(a => a.status === 'approved').map(a => parseInt(a.month_number)) : [];
            pendingMonths = approvals ? approvals.filter(a => a.status === 'pending').map(a => parseInt(a.month_number)) : [];
        }

        function generateMonthFilters(lessons) {
            const filterContainer = document.getElementById('month-filter');
            filterContainer.innerHTML = '';
            const uniqueMonths = [...new Set(lessons.map(l => l.month))].filter(m => m != null).sort((a, b) => a - b);
            uniqueMonths.forEach(monthNum => {
                const isApproved = approvedMonths.includes(parseInt(monthNum));
                const btn = document.createElement('button');
                btn.onclick = () => filterByMonth(monthNum);
                btn.className = `category-pill ${!isApproved ? 'is-locked opacity-70' : ''}`;
                btn.setAttribute('data-month', monthNum);
                btn.innerHTML = `${!isApproved ? '<i data-lucide="lock" class="w-3 h-3 mr-2"></i>' : ''} ${MONTH_NAMES[monthNum - 1]}`;
                filterContainer.appendChild(btn);
            });
            lucide.createIcons();
        }

        function filterByMonth(val) {
            document.querySelectorAll('.category-pill').forEach(t => t.classList.toggle('active', t.getAttribute('data-month') == val));
            const isApproved = approvedMonths.includes(parseInt(val));
            const isPending = pendingMonths.includes(parseInt(val));
            
            const filtered = allLessons.filter(l => l.month == val);
            
            // Highlight Logic: Active live lesson for current module
            const activeLive = filtered.find(l => (l.lesson_type || '').toLowerCase() === 'live');
            const highlightContainer = document.getElementById('active-live-highlight');
            const liveTitle = document.getElementById('live-lesson-title');
            const liveBtn = document.getElementById('live-join-btn');

            if (activeLive && isApproved) {
                highlightContainer.classList.remove('hidden');
                liveTitle.textContent = activeLive.title || 'Live Session Active';
                // Direct to /learn/live
                liveBtn.href = `/learn/live?id=${activeLive.id}`;
            } else {
                highlightContainer.classList.add('hidden');
            }

            renderCategorizedLessons(filtered, isApproved, val, isPending);
        }

        async function requestApproval(monthNum) {
            const btn = document.getElementById('request-btn');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Sending...';
                lucide.createIcons();
            }

            try {
                const { error } = await sb.from('monthly_approvals').insert({
                    user_id: currentUser.id,
                    course_id: activeCourseId,
                    month_number: monthNum,
                    status: 'pending'
                });
                if (error) throw error;
                showToast("Request submitted successfully!", "success");
                await fetchApprovals();
                filterByMonth(monthNum);
                generateMonthFilters(allLessons);
            } catch (err) {
                showToast(err.message, "error");
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = 'Request Unlock';
                    lucide.createIcons();
                }
            }
        }

        function showToast(msg, type) {
            const toast = document.getElementById('feedback-toast');
            const message = document.getElementById('toast-message');
            const icon = document.getElementById('toast-icon');
            message.textContent = msg;
            icon.innerHTML = type === 'success' ? '<i data-lucide="check" class="w-4 h-4 text-green-500"></i>' : '<i data-lucide="alert-circle" class="w-4 h-4 text-red-500"></i>';
            icon.className = `w-8 h-8 rounded-full flex items-center justify-center ${type === 'success' ? 'bg-green-500/20' : 'bg-red-500/20'}`;
            toast.classList.remove('hidden');
            lucide.createIcons();
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        window.launchExternal = function(url, lessonId) {
            if (!url) return;
            localStorage.setItem('external_lesson_url', url);
            localStorage.setItem('current_lesson_id', lessonId);
            window.location.href = `/learn/external?id=${lessonId}`;
        };

        function renderCategorizedLessons(lessons, isApproved, selectedMonthNum, isPending) {
            const container = document.getElementById('lessons-container');
            if (!isApproved) {
                container.innerHTML = `
                <div class="text-center py-20 bg-slate-900/30 rounded-2xl border border-white/5 animate-fade-in">
                    <div class="w-20 h-20 bg-red-600/10 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6">
                        <i data-lucide="lock" class="w-10 h-10"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-white mb-2">${MONTH_NAMES[selectedMonthNum-1]} Content Locked</h3>
                    <p class="text-slate-400 mb-8 max-w-md mx-auto">This module is currently locked. You can request access from your mentor below.</p>
                    ${isPending ? 
                        `<div class="inline-flex items-center gap-2 px-8 py-3 rounded-lg bg-amber-500/10 text-amber-500 font-bold border border-amber-500/20">
                            <i data-lucide="clock" class="w-5 h-5"></i> Request Pending
                        </div>` :
                        `<button id="request-btn" onclick="requestApproval(${selectedMonthNum})" class="inline-flex items-center gap-2 px-8 py-3 rounded-lg bg-red-600 text-white font-bold hover:bg-red-700 transition-all shadow-xl shadow-red-900/20">
                            Request Unlock <i data-lucide="send" class="w-4 h-4"></i>
                        </button>`
                    }
                </div>`;
                lucide.createIcons();
                return;
            }

            const grouped = lessons.reduce((acc, l) => {
                const c = l.categories || 'Core Curriculum';
                if (!acc[c]) acc[c] = [];
                acc[c].push(l);
                return acc;
            }, {});

            const sortedCategories = Object.entries(grouped).sort((a, b) => {
                const earliestA = a[1].reduce((min, l) => Math.min(min, new Date(l.created_at || 0).getTime()), Infinity);
                const earliestB = b[1].reduce((min, l) => Math.min(min, new Date(l.created_at || 0).getTime()), Infinity);
                return earliestA - earliestB;
            });

            container.innerHTML = sortedCategories.map(([name, items]) => `
                <section class="animate-fade-in">
                    <div class="flex items-center gap-4 mb-6">
                        <h3 class="text-xl font-bold text-red-50/90">${name}</h3>
                        <div class="h-[1px] flex-1 bg-red-900/20"></div>
                    </div>
                    <div class="grid gap-4">${items.map(l => renderLessonItem(l)).join('')}</div>
                </section>
            `).join('');
            lucide.createIcons();
        }

        function renderLessonItem(l) {
            const type = (l.lesson_type || 'video').toLowerCase();
            let icon = 'play';
            let badgeClass = 'badge-amber';
            
            if (type === 'pdf') { icon = 'file-text'; badgeClass = 'badge-red'; }
            else if (type === 'external') { icon = 'external-link'; badgeClass = 'badge-blue'; }
            else if (type === 'live') { icon = 'radio'; badgeClass = 'badge-live'; }

            // ROUTING LOGIC: If live, go to learn/live. If external, use external portal. Others go to learn/{type}.
            let onClickAction = `href="/learn/${type}?id=${l.id}"`;
            let buttonLabel = 'Launch Unit';
            let actionIcon = 'arrow-right';

            if (type === 'external') {
                onClickAction = `onclick="launchExternal('${l.video_url}', '${l.id}')"`;
                buttonLabel = 'Open Portal';
                actionIcon = 'external-link';
            } else if (type === 'live') {
                buttonLabel = 'Join Now';
                actionIcon = 'radio';
            }

            return `
                <div class="custom-card p-5 md:p-6 rounded-xl flex flex-col md:flex-row md:items-center justify-between gap-6 group">
                    <div class="flex items-start md:items-center gap-5">
                        <div class="lesson-icon-box flex-shrink-0 group-hover:bg-red-600 group-hover:text-white transition-all duration-300">
                            <i data-lucide="${icon}" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <div class="flex flex-wrap items-center gap-3 mb-1">
                                <h4 class="font-bold text-lg text-white group-hover:text-red-400 transition-colors">${l.title}</h4>
                                <span class="badge ${badgeClass}">${type}</span>
                            </div>
                            <div class="text-sm text-slate-500 font-medium">
                                <span class="flex items-center gap-1.5"><i data-lucide="clock" class="w-4 h-4"></i> ${l.watchtime_hours || 1} hrs</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        ${type === 'external' 
                            ? `<button ${onClickAction} class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-lg bg-white text-black font-bold text-sm hover:bg-red-600 hover:text-white transition-all shadow-lg">
                                ${buttonLabel} <i data-lucide="${actionIcon}" class="w-4 h-4"></i>
                               </button>`
                            : `<a ${onClickAction} class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-lg bg-white text-black font-bold text-sm hover:bg-red-600 hover:text-white transition-all shadow-lg">
                                ${buttonLabel} <i data-lucide="${actionIcon}" class="w-4 h-4"></i>
                               </a>`
                        }
                    </div>
                </div>
            `;
        }

        function renderRestrictedUI(status) {
            document.getElementById('lessons-container').innerHTML = `<div class="text-center py-24 px-6 bg-[#1a1a1f] border border-red-900/20 rounded-2xl">
                <h3 class="text-2xl font-bold text-white mb-2">Access Denied</h3>
                <p class="text-slate-500 mb-10">Status: ${status.toUpperCase()}</p>
                <a href="/dashboard" class="bg-red-600 text-white px-8 py-3 rounded-lg font-bold">Return to Dashboard</a>
            </div>`;
            lucide.createIcons();
        }

        function renderErrorUI(msg) {
            document.getElementById('lessons-container').innerHTML = `<div class="p-8 text-red-400 text-center">${msg}</div>`;
        }

        window.onload = init;
    </script>
</body>
</html>
