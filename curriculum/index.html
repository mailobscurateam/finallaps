<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum | Nexus Prime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #09090b; color: #f4f4f5; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass-card { background: rgba(24, 24, 27, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .lesson-item:hover { background: rgba(236, 72, 153, 0.05); border-left-color: #ec4899; }
        .type-badge { font-size: 9px; letter-spacing: 0.05em; padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); }
        
        /* Category Header Styling */
        .cat-line { height: 1px; flex-grow: 1; background: linear-gradient(90deg, rgba(236, 72, 153, 0.2) 0%, transparent 100%); }
    </style>
</head>
<body class="p-6 md:p-12">
    <nav class="max-w-6xl mx-auto flex justify-between items-center mb-16">
        <a href="/courses" class="flex items-center space-x-2 text-gray-400 hover:text-white transition">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span class="mono text-[10px] uppercase font-bold tracking-widest">Back to Modules</span>
        </a>
        <div class="mono text-[10px] text-pink-500 uppercase font-black tracking-[0.3em]">Curriculum Dashboard</div>
    </nav>

    <main class="max-w-4xl mx-auto">
        <header id="course-header" class="mb-12">
            <h1 id="course-title" class="text-4xl md:text-5xl font-black mb-4 tracking-tighter text-white">Loading Course...</h1>
            <p id="course-desc" class="text-gray-400 leading-relaxed max-w-2xl"></p>
        </header>

        <div id="lessons-container" class="space-y-12">
            <div class="animate-pulse space-y-4">
                <div class="h-20 bg-white/5 rounded-2xl w-full"></div>
                <div class="h-20 bg-white/5 rounded-2xl w-full"></div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function init() {
            const courseId = sessionStorage.getItem('active_course_id');
            if (!courseId) {
                window.location.href = '/courses';
                return;
            }

            try {
                // 1. Fetch Course Data
                const { data: course } = await sb.from('courses').select('*').eq('id', courseId).single();
                if (course) {
                    document.getElementById('course-title').textContent = course.name;
                    document.getElementById('course-desc').textContent = course.description;
                }

                // 2. Fetch Lessons with Category JOIN
                const { data: lessons, error: lErr } = await sb
                    .from('lessons')
                    .select('*, lesson_categories(*)')
                    .eq('course_id', courseId)
                    .order('order_index', { ascending: true });

                if (lErr) throw lErr;
                
                renderCategorizedLessons(lessons);
            } catch (err) {
                console.error("Initialization Error:", err);
                document.getElementById('lessons-container').innerHTML = `
                    <div class="p-6 border border-red-500/20 bg-red-500/5 rounded-2xl">
                        <p class="text-red-400 mono text-xs">Error: ${err.message}</p>
                    </div>
                `;
            }
        }

        function renderCategorizedLessons(lessons) {
            const container = document.getElementById('lessons-container');
            
            if (!lessons || lessons.length === 0) {
                container.innerHTML = `<div class="p-12 text-center glass-card rounded-[2rem] text-gray-500 mono text-xs uppercase tracking-widest">No lessons assigned to this module.</div>`;
                return;
            }

            // Grouping logic: Organize lessons by category name
            const grouped = lessons.reduce((acc, lesson) => {
                const category = lesson.lesson_categories;
                const catName = category ? category.name : 'General Resources';
                
                if (!acc[catName]) {
                    acc[catName] = {
                        details: category || { color_hex: '#6366f1' },
                        items: []
                    };
                }
                acc[catName].items.push(lesson);
                return acc;
            }, {});

            // Generate HTML
            container.innerHTML = Object.entries(grouped).map(([name, data]) => {
                const color = data.details.color_hex;
                
                return `
                    <section class="category-group">
                        <div class="flex items-center gap-4 mb-6">
                            <h3 class="mono text-[11px] font-black uppercase tracking-[0.3em]" style="color: ${color}">
                                ${name}
                            </h3>
                            <div class="cat-line"></div>
                            <span class="mono text-[9px] text-gray-600 font-bold">${data.items.length} UNITS</span>
                        </div>
                        
                        <div class="grid gap-3">
                            ${data.items.map(lesson => renderLessonItem(lesson)).join('')}
                        </div>
                    </section>
                `;
            }).join('');

            lucide.createIcons();
        }

        function renderLessonItem(lesson) {
            const type = (lesson.lesson_type || 'youtube').toLowerCase();
            let icon = 'play';
            if (type === 'pdf') icon = 'file-text';
            if (type === 'zoom' || type === 'live') icon = 'video';

            const duration = lesson.watchtime_hours > 0 
                ? `${lesson.watchtime_hours}h ${lesson.watchtime_minutes}m` 
                : `${lesson.watchtime_minutes || 0}m`;

            return `
                <div class="glass-card p-5 rounded-2xl border-l-4 border-l-transparent transition-all lesson-item flex items-center justify-between group">
                    <div class="flex items-center space-x-5">
                        <div class="w-9 h-9 rounded-xl bg-white/5 flex items-center justify-center text-white/40 font-black text-[10px] mono border border-white/5">
                            ${lesson.order_index || '0'}
                        </div>
                        <div>
                            <div class="flex items-center space-x-3 mb-1">
                                <h4 class="font-bold text-white group-hover:text-pink-400 transition-colors">${lesson.title}</h4>
                                <span class="type-badge mono text-gray-500 font-bold">${type}</span>
                            </div>
                            <p class="text-[10px] text-gray-600 mono uppercase tracking-widest flex items-center gap-2">
                                <i data-lucide="clock" class="w-3 h-3"></i>
                                ${duration}
                            </p>
                        </div>
                    </div>
                    <a href="/learn/${type}?id=${lesson.id}" 
                       class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-gray-500 group-hover:bg-pink-600 group-hover:text-white group-hover:scale-110 transition-all duration-300">
                        <i data-lucide="${icon}" class="w-4 h-4 ${icon === 'play' ? 'ml-0.5' : ''}"></i>
                    </a>
                </div>
            `;
        }

        window.onload = init;
    </script>
</body>
</html>
