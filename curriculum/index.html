<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum | Nexus Prime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #050507; 
            color: #f4f4f5; 
            overflow-x: hidden;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Glass Morphism */
        .glass-card { 
            background: rgba(24, 24, 27, 0.4); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }

        /* Category Header Highlights */
        .category-glow {
            position: relative;
            display: inline-block;
        }
        .category-glow::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, var(--cat-color-low) 0%, transparent 70%);
            z-index: -1;
            opacity: 0.4;
            filter: blur(15px);
        }

        .lesson-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .lesson-item:hover { 
            background: rgba(255, 255, 255, 0.02); 
            transform: translateX(10px);
            border-left-color: var(--cat-color) !important;
        }

        .type-badge { 
            font-size: 9px; 
            letter-spacing: 0.1em; 
            padding: 2px 10px; 
            border-radius: 4px; 
            border: 1px solid rgba(255,255,255,0.1); 
            background: rgba(255,255,255,0.03); 
        }

        /* Animated Progress Background */
        .progress-subtle {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--cat-color);
            opacity: 0.3;
        }

        /* Month Tab Styling */
        .month-tab {
            transition: all 0.3s ease;
            position: relative;
        }
        .month-tab.active {
            color: #ec4899;
            background: rgba(236, 72, 153, 0.1);
            border-color: rgba(236, 72, 153, 0.3);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.1);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #ec4899; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-item {
            animation: fadeIn 0.5s ease forwards;
        }
    </style>
</head>
<body class="p-6 md:p-12 min-h-screen">
    <nav class="max-w-5xl mx-auto flex justify-between items-center mb-20">
        <a href="/dashboard" class="flex items-center space-x-3 text-gray-500 hover:text-white transition-all group">
            <div class="w-8 h-8 rounded-full border border-white/10 flex items-center justify-center group-hover:border-pink-500/50 transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4 group-hover:-translate-x-1 transition-transform"></i>
            </div>
            <span class="mono text-[10px] uppercase font-bold tracking-widest">System Exit</span>
        </a>
        <div class="flex flex-col items-end">
            <div class="mono text-[10px] text-pink-500 uppercase font-black tracking-[0.4em] mb-1">Nexus Prime</div>
            <div class="h-0.5 w-12 bg-pink-500 shadow-[0_0_10px_#ec4899]"></div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto">
        <header id="course-header" class="mb-16 border-l-2 border-white/5 pl-8">
            <h1 id="course-title" class="text-5xl md:text-7xl font-black mb-6 tracking-tighter text-white leading-none">
                <span class="opacity-20">LOAD</span>_ING...
            </h1>
            <p id="course-desc" class="text-gray-400 leading-relaxed max-w-2xl text-lg font-light italic"></p>
        </header>

        <!-- Filter Section -->
        <section class="mb-16">
            <div id="month-filter" class="flex flex-wrap gap-2 p-2 glass-card rounded-2xl inline-flex border-white/10">
                <button onclick="filterByMonth('all')" data-month="all" class="month-tab active px-6 py-3 rounded-xl mono text-[11px] font-bold uppercase tracking-wider border border-transparent hover:bg-white/5 transition-all">
                    Unified Timeline
                </button>
            </div>
        </section>

        <div id="lessons-container" class="space-y-24">
            <!-- Skeleton Loader -->
            <div class="animate-pulse space-y-12">
                <div class="flex items-center gap-4">
                    <div class="h-4 bg-white/5 rounded w-32"></div>
                    <div class="h-[1px] bg-white/5 flex-grow"></div>
                </div>
                <div class="space-y-4">
                    <div class="h-24 bg-white/5 rounded-3xl w-full"></div>
                    <div class="h-24 bg-white/5 rounded-3xl w-full"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allLessons = [];
        const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) return window.location.href = 'login.html';

            const urlParams = new URLSearchParams(window.location.search);
            const courseId = urlParams.get('course_id') || urlParams.get('id') || localStorage.getItem('active_session_id');

            if (!courseId) return window.location.href = '/dashboard';
            localStorage.setItem('active_session_id', courseId);

            try {
                const { data: statusCheck } = await sb.from('course_status')
                    .select('status').eq('user_id', session.user.id).eq('course_id', courseId).single();

                if (!statusCheck || statusCheck.status !== 'approved') {
                    renderRestrictedUI(statusCheck?.status || 'unauthorized');
                    return;
                }

                const { data: course } = await sb.from('courses').select('*').eq('id', courseId).single();
                document.getElementById('course-title').innerHTML = course.name.toUpperCase();
                document.getElementById('course-desc').textContent = course.description;

                const { data: lessons } = await sb.from('lessons').select('*')
                    .eq('course_id', courseId).order('order_index', { ascending: true });

                allLessons = lessons;
                generateMonthFilters(lessons);
                renderCategorizedLessons(lessons);

            } catch (err) {
                renderErrorUI(err.message);
            }
        }

        function generateMonthFilters(lessons) {
            const filterContainer = document.getElementById('month-filter');
            const uniqueMonths = [...new Set(lessons.map(l => l.month))].filter(m => m != null).sort((a, b) => a - b);
            
            uniqueMonths.forEach(monthNum => {
                const btn = document.createElement('button');
                btn.onclick = () => filterByMonth(monthNum);
                btn.setAttribute('data-month', monthNum);
                btn.className = "month-tab px-6 py-3 rounded-xl mono text-[11px] font-bold uppercase tracking-wider border border-transparent hover:bg-white/5 transition-all";
                btn.innerText = MONTH_NAMES[monthNum - 1];
                filterContainer.appendChild(btn);
            });
        }

        function filterByMonth(monthValue) {
            document.querySelectorAll('.month-tab').forEach(tab => {
                tab.classList.toggle('active', tab.getAttribute('data-month') == monthValue);
            });
            const filtered = monthValue === 'all' ? allLessons : allLessons.filter(l => l.month == monthValue);
            renderCategorizedLessons(filtered);
        }

        function renderCategorizedLessons(lessons) {
            const container = document.getElementById('lessons-container');
            if (!lessons.length) {
                container.innerHTML = `<div class="p-20 text-center glass-card rounded-[3rem] border-dashed border-2 border-white/5">
                    <p class="text-gray-600 mono text-xs uppercase tracking-[0.3em]">No Data in this sector</p>
                </div>`;
                return;
            }

            const grouped = lessons.reduce((acc, lesson) => {
                const cat = lesson.categories || 'Core Curriculum';
                if (!acc[cat]) acc[cat] = [];
                acc[cat].push(lesson);
                return acc;
            }, {});

            container.innerHTML = Object.entries(grouped).map(([name, items], idx) => {
                const color = stringToColor(name);
                return `
                    <section class="animate-item" style="animation-delay: ${idx * 100}ms">
                        <div class="flex items-center gap-6 mb-10">
                            <div class="category-glow" style="--cat-color-low: ${color}22">
                                <h3 class="mono text-[13px] font-black uppercase tracking-[0.5em] px-4 py-2 rounded-lg border border-white/5 bg-white/5 shadow-2xl" style="color: ${color}; border-left: 3px solid ${color}">
                                    ${name}
                                </h3>
                            </div>
                            <div class="h-[1px] flex-grow" style="background: linear-gradient(90deg, ${color}44 0%, transparent 100%)"></div>
                            <span class="mono text-[9px] text-gray-500 font-bold uppercase tracking-widest bg-white/5 px-3 py-1 rounded-full border border-white/5">
                                ${items.length} Modules
                            </span>
                        </div>
                        <div class="grid gap-6">
                            ${items.map(lesson => renderLessonItem(lesson, color)).join('')}
                        </div>
                    </section>
                `;
            }).join('');

            lucide.createIcons();
        }

        function stringToColor(str) {
            if (str === 'Core Curriculum') return '#ec4899';
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            const c = (hash & 0x00FFFFFF).toString(16).toUpperCase();
            return "#" + "00000".substring(0, 6 - c.length) + c;
        }

        function renderLessonItem(lesson, catColor) {
            const type = (lesson.lesson_type || 'youtube').toLowerCase();
            const icon = type === 'pdf' ? 'file-text' : (['zoom', 'live', 'video'].includes(type) ? 'video' : 'play');

            return `
                <div class="glass-card p-6 md:p-8 rounded-[2rem] lesson-item flex items-center justify-between group" 
                     style="--cat-color: ${catColor}; border-left-width: 4px; border-left-color: rgba(255,255,255,0.05)">
                    
                    <div class="flex items-center space-x-8">
                        <div class="w-12 h-12 rounded-2xl bg-white/5 flex items-center justify-center text-white/20 font-black text-xs mono border border-white/5 group-hover:bg-white/10 group-hover:text-white transition-all">
                            ${lesson.order_index?.toString().padStart(2, '0') || '00'}
                        </div>
                        <div>
                            <div class="flex items-center gap-4 mb-2">
                                <h4 class="font-bold text-xl text-white group-hover:text-pink-400 transition-colors tracking-tight">
                                    ${lesson.title}
                                </h4>
                                <span class="type-badge mono text-gray-400 font-bold uppercase">${type}</span>
                            </div>
                            <div class="flex items-center gap-6">
                                <p class="text-[10px] text-gray-500 mono uppercase tracking-widest flex items-center gap-2 font-bold">
                                    <i data-lucide="clock" class="w-3 h-3 text-pink-500"></i>
                                    ${lesson.watchtime_minutes || 0} MINS
                                </p>
                                ${lesson.month ? `
                                    <span class="text-[9px] mono text-pink-500/80 uppercase font-black tracking-tighter">
                                        Scheduled: ${MONTH_NAMES[lesson.month - 1]}
                                    </span>
                                ` : ''}
                                ${lesson.is_completed ? `
                                    <span class="text-[9px] mono text-emerald-400 uppercase font-black flex items-center gap-1.5 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20">
                                        <i data-lucide="check" class="w-3 h-3"></i> Sync Complete
                                    </span>
                                ` : ''}
                            </div>
                        </div>
                    </div>

                    <a href="/learn/${type}?id=${lesson.id}" 
                       class="w-14 h-14 rounded-[1.2rem] bg-white/5 flex items-center justify-center text-gray-500 group-hover:bg-pink-600 group-hover:text-white group-hover:scale-110 group-hover:rotate-12 transition-all duration-500 shadow-2xl">
                        <i data-lucide="${icon}" class="w-6 h-6 ${icon === 'play' ? 'ml-1' : ''}"></i>
                    </a>
                </div>
            `;
        }

        function renderRestrictedUI(status) {
            document.getElementById('lessons-container').innerHTML = `
                <div class="p-20 text-center glass-card rounded-[3rem] border-yellow-500/20 bg-yellow-500/5">
                    <i data-lucide="lock" class="w-16 h-16 text-yellow-500/50 mx-auto mb-8"></i>
                    <h3 class="text-2xl font-black text-white uppercase mb-4 tracking-widest">Protocol Restricted</h3>
                    <p class="text-gray-400 text-sm max-w-xs mx-auto mb-10 leading-loose">
                        Your identification code is flagged as <strong>${status.toUpperCase()}</strong>. Verification required.
                    </p>
                    <a href="/dashboard" class="inline-flex items-center gap-3 px-10 py-4 bg-white/5 hover:bg-white/10 text-white rounded-2xl text-[11px] font-black uppercase tracking-[0.2em] transition-all border border-white/5">
                        Back to Command
                    </a>
                </div>
            `;
            lucide.createIcons();
        }

        function renderErrorUI(msg) {
            document.getElementById('lessons-container').innerHTML = `<div class="p-10 border border-red-500/20 bg-red-500/5 rounded-3xl text-center">
                <p class="text-red-400 mono text-xs uppercase font-bold mb-2">SYSTEM_ERR: ${msg}</p>
            </div>`;
            lucide.createIcons();
        }

        window.onload = init;
    </script>
</body>
</html>
