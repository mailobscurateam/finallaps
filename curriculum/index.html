<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum | Nexus Prime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #09090b; 
            color: #f4f4f5; 
            overflow-x: hidden;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass-card { 
            background: rgba(24, 24, 27, 0.4); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }
        .lesson-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lesson-item:hover { 
            background: rgba(236, 72, 153, 0.03); 
            border-left: 4px solid #ec4899; 
            transform: translateX(8px);
            border-top-left-radius: 4px;
            border-bottom-left-radius: 4px;
        }
        .type-badge { 
            font-size: 9px; 
            letter-spacing: 0.05em; 
            padding: 2px 8px; 
            border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.1); 
            background: rgba(255,255,255,0.03); 
        }
        .cat-line { 
            height: 1px; 
            flex-grow: 1; 
            background: linear-gradient(90deg, rgba(236, 72, 153, 0.3) 0%, transparent 100%); 
        }
        
        /* Month Tab Styling */
        .month-tab {
            transition: all 0.3s ease;
            position: relative;
        }
        .month-tab.active {
            color: #ec4899;
            background: rgba(236, 72, 153, 0.1);
            border-color: rgba(236, 72, 153, 0.3);
        }
        .month-tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 25%;
            right: 25%;
            height: 2px;
            background: #ec4899;
            box-shadow: 0 0 10px #ec4899;
            border-radius: 2px;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #ec4899; }
    </style>
</head>
<body class="p-6 md:p-12 min-h-screen">
    <nav class="max-w-5xl mx-auto flex justify-between items-center mb-16">
        <a href="/dashboard" class="flex items-center space-x-2 text-gray-400 hover:text-white transition-all group">
            <i data-lucide="arrow-left" class="w-4 h-4 group-hover:-translate-x-1 transition-transform"></i>
            <span class="mono text-[10px] uppercase font-bold tracking-widest">Back to Modules</span>
        </a>
        <div class="mono text-[10px] text-pink-500 uppercase font-black tracking-[0.3em] animate-pulse">Curriculum Dashboard</div>
    </nav>

    <main class="max-w-4xl mx-auto">
        <header id="course-header" class="mb-12">
            <h1 id="course-title" class="text-4xl md:text-6xl font-black mb-6 tracking-tighter text-white leading-tight">
                Loading Course...
            </h1>
            <div class="flex items-center gap-4">
                <p id="course-desc" class="text-gray-400 leading-relaxed max-w-2xl text-lg font-light"></p>
            </div>
        </header>

        <!-- Month Filter Section -->
        <section class="mb-12">
            <div class="flex items-center gap-3 mb-4">
                <i data-lucide="calendar" class="w-4 h-4 text-pink-500"></i>
                <span class="mono text-[10px] uppercase font-bold tracking-widest text-gray-500">Schedule Filter</span>
            </div>
            <div id="month-filter" class="flex flex-wrap gap-2 p-1.5 glass-card rounded-2xl inline-flex">
                <button onclick="filterByMonth('all')" data-month="all" class="month-tab active px-5 py-2.5 rounded-xl mono text-[11px] font-bold uppercase tracking-wider border border-transparent hover:bg-white/5 transition-all">
                    All Time
                </button>
                <!-- Dynamic Months will inject here -->
            </div>
        </section>

        <div id="lessons-container" class="space-y-16">
            <!-- Skeleton Loader -->
            <div class="animate-pulse space-y-8">
                <div class="h-8 bg-white/5 rounded w-1/4"></div>
                <div class="space-y-4">
                    <div class="h-20 bg-white/5 rounded-2xl w-full"></div>
                    <div class="h-20 bg-white/5 rounded-2xl w-full"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://tsaoxjzvhxiggntibpui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzYW94anp2aHhpZ2dudGlicHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ2OTAsImV4cCI6MjA5MTQyMDY5MH0.Q5Iu51O3NK4k2kcc_GoegnyAYIFIs2SUkQOV10qp2jI';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allLessons = [];
        const MONTH_NAMES = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];

        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) return window.location.href = 'login.html';

            const urlParams = new URLSearchParams(window.location.search);
            const newCourseId = urlParams.get('course_id') || urlParams.get('id');

            if (newCourseId) {
                localStorage.setItem('active_session_id', newCourseId);
                const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                window.history.replaceState({path: cleanUrl}, '', cleanUrl);
            }

            const courseId = localStorage.getItem('active_session_id');
            if (!courseId) {
                window.location.href = '/dashboard';
                return;
            }

            try {
                // Security check
                const { data: statusCheck, error: sErr } = await sb
                    .from('course_status')
                    .select('status')
                    .eq('user_id', session.user.id)
                    .eq('course_id', courseId)
                    .single();

                if (sErr || !statusCheck) throw new Error("Authorization record not found.");

                if (statusCheck.status !== 'approved') {
                    renderRestrictedUI(statusCheck.status);
                    return;
                }

                // Fetch Course Metadata
                const { data: course, error: cErr } = await sb
                    .from('courses')
                    .select('*')
                    .eq('id', courseId)
                    .single();
                
                if (cErr) throw cErr;
                document.getElementById('course-title').textContent = course.name;
                document.getElementById('course-desc').textContent = course.description;

                // Fetch Lessons (Including the 'month' column)
                const { data: lessons, error: lErr } = await sb
                    .from('lessons')
                    .select('*')
                    .eq('course_id', courseId)
                    .order('order_index', { ascending: true });

                if (lErr) throw lErr;
                
                allLessons = lessons;
                generateMonthFilters(lessons);
                renderCategorizedLessons(lessons);

            } catch (err) {
                renderErrorUI(err.message);
            }
        }

        /**
         * Create the month buttons based on data available in the lesson table
         */
        function generateMonthFilters(lessons) {
            const filterContainer = document.getElementById('month-filter');
            // Extract unique months from lessons
            const uniqueMonths = [...new Set(lessons.map(l => l.month))].filter(m => m != null).sort((a, b) => a - b);
            
            if (uniqueMonths.length === 0) return;

            uniqueMonths.forEach(monthNum => {
                const btn = document.createElement('button');
                btn.onclick = () => filterByMonth(monthNum);
                btn.setAttribute('data-month', monthNum);
                btn.className = "month-tab px-5 py-2.5 rounded-xl mono text-[11px] font-bold uppercase tracking-wider border border-transparent hover:bg-white/5 transition-all";
                btn.innerText = MONTH_NAMES[monthNum - 1] || `Month ${monthNum}`;
                filterContainer.appendChild(btn);
            });
        }

        /**
         * Filter UI logic
         */
        function filterByMonth(monthValue) {
            // UI Toggle
            document.querySelectorAll('.month-tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.getAttribute('data-month') == monthValue) tab.classList.add('active');
            });

            // Filter logic
            const filtered = monthValue === 'all' 
                ? allLessons 
                : allLessons.filter(l => l.month == monthValue);
            
            renderCategorizedLessons(filtered);
        }

        function renderCategorizedLessons(lessons) {
            const container = document.getElementById('lessons-container');
            
            if (!lessons || lessons.length === 0) {
                container.innerHTML = `
                    <div class="p-16 text-center glass-card rounded-[2.5rem] border-dashed border-2 border-white/5 animate-in fade-in zoom-in duration-500">
                        <i data-lucide="search-x" class="w-12 h-12 text-gray-700 mx-auto mb-4"></i>
                        <p class="text-gray-500 mono text-xs uppercase tracking-widest">No modules found for this period.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            const grouped = lessons.reduce((acc, lesson) => {
                const catName = lesson.categories || 'Core Curriculum';
                if (!acc[catName]) acc[catName] = { name: catName, items: [] };
                acc[catName].items.push(lesson);
                return acc;
            }, {});

            container.innerHTML = Object.entries(grouped).map(([name, data]) => {
                const color = stringToColor(name);
                return `
                    <section class="category-group animate-in fade-in slide-in-from-bottom-4 duration-500">
                        <div class="flex items-center gap-6 mb-8">
                            <h3 class="mono text-[11px] font-black uppercase tracking-[0.4em]" style="color: ${color}">
                                ${name}
                            </h3>
                            <div class="cat-line" style="background: linear-gradient(90deg, ${color}44 0%, transparent 100%)"></div>
                            <span class="mono text-[10px] text-gray-600 font-bold whitespace-nowrap">${data.items.length} MODULES</span>
                        </div>
                        <div class="grid gap-4">
                            ${data.items.map(lesson => renderLessonItem(lesson)).join('')}
                        </div>
                    </section>
                `;
            }).join('');

            lucide.createIcons();
        }

        function stringToColor(str) {
            if (str === 'Core Curriculum') return '#ec4899';
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const c = (hash & 0x00FFFFFF).toString(16).toUpperCase();
            return "#" + "00000".substring(0, 6 - c.length) + c;
        }

        function renderLessonItem(lesson) {
            const type = (lesson.lesson_type || 'youtube').toLowerCase();
            let icon = 'play';
            if (type === 'pdf') icon = 'file-text';
            if (type === 'zoom' || type === 'live' || type === 'video') icon = 'video';

            return `
                <div class="glass-card p-6 rounded-2xl border-l-4 border-l-transparent lesson-item flex items-center justify-between group">
                    <div class="flex items-center space-x-6">
                        <div class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-white/30 font-black text-[11px] mono border border-white/5 group-hover:bg-white/10 group-hover:text-white/60 transition-colors">
                            ${lesson.order_index?.toString().padStart(2, '0') || '00'}
                        </div>
                        <div>
                            <div class="flex items-center gap-3 mb-1.5">
                                <h4 class="font-bold text-lg text-white group-hover:text-pink-400 transition-colors tracking-tight">
                                    ${lesson.title}
                                </h4>
                                <span class="type-badge mono text-gray-500 font-bold uppercase">${type}</span>
                            </div>
                            <div class="flex items-center gap-4">
                                <p class="text-[10px] text-gray-500 mono uppercase tracking-widest flex items-center gap-2">
                                    <i data-lucide="clock" class="w-3 h-3 text-pink-500/50"></i>
                                    ${lesson.watchtime_minutes || 0} MINS
                                </p>
                                ${lesson.month ? `
                                    <span class="text-[9px] mono text-pink-500/50 uppercase font-bold border border-pink-500/20 px-2 py-0.5 rounded-md">
                                        ${MONTH_NAMES[lesson.month - 1]}
                                    </span>
                                ` : ''}
                                ${lesson.is_completed ? `
                                    <span class="text-[9px] mono text-emerald-500 uppercase font-bold flex items-center gap-1">
                                        <i data-lucide="check-circle-2" class="w-3 h-3"></i> Completed
                                    </span>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                    <a href="/learn/${type}?id=${lesson.id}" 
                       class="w-12 h-12 rounded-2xl bg-white/5 flex items-center justify-center text-gray-500 group-hover:bg-pink-600 group-hover:text-white group-hover:rotate-6 transition-all duration-300 shadow-xl shadow-black/20">
                        <i data-lucide="${icon}" class="w-5 h-5 ${icon === 'play' ? 'ml-0.5' : ''}"></i>
                    </a>
                </div>
            `;
        }

        function renderRestrictedUI(status) {
            document.getElementById('lessons-container').innerHTML = `
                <div class="p-16 text-center glass-card rounded-[2.5rem] border-yellow-500/20 bg-yellow-500/5">
                    <i data-lucide="lock" class="w-12 h-12 text-yellow-500 mx-auto mb-6"></i>
                    <h3 class="text-xl font-black text-white uppercase mb-2">Access Restricted</h3>
                    <p class="text-gray-400 text-sm max-w-xs mx-auto mb-8">
                        Your enrollment status is currently <strong>${status.toUpperCase()}</strong>.
                    </p>
                    <a href="/dashboard" class="inline-flex items-center gap-2 px-8 py-3 bg-white/5 hover:bg-white/10 text-white rounded-xl text-[10px] font-black uppercase tracking-widest transition-all">
                        Return to Terminal
                    </a>
                </div>
            `;
            lucide.createIcons();
        }

        function renderErrorUI(msg) {
            document.getElementById('lessons-container').innerHTML = `
                <div class="p-8 border border-red-500/20 bg-red-500/5 rounded-3xl text-center">
                    <i data-lucide="alert-circle" class="w-8 h-8 text-red-500 mx-auto mb-4"></i>
                    <p class="text-red-400 mono text-xs uppercase font-bold mb-2">Data Fetching Failed</p>
                    <p class="text-gray-500 text-sm max-w-xs mx-auto">${msg}</p>
                </div>
            `;
            lucide.createIcons();
        }

        window.onload = init;
    </script>
</body>
</html>
